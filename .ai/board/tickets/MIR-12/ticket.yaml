# [predicted] at plan time. Corrected at ship in .ai/board/plans/feature-change-log.md.
mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan P3-3 (plan:182-187):
  - Add `org_id` nullable everywhere
  - Create the `Org public` row; backfill every existing team and member into it
  - Backfill `membership` from today's `member.team_id`, with `is_primary = true`
  - Set `org_id` NOT NULL
  - (Drop `member.team_id` only after all readers move to `membership` — split out as MIR-21)

  Blocked by MIR-10 (P3-1, "approve before any migration", plan:167). Each migration must be
  independently shippable and reversible (plan:323).

  ORDER DECIDED 2026-10-12 (the operator delegated the choice): the plan's last step waits for "all
  readers" to move to `membership`, which is MIR-13's work, while MIR-13 rewrites policies against the
  `membership` rows this item backfills. The step is split out as MIR-21, appended per the family rules,
  so the order is MIR-12 → MIR-13 → MIR-21 with no cycle.

  Audit references — what breaks under `org_id NOT NULL` (A:917-939):
  - Admission trigger inserts without `org_id`, and `exception when others` swallows the error — `avatar_images:63-79`
  - A pending sign-up has no org to attach — `member_approval:50`, `avatar_images:66`
  - `createEntry` — `supabase.ts:1865-1877`, `cal01:192`
  - `entry_apply_approval_setting` — `approval_settings:111-118`
  - `create_team` — `many_teams:93`
  - Bootstrap — `supabase/bootstrap.sql:175`, `:186`
  - Seed — `supabase/seed.sql:51`, `:91`, `:182`, `:505`, `:548`, `:601`
  - Account script — `supabase/create-account.sql:152`
  - Holiday seed and `unique(date)` — `adm02seed:30`, `adm02:33`
  - `addHoliday` — `supabase.ts:2694-2698`
  - `save_event` / `event_stamp` — `evt02:168-172`, `evt01:105`; invitees `evt02:206-213`
  - `joinEvent` — `evt02:406`, `supabase.ts:3380-3384`
  - `register_guest` — `evt07:373-375`
  - `notify()` — `evt04:133-142`
  - `createIssueReport` — `supabase.ts:3059-3070`, `issue_img:78`
  - `setOwnBusyDay` — `busy_day:81`, `supabase.ts:2602-2604`
  - `ADD COLUMN … NOT NULL` without a default fails on a non-empty table — every table in audit §1
  - Client types, mock and fixtures — `src/lib/domain/types.ts`, `src/lib/data/mock.ts`, `src/lib/fixtures.ts`
  - `supabase/db.sql` drifts further
