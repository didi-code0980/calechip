mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan P1-3 (plan:124-127):
  - `mock.ts:366-369` `currentAdmin` does not check `status === 'approved'`; the real `is_admin` does. Align it.
  - Make `updateOwnProfile` in the mock accept the same column set the real grant allows
  - Add a parity test that fails when mock and SQL disagree on a permission decision

  Audit references:
  - `mock.ts:366-369` looser than `is_admin` (A:907-908)
  - Mock `updateOwnProfile` writes only name and avatar (A:35-36, A:909-910)
  - `tests/signup-confirmation.test.ts:195-211` is named for a refusal the mock (`mock.ts:1412`) does
    not implement — it refuses only a team that does not exist (A:756-760)
