# 01-plan.md section 2. EXACTLY the three the ADM-05 row in features.md lists; this plan adds none
# and removes none.
#
# INV-02: held by `entry_enforce_decision()` clause (c), which CAL-01 shipped and this ticket does
# not alter. Listed because this ticket CREATES THE APPROVED STATE that makes the trigger observable
# at all -- until now nothing in the product could set `status` to `approved`, so clause (c) has
# never had a live case -- and because it amends the function that holds it. AC-12 and AC-14.
#
# INV-03: held by the check constraint `entry_rejection_reason_iff_rejected`, which is a
# BICONDITIONAL (supabase/db.sql:213) and so holds both directions. This ticket is the first to write
# the column. The interface's required-reason field is an AFFORDANCE, not the mechanism -- and
# clause (b)'s nulling of the reason on approval is FORCED by the same constraint. AC-3 and AC-4.
#
# INV-05: reached indirectly and listed for it. Approval and tentativeness are two independent axes,
# and an approval that cleared `tentative` would change what the entry contributes on the absence
# count's own terms. Held BY ABSENCE: clause (b) touches three columns and never that one, and the
# update grant this ticket adds names two columns and not that one. AC-6.
#
# INV-04 is deliberately absent -- the row says so: rejecting changes what the count READS and
# computes no count, the argument that kept it off CAL-01 and CAL-08. INV-01 is absent for a
# different reason worth keeping: ADR-011 makes a rejected entry still occupy its slots, which is
# what makes AC-13's edit path the likely one, and nothing here changes the constraint.
