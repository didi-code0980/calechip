# Created by `product` at /triage on 2026-08-31, promoting
# .ai/board/ideas/2026-08-31-no-way-to-tell-a-settled-plan-from-a-typed-one.md.
#
# Definition of Ready items 1, 3, 4 and 6 are filled here. Items 2 and 5 belong to the BA at SPEC.
#
# Item 6. One group: ADM. The write path over ADM-04's surface.
#
# Item 3. ADM-04 for the surface -- CAL-05 says displaying who approved is not approving, so no
# admin control reaches the calendar views and this ticket has nowhere else to land. CAL-02
# because the guard's correctness is DEFINED against `entry_update_own` existing: it is the
# permissive own-entry policy the guard exists to compensate for, and testing the denial without
# it tests nothing. CAL-02 transitively carries CAL-01 and TEA-01.
#
# Item 4. Not `none`, and this is the ticket where the idea's claim that it "consumes the
# permission model rather than deciding it" turned out to be false -- the model as written cannot
# be built. An RLS `with check` sees the NEW row and has no OLD, so "status did not change" is
# not expressible, and a column grant cannot separate admin from member because both are the same
# PostgreSQL role, `authenticated`. ADR-016 (ACCEPTED by tech-lead-design) decides the guard is a
# BEFORE UPDATE trigger merged into the one INV-02 already needs. ADR-014 would require the ADR
# link for the policy alone.
#
# Two things the design must not lose:
#   - CAL-01 creates public.entry_enforce_decision() in its INV-02-only form, so this ticket uses
#     `create or replace function` and must NOT add a second BEFORE UPDATE trigger to `entry`:
#     PostgreSQL fires same-event triggers alphabetically by name.
#   - Clause order. The guard reads the values the client sent, before the INV-02 reset touches
#     them; reversed, the guard sees a status change made by the reset and refuses a member's
#     legitimate edit. ADR-016 section 1.
