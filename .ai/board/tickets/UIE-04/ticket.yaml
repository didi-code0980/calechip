# Created by `product` at /triage on 2026-09-05, on a PROMOTE verdict, from
# .ai/board/ideas/2026-09-05-the-product-has-no-shell-and-every-screen-starts-over.md.
# That file's *Triage verdict* section is the reasoning; this block carries only what binds PLAN.
#
# ***THE THIRD OF THREE TICKETS FROM ONE IDEA, AND THE ORDER IS STRICTLY SEQUENTIAL:***
#   UIE-01 -> UIE-02 -> UIE-03 -> UIE-04.
# One working directory holds one branch (ADR-006), so exactly one of these is ever in flight.
# UIE-02 builds the shell, UIE-03 removes the chrome it makes redundant, and ***THIS TICKET IS THE
# GRID ITSELF.***
#
# ***WHY IT IS NOT FOLDED INTO UIE-03, WHICH IS ALREADY IN THE SAME FILE.*** Removing a <header> is
# MECHANICAL — one acceptable output, reachable without taste. ***REWRITING A STACKED LIST INTO
# SEVEN COLUMNS IS A DESIGN DECISION THAT MAY NOT SURVIVE CONTACT WITH A FULL WEEK***, and §3 is the
# arithmetic showing it probably does not. Folding them together buries a decision inside a
# deletion, and the deletion is the half that would get reviewed.
#
# THE VISUAL REFERENCE IS .ai/board/tickets/UIE-02/design/README.md — the CANONICAL copy, and it is
# a transcription rather than an image. .ai/board/tickets/UIE-04/design/README.md quotes only the
# part this ticket owns and points there for the whole.
#
# Definition of Ready items 1, 3, 4 and 6 are filled here — they are produced at BACKLOG (ADR-010).
# Items 2 and 5 (invariants_touched, size_estimate) are deliberately left as the template ships
# them: they belong to tech-lead-design at PLAN, and the gate sits after PLAN so that they can.
#
# ---------------------------------------------------------------------------------------------
# 1. WHAT THE TRANSCRIPTION ASKS FOR
#
# Seven equal columns filling the width beside the sidebar, each a tall white rounded card with a
# soft shadow, ~8px gutters, running from just under the top bar to just above the bottom of the
# viewport. Each column has a header strip — a bold weekday abbreviation then a lighter date — and a
# footer strip. In the transcription the week is EMPTY and a mascot card floats over the fourth
# column.
#
# ***THE TRANSCRIPTION SHOWS AN EMPTY WEEK, WHICH IS THE ONE CASE THAT PROVES NOTHING.*** It does
# not show an entry chip, a full column, or an overloaded day. §3 is what happens when the week is
# not empty, and it is the whole substance of this ticket.
#
# ---------------------------------------------------------------------------------------------
# 2. SCOPE — TWO FILES, POSSIBLY THREE
#
#   src/routes/WeekView.tsx                  the grid, below the <header> UIE-03 removed
#   tests/e2e/cal-05-week-view.spec.ts       whatever §3's chosen option costs it
#   tests/e2e/cal-07-overload-warning.spec.ts   POSSIBLY. It signs in and reaches this screen; PLAN
#                                               must check whether it addresses anything this
#                                               layout moves before deciding it is out.
#
# ---------------------------------------------------------------------------------------------
# 3. ***THE DENSITY DEFECT. IT IS IN THE MOCKUP, NOT IN THIS TICKET, AND PLAN MUST CHOOSE.***
#
# ***THE ARITHMETIC, MEASURED AT TRIAGE. CARRY IT; DO NOT RE-DERIVE IT.***
#
#   Width, at 1440px:   1440 - 215 sidebar - ~48 gutters and padding = ~1177 / 7 = ***~168px per
#                       column.***
#   Height, at 1080px:  1080 - 70 top bar - ~24 margin = ~986px, less the header strip and the
#                       footer strip = ***~910px of body.***
#
# ***WHAT ONE ENTRY COSTS AT 168px.*** src/routes/WeekView.tsx:336-400 renders, per entry: avatar,
# name, type label and portion pill on a WRAPPING FLEX ROW, then `week-row-note` and
# `week-row-approver` each `basis-full` — i.e. ***EACH ON ITS OWN LINE BY CONSTRUCTION***
# (src/routes/WeekView.tsx:388 and :397). At 168px the first row wraps to three or four lines, plus
# a note line, plus an approver line: ***90-110px per chip.***
#
# ***THE WORST REALISTIC CASE IS NOT EIGHT CHIPS, IT IS SIXTEEN.*** src/routes/WeekView.tsx:314-316
# states it: one member may hold a morning AND an afternoon entry on the same date, and that pair is
# TWO ROWS.
#
#    8 chips x 95px =  760px  -> fits, barely, with nothing to spare
#   12 chips        = 1140px  -> OVERFLOWS
#   16 chips        = 1520px  -> OVERFLOWS BY SIXTY PER CENT
#
# ***THE FAILURE MODE IS THE BAD ONE.*** Seven independently scrolling columns means ***YOU CANNOT
# SEE THE WHOLE WEEK AT ONCE*** — which is the entire purpose of the week view, and a direct
# contradiction of CLAUDE.md § Visual direction: *information density wins there every time*.
# ***TODAY'S STACKED LAYOUT (src/routes/WeekView.tsx:290-292) SCROLLS ONCE, VERTICALLY, AND NEVER
# HIDES A DAY.*** The mockup's layout is not obviously an improvement on it once the week has
# entries in it, and nobody has seen it with entries in it.
#
# ***PLAN MUST WRITE AN ACCEPTANCE CRITERION AGAINST ONE OF THESE THREE, AND CANNOT WRITE "LOOKS
# LIKE THE SCREENSHOT"*** — .ai/standards/ui-design-system.md:137-138 says so in those words.
#
#   OPTION 1 — COLUMNS GROW; THE PAGE SCROLLS.
#     Drop the mockup's fill-the-viewport property. CHEAPEST. Keeps every selector and every
#     acceptance criterion. Loses the crisp bottom edge the transcription shows.
#
#   OPTION 2 — COMPRESS THE CHIP FOR 168px.
#     Avatar, name and a portion glyph; note and approver behind an expand. ***THIS DELETES
#     `week-row-note` AND `week-row-approver` FROM THE RESTING VIEW, WHICH CAL-05's AC-6 AND AC-7
#     ASSERT AND tests/e2e/cal-05-week-view.spec.ts TESTS.*** It is ***AN ACCEPTANCE-CRITERION
#     AMENDMENT, NOT A RESTYLE***, and PLAN must treat it as one.
#
#   OPTION 3 — COLUMNS ABOVE A BREAKPOINT, STACKED ROWS BELOW.  ***TRIAGE'S RECOMMENDATION.***
#     Keeps the mockup where it was drawn and the shipped layout where it still works. It also
#     answers the thing the mockup is silent about — narrow widths — which nothing shipped so far
#     states either (.ai/standards/ui-design-system.md:165 is a `TODO(project)` for exactly that).
#
# ***THE RECOMMENDATION IS EVIDENCE FOR PLAN, NOT AN ANSWER TO IT.*** Choosing is
# tech-lead-design's under the § Visual specification grant; triage's job was to make sure the
# choice is made deliberately rather than discovered at 168px.
#
# ---------------------------------------------------------------------------------------------
# 4. ***TWO THINGS IN THE MOCKUP ARE NOT LAYOUT AT ALL, AND PLAN MUST NOT TREAT THEM AS SUCH.***
#
# ***THIS IS A REGISTRY MATTER, NOT A LAYOUT ONE. READ IT BEFORE §3.***
#
# 4.1 ***`0/8 vắng` IS AN ABSENCE COUNT ON A SCREEN BUILT DELIBERATELY WITHOUT ONE.***
#     src/routes/WeekView.tsx:11-16, verbatim in substance: *"IT COUNTS NOTHING. No absence count,
#     no overload state, no threshold, and `seam.getTeam()` is deliberately not called"* — because
#     CAL-05's feature row says so, and ***BECAUSE A SECOND COUNT WOULD BE THE SECOND DEFINITION
#     INV-04 EXISTS TO FORBID.***
#
# 4.2 ***`Quá tải (>50%)` IN THE LEGEND NEEDS `overloadThreshold`***, which comes from the very
#     `getTeam()` call the same paragraph refuses.
#
# ***BOTH ARE BEHAVIOUR, NOT VISUAL ARRANGEMENT, SO THE § Visual specification GRANT
# (.ai/standards/ui-design-system.md:140-155) DOES NOT COVER EITHER.*** Reproducing that footer
# strip and that legend row ***REVERSES A DECISION IN CAL-05's REGISTRY ROW AND NEEDS A FEATURE-ROW
# AMENDMENT*** — RULE-01, human plane. ***IT IS NOT SOMETHING PLAN MAY WRITE INTO AN ACCEPTANCE
# CRITERION ON ITS OWN AUTHORITY. IF PLAN CONCLUDES IT NEEDS ONE, IT STOPS AND ASKS.***
#
# ***TRIAGE'S RECOMMENDATION, TO BE WRITTEN AS AN ACCEPTANCE CRITERION RATHER THAN ASSUMED:***
#   - Render the footer strip with ***THE DAY'S OWN CHIP COUNT ONLY, NOT `n/total vắng`.*** That is
#     a fact the screen already has in hand — it is rendering those chips — and it costs no
#     arithmetic, no roster read, no threshold and no team call. It is not INV-04's number and must
#     not be labelled as though it were.
#   - ***OMIT THE `Quá tải` LEGEND ROW ENTIRELY*** until whoever brings the overload state to this
#     view brings its colour with it.
#
# 4.3 ***THE MOCKUP'S ROSTER OF EIGHT IS FICTIONAL AND NOTHING MAY BE ASSERTED FROM IT.***
#     src/lib/fixtures.ts holds FOUR members on the main team who have not been removed — :39, :72,
#     :149, :319. :108 is another team and :123 carries `removedAt`. `TEAM (8)` and `0/8 vắng`
#     cannot be reproduced from fixtures, so a test written against either asserts a number this
#     repository cannot produce.
#
# ---------------------------------------------------------------------------------------------
# 5. `depends_on: [UIE-03]` — ***AND IT FAILS DEFINITION OF READY ITEM 3 TODAY, ON PURPOSE***
#
# Item 3 requires every ticket named in `depends_on` to be DONE. UIE-03 is `BACKLOG`, so this ticket
# FAILS item 3 as it stands. Deliberate, and stated the way OPS-002 §3 states the same thing.
#
# ***IT IS A FILE COLLISION AND A CORRECTNESS ONE AT THE SAME TIME.*** UIE-03 removes
# src/routes/WeekView.tsx:249-286 — the whole <header> — from the same file this ticket rewrites
# below line 290; and the ~168px column width in §3 is arithmetic against ***A SHELL THAT MUST
# ALREADY EXIST***, since the 215px sidebar is UIE-02's. Running this first computes a column width
# against a viewport that no longer exists by the time anyone sees it. One working directory, one
# branch (ADR-006).
#
# ***UIE-01 -> UIE-02 -> UIE-03 -> UIE-04 IS THE WHOLE CHAIN AND `depends_on` NAMES ONLY THE
# LINK.*** The three before are not repeated here; each names its own, and a shell that restated the
# chain would have four places to keep true.
#
# ---------------------------------------------------------------------------------------------
# 6. NOTE ON `invariants_touched` — ***THE ONE OF THE THREE TICKETS WHERE THIS IS NOT RHETORICAL***
#
# Left as the template's `[]`, which is the DEFAULT and NOT an answer.
# .ai/registry/invariants.md warns that concluding "none" from safe behaviour is circular reasoning,
# and here the warning has a name: ***INV-04.*** A footer strip that counts is one line of code away
# from being a second definition of the absence count, and CAL-04's registry row spent its whole
# length insisting there be exactly one — ONE PURE FUNCTION IN src/lib/data/absence.ts, imported by
# both seam implementations and reimplemented in neither, because two copies agree until one is
# edited and every test stays green while INV-04 is violated.
#
# ***SO PLAN'S ANSWER TO ITEM 2 DEPENDS ON ITS ANSWER TO §4.*** If the footer counts chips it has
# rendered, nothing is touched. If it counts absences, INV-04 is engaged, `invariants_touched` is
# not `[]`, and §4's stop-and-ask has already fired. CAL-05's own row lists INV-04 for a related
# reason worth reading before deciding: that view presents the SAME SET the count sums, so a week
# list disagreeing with a month cell is exactly the divergence the invariant forbids.
#
# ADR-028 records separately that `Invariants touched` will be `[]` on almost every UIE row, and
# says so as a COST of the group rather than as permission to skip the question. ***THIS IS THE ROW
# MOST LIKELY TO BE THE EXCEPTION.***
#
# ---------------------------------------------------------------------------------------------
