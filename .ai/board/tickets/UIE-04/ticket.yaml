# 8. THE ROW IN .ai/registry/features.md
#
# THERE IS A ROW: `UIE-04`, in the `## UIE` section, `Status: PLANNED`, `Invariants touched: []`,
# citing the idea file by name — the provenance ADR-007 requires of every promoted row, written by
# `product` at /triage. ***ITS `Notes` CARRIES §3's ARITHMETIC AND §4's REGISTRY PROBLEM***, because
# those are the two things a later reader needs most and neither may live only in a ticket shell.
#
# ***feature_ids IS [UIE-04] ALONE.*** .ai/01-operating-model.md:317 makes the ticket ID equal the
# feature ID in the 1:1 case, and this is exactly that case. ***CAL-05 IS NOT LISTED***, although
# this ticket rewrites the screen CAL-05 shipped and §3's Option 2 would amend two of its acceptance
# criteria: listing it would claim this ticket DELIVERS the week view, which it does not. The link
