# [predicted] at plan time. Corrected at ship in .ai/board/plans/feature-change-log.md.
mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan P4-2 (plan:238-244):
  - `mayAdminister`, `mayDecide`, `mayDecideEntriesOf` all take a team or org parameter (`src/lib/roles.ts`)
  - Replace every `me.role !== "admin"` guard — `AdminHub`, `NewSignups`, `Threshold`, `Teams`,
    `IssueReports`, `TeamEntries`, `Holidays`
  - `canRemove`, `canPromote`, `canSetManager` scoped correctly (`MemberList.tsx:349-366`)
  - `mayEditEvent` currently has no team comparison (`EventDetail.tsx:51-53`)
  - `Teams.tsx:337` labels managers as "Member" — fix
  - Router has no role guards at all; add them

  Audit references (A:504-536, A:956-963):
  - `src/lib/roles.ts:24`, `:36-37`, `:46-49`, `:59`; `MemberRole` `src/lib/domain/types.ts:21`
  - `src/lib/viewed-team.ts:61`, `:85`; `src/hooks/useViewedTeam.tsx:56,76`
  - `src/components/AdminLayout.tsx:133-137`, `:190-192`; `AdminTabs.tsx:323`; `TopBar.tsx:274-283`
  - `AdminHub.tsx:72`, `NewSignups.tsx:76`, `Threshold.tsx:125`, `Teams.tsx:81`, `IssueReports.tsx:94`,
    `TeamEntries.tsx:82`, `Holidays.tsx:216`
  - `PendingEntries.tsx:245`, `:621`; `EditEntry.tsx:88-91`; `MemberList.tsx:148-153`, `349-366`
  - `EventDetail.tsx:51-53`; `EventAttendancePanel.tsx:68-79` (`named` branch keyed on admin, `:77`)
  - `Teams.tsx:337`; router `src/App.tsx` has no role guards
  - Mock: `currentAdmin`, `eventIsAdmin`, `setRank` — `src/lib/data/mock.ts:366-369`, `661-662`, `413-431`
