mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan P3-2 (plan:175-180):
  - `team`: `unique (id, org_id)`
  - `membership`: `unique (id, org_id)`, FK `(team_id, org_id)` → `team (id, org_id)`
  - `entry`: FK `(member_id, org_id)` → `member (id, org_id)`
  - Same pattern for `event`, `event_invitee`, `event_attendance`, `busy_day`, `notification`, `issue_report`
  - Prove with a pgTAP test that a cross-org insert is refused at the DB level even when application code gets it wrong

  Blocked by MIR-10 because P3-1 is "approve before any migration" (plan:167).

  Audit references: the current foreign keys of each table, audit §1 (A:103-305) — e.g. `entry.member_id`
  → `member (id)` (`cal01:45-97`), `event.team_id` → `team (id)` (`evt01:57-77`).
