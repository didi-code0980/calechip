mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan P4-3 (plan:246-251):
  - Separate route, not indexed: `X-Robots-Tag: noindex` header, **not** `robots.txt` — listing it there publishes the path
  - Separate account store, 2FA required
  - IP allow-list if feasible
  - Rate limiting and failed-login logging
  - Org CRUD, caps, licence state, move-team-between-orgs

  MOVED FORWARD by the operator, 2026-10-12. The plan places this in Phase 4 (P4-3); MIR-15 (Phase 3)
  needs its move-team-between-orgs, so it now runs in Phase 3 — after MIR-10 (the `org` design) and
  MIR-12 (the `org` rows exist) — and Phase 4 waits for it. As a phase 3 item it now needs `Verified`.

  Audit references:
  - A `system_admin` with no `member` row lands on the member-less screen — `src/hooks/useSession.ts:89-93` (A:949)
  - The router has no role-based guards; every guard is on `membership.state` (A:536)
