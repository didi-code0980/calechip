# Created by `product` at /triage on 2026-08-31, promoting
# .ai/board/ideas/2026-08-31-the-team-cannot-see-its-own-shape.md.
#
# Definition of Ready items 1, 3, 4 and 6 are filled here — they are produced at BACKLOG.
# Items 2 and 5 (invariants_touched, size_estimate) are deliberately empty: they belong to the BA
# at SPEC, and the gate sits after SPEC so that they can.
#
# Item 3, and why TEA-03 is in it rather than only CAL-01. CAL-01 supplies the `entry` table and
# `date_range`, the column ADR-011 created so the month read is one PostgREST filter. TEA-03 is here
# for the policy rather than the screen: this view renders `display_name` and `avatar`, and reading
# any `member` row at all needs a select policy on `member` under ADR-005, which is TEA-03's.
# If that policy ships in TEA-01's migration instead, the dependency reduces to [CAL-01].
#
# Item 4: `schema_delta: none`. This row reads; it writes nothing and adds no column. The one
# schema-adjacent gap is recorded in the registry row instead — no feature yet owns writing the
# `team` select policy that reading `overload_threshold` needs.
