# [predicted] at plan time. Corrected at ship in .ai/board/plans/feature-change-log.md.
mir_detail: |
  The holiday item of MIR-15, transcribed from MIR-15's ticket.yaml `mir_detail` (plan P3-6,
  plan:209) and ADR-070 § 4's `holiday` bullet. Nothing is added except the two facts found on disk
  at /plan MIR-15, each with its file:line:

  - Only `system_admin` sets holidays for Org public (plan:209; ADR-070 § 4: "In Org public
    (`is_shared_tenant = true`), holiday rows are the system-owned national set and may be written
    only by `system_admin` (MIR-15)").
  - Today `holiday_insert_admin` / `holiday_update_admin` / `holiday_delete_admin` admit any
    `is_admin` caller on their own org (supabase/migrations/20261103120000_mir13_write_path_org_bound.sql:830-856),
    and every member today is in Org public, so every admin still writes the national set.
  - FOUND AT /plan MIR-15: `holiday_select_all` is still `using (true)`
    (supabase/migrations/20260905120000_adm02_holiday.sql:58-59) and `listHolidays` filters by date
    only. Since MIR-18-b's `create_org` copies Org public's rows into a new org, a date then has one
    row per org and every member reads all of them. ADR-059 decision 1 ("its own holidays") and
    ADM-03's `unique (date)` rationale (one status per date) both need the read bounded by org.
  - A system admin has no member row (ADR-074), so the write needs a door the panel can use, and the
    member app's Holidays screen needs to stop offering edits an Org public admin can no longer make.
