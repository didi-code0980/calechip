mir_detail: |
  Slice of P4-1 (ADR-085 decision 2). Moved here from MIR-16-c at /plan MIR-16-c on 2026-11-08.
  After MIR-16-c, nothing reads member.role = 'manager'; set_member_role still writes it.
  - set_member_role(uuid, public.member_role) writes membership.team_role only, or is replaced by
    a team-role setter; its signature names the type being re-created
  - member rows with role 'manager' move to 'member'. member_record_role_change would write one
    audit row per manager for a change no person made (ADR-084 Context's reasoning for admins);
    decide at PLAN
  - member_role_change.from_role / to_role hold 'manager' in history rows; decide what they become
    before the type loses the value
  - public.member_role re-created as ('member', 'org_admin') (ADR-070 § 1)
  - tests.seed() (_isolation.psql:116, :122), tests.member_role's 'manager' branch, seed.sql, and
    the pgTAP files that insert or assert 'manager': 040, 070, 100, 140, 150, 230, 250, 270-member,
    290, 300 (grep at /plan MIR-16-c)
  - the member seam already reads the manager rank from roster_team_role (MIR-16-c)
  Not counted at /plan MIR-16-c. Expected to split again at its own PLAN.
