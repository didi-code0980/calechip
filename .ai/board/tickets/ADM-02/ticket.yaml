# Created by `product` at /triage on 2026-08-31, promoting
# .ai/board/ideas/2026-08-31-everyone-computes-the-bridge-day-alone.md.
#
# Definition of Ready items 1, 3, 4 and 6 are filled here. Items 2 and 5 (invariants_touched,
# size_estimate) are deliberately empty: they belong to the BA at SPEC, and the gate sits after
# SPEC so that they can.
#
# Item 6. One group: ADM. The split from ADM-03 is by operation rather than by surface, per the
# operating model's "split by operation first (read path, then write path), then by surface".
# This ticket makes the calendar exist and be readable; ADM-03 makes it editable. Each is
# exercisable end to end at its own QA gate.
#
# Item 3. TEA-01 for the admin session, the `member` row with `role = admin` and the
# `public.is_admin(uuid)` helper the later write policies consult. ADM-01 because its own Notes
# say the later admin rows inherit its screen-versus-settings-area answer — a real edge, not a
# courtesy, since this ticket ships the product's second admin screen.
#
# Item 4. Not `none` under any reading: a new table, a new enum and a select policy. ADR-015 is
# linked and is `ACCEPTED by tech-lead-design` — it closes data-model.md OPEN QUESTIONS items 1
# and 2, which had declared themselves blocking on "the first story touching holidays, and the
# `holiday` foreign key". The answer is that there is no foreign key: the calendar is national.
#
# Two file facts verified against the implemented TEA-01 migration rather than recalled:
#   - `revoke all on public.team, public.member, public.allowed_email from anon, authenticated`
#     at supabase/migrations/20260831150024_tea01_membership.sql:145. `holiday`'s table grant is
#     therefore genuinely not inherited and must be written beside the policy.
#   - `grant execute on function public.is_admin(uuid) ... to authenticated` at line 71 of the
#     same file, so no function grant is needed here or on ADM-03.
#
# The seed is data, not a capability: an idempotent data migration with
# `on conflict (date) do nothing`, applied by a human (RULE-09), on the TEA-01 precedent that a
# seed gets no feature row of its own. `do nothing` and not `do update`, so that an admin's
# correction from the actual government announcement survives re-application.
