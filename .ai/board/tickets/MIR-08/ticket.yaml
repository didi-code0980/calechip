mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan P2-1 (plan:142-145):
  - Generate the real schema from the applied migrations
  - Replace `supabase/db.sql` with the generated dump, or delete it and document migrations as the only source
  - If kept, add a CI check that regenerates it and fails on drift

  Audit references (A:307-337): db.sql calls itself "the whole schema" (`db.sql:1`) and stops around
  2026-09-05. The twelve discrepancies:
  1. `member.team_id` not null in db.sql (~`db.sql:146`), dropped at `member_approval:50`
  2. `member` columns missing: `status`, `last_sign_in_at`, `email`, `event_email_enabled`
  3. `team` columns missing: `wfh_need_approve`, `pto_need_approve`
  4. `allowed_email` still created (`db.sql:157`) with three policies (`db.sql:825/841/854`)
  5. Tables missing: `busy_day`, `issue_report`, `event`, `event_invitee`, `event_attendance`,
     `event_guest_link`, `event_guest`, `notification`
  6. Functions missing (`list_teams` … `move_member`, the three `*_for_team`, `set_member_role`,
     `entry_apply_approval_setting`, the `auth.users` sync triggers)
  7. Policies missing: `team_select_own` (`cal04:36`), `team_update_admin` (`adm01:62`),
     `member_update_own`, `member_select_pending_admin`, `member_decide_admin`
  8. §9.1 / §9.2 stale on `team` policies
  9. §9.3 stale: holidays are seeded
  10. `is_admin` / `member_team_id` old bodies (`db.sql:317/329`) without `status = 'approved'`
  11. Admission trigger `db.sql:343` is the TEA-01 version
  12. `member_role` enum declared directly (`db.sql:82`) vs `alter type` (`manager_role:36`)
