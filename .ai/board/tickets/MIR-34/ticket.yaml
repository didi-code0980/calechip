  - No roster, no approval UI, no overload warning
  - One-person variants of the week, month and year views

  PHASE 5, DECIDED by the operator 2026-10-20: after the role split (MIR-16, MIR-17), with the
  personal-space route (MIR-33).

  Blocked by MIR-16, MIR-17, MIR-27 (what the database forces, which the interface mirrors), MIR-28 and
  MIR-33.

  The layout of the one-person variants is a visual arrangement, which `tech-lead-design` may originate
  at PLAN (CLAUDE.md, *No invention* carve-out). Behaviour is fixed by MIR-27.
