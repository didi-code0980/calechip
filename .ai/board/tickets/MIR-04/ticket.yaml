mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan P0-4 (plan:88-90):
  - Scope `list_member_directory` (`evt01:154-163`) to the caller's own teams
  - Audit the event-invitee check (`evt01:215-220`) — it only requires the invitee to have a team

  Audit references:
  - `supabase.ts:3285-3292` → `evt01:154-163` `list_member_directory`, gated by
    `member_team_id(auth.uid()) is not null and m.status = 'approved'` (A:394)
  - Invitee check in `save_event`: `evt01:215-220` / `evt02:192-197` (A:427)
  - Policy `event_invitee_insert_manage`, `evt01:306-311` (A:430)
  - `save_event(p_invitee_ids)` (A:763)
