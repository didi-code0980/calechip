mir_detail: |
  The read slice of P3-4. MIR-13 (the write slice) ships first and leaves, in the database:
  `member_org_id`, `member_team_ids`, `member_primary_team_id`, `shares_active_team`, the
  `member_sync_membership` mirror, and `org_id NOT NULL` everywhere (MIR-13/01-plan.md § 4).

  In scope, from MIR-13/01-plan.md § 1 *Out of scope*:
  - select policies: member_select_team, member_select_pending_admin, team_select_own,
    entry_select_team, busy_day_select_team, issue_report_select_admin, issue_image_select_admin,
    event_select_visible, event_attendance_select_visible, event_guest_select_visible,
    notification_select_own
  - read definer functions, each gaining an org condition and none trusting `p_team_id` alone:
    list_teams, list_all_members, list_members_for_team, list_team_entries_for_team,
    list_team_entries_overlapping_for_team (`cal11:33-65`, `many_teams:53-70`),
    list_member_directory (`mir04`), may_read_event, is_event_participant, notify_event_created
  - `getTeam()` `.maybeSingle()` (`supabase.ts:2313-2321`; A:980, A:996), and the mock if it changes
  - the overload warning while another team is viewed (`usePageOverload.ts:118-135`,
    `OverloadWarning.tsx:199`; A:995)
  - after this ticket, no reader of `member_team_id()` remains; MIR-21 drops it with `member.team_id`
