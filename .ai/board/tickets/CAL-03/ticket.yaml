# 01-plan.md section 2. The four the CAL-03 row in features.md lists; this plan adds none.
#
# INV-01: held by the exclusion constraint CAL-01 shipped. THE SUBTLETY THIS TICKET INTRODUCES is
# WHOSE entries it compares - the constraint keys on `member_id`, so an admin editing somebody
# else's row collides with THAT MEMBER's other entries and never with the admin's own (AC-9). That
# is the case an implementation written from the admin's point of view gets wrong.
# INV-02: held by public.entry_enforce_decision(), which is ACTOR-BLIND BY DECISION (ADR-016 s2).
# This ticket changes the function NOT AT ALL and must not add an actor carve-out; AC-3 and AC-4
# exist to observe that an admin's edit produces the owner's reset and the owner's note carve-out.
# INV-06: column shape, untouched.
# INV-07: held by THREE things together - `member_id` absent from CAL-02's update grant, the new
# admin policy's `with check` on team, and the not-null reference. AC-8 IS THE ONE WITH NO MECHANISM
# OF ITS OWN if the team predicate is omitted: `using (public.is_admin(auth.uid()))` alone reads
# correct, passes every test a one-team fixture can carry, and lets an admin of any team edit every
# entry in the product at P2. ADR-016 Consequences names that exact shape.
#
# INV-03, INV-04 and INV-05 are DELIBERATELY ABSENT, stated rather than omitted. INV-03 is
# unreachable: `rejection_reason` is not in the update grant and this ticket does not widen it.
# INV-04 and INV-05 are the absence count - this ticket computes none, reads no threshold, reads no
# roster.
# allowed_paths - 01-plan.md section 7. Twelve globs, twelve files; two are new (the migration and
# src/routes/TeamEntries.tsx).
#
# NO INLINE COMMENTS ON THE ITEMS. `readYamlList` in scripts/check-allowed-paths.mjs and in
# .claude/hooks/guard-allowed-paths.mjs strips only a LEADING and a TRAILING quote, so a trailing
# `# ...` is swallowed into the pattern and the glob then matches nothing.
#
# DELIBERATELY ABSENT, each with its reason in 01-plan.md section 7: tests/e2e/cal-02-edit-delete-
# entry.spec.ts (THE SAFETY NET for the EditEntry.tsx change - must pass UNEDITED); tests/e2e/cal-01-
# create-entry.spec.ts (AC-6's create path is CAL-01's policy unmodified and that suite proves it
# still refuses); tests/seam-parity.test.ts (follows the seam unedited); the other three e2e specs;
# src/components/EntryForm.tsx (CAL-02's extraction used unchanged - a form that behaved differently
