# Created by `product` at /triage on 2026-08-31, promoting
# .ai/board/ideas/2026-08-31-no-way-to-tell-a-settled-plan-from-a-typed-one.md.
#
# Definition of Ready items 1, 3, 4 and 6 are filled here. Items 2 and 5 belong to the BA at SPEC.
#
# Item 6. One group: ADM. A second operation on the surface ADM-04 builds and ADM-05 makes
# decidable, so it is exercisable end to end at its own QA gate.
#
# Item 3. ADM-05 only -- the batch reuses its write path, its guard and its reason field, and
# reimplements none of them. ADM-05 transitively carries ADM-04, CAL-02, CAL-01 and TEA-01.
#
# Item 4. Not `none`: it creates public.reject_entries(p_ids uuid[], p_reason text), declared
# SECURITY INVOKER, with `revoke all ... from public` and `grant execute ... to authenticated`.
# ADR-016 section 4. SECURITY INVOKER is what keeps this inside ADR-005 -- entry_update_admin and
# the trigger's guard both still run as the caller, so the function is a transport change and not
# an enforcement layer.
#
# The operator answered on 2026-08-31: one reason is typed for the batch and written onto every
# entry in it, so INV-03 is satisfied per record.
#
# The two failure behaviours the story is written against, which point in opposite directions:
#   - Silently partial. Rows an RLS policy does not admit are FILTERED, not errored: "reject 8"
#     updates 5 and returns HTTP 200, and an `!error` check is green. The function returns
#     `get diagnostics row_count` so the seam can say "5 of 8" rather than "done".
#   - Atomic on failure. One statement, one transaction: if any row fails, NONE are rejected and
#     the admin who selected eight gets zero. The safe direction, and they still need to be told
#     which one failed.
#
# TODO(verify): whether PostgREST's db-max-rows caps a PATCH's returned representation or its
# affected rows. The two readings fail in opposite directions and neither is confirmable from a
# file in this repository.
