# CORRECTED at PLAN, 2026-09-05. The shell was written at triage on 2026-08-31 and named the function
# and "its execute grant". THE REVOKE IS NOT COSMETIC AND IS NOT IMPLIED BY THE GRANT: PostgreSQL
# grants `execute` on a newly created function to `public` by default, so without `revoke all ... from
# public` the function is callable by `anon` and the grant that follows changes nothing. It is the
# redundant-grant trap ADM-03 recorded, in its dangerous direction. supabase/db.sql:697 has it.
# Verified owed against supabase/migrations/ rather than read off db.sql's [OWED] labels, five of
# which are stale (01-plan.md Open questions item 3): `grep -rn "reject_entries" supabase/migrations/`
# returns nothing. 01-plan.md section 6.
