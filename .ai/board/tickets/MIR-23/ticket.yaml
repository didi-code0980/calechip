mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan S-2 (plan:377-379), from the solo-user section (plan:329-441):
  - pgTAP: a solo user reads nothing outside their own personal team
  - Every readable table is covered: entries, busy days, members, memberships, teams, events, event
    attendance, notifications, issue reports

  Blocked by MIR-05 (pgTAP), MIR-13 (the policy layer under test), MIR-25 (`is_personal`), MIR-26 (the
  signup path that creates a solo user) and MIR-28 (listing and directory exclusion).

  OPEN QUESTION — plan Q6: which reads outside the personal team are expected? At least Org public's
  holidays (org-level config, P3-1) and an event the solo user was invited to (rule 5, plan Q1). The
  test's exception list is confirmed at PLAN; it is not invented here.

  Expected impact: none — a test changes no feature's behaviour.
