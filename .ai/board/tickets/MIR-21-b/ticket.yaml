mir_detail: |
  The write slice and the drop of P3-3's last step. MIR-21 (the read slice) ships first and leaves,
  in the database: `public.member_roster_team_id(uuid)` and the computed field
  `public.roster_team_id(public.member)` (ADR-077 decision 2), and no read policy, read function or
  seam read on the `member.team_id` column (MIR-21/01-plan.md § 4).

  In scope, from MIR-21/01-plan.md § 1 *Out of scope* (latest definitions as of 2026-11-05):
  - writer functions: admit_member, move_member, set_member_team, reject_member, set_member_role,
    promote_member_to_admin, delete_team, grant_system_admin, admit_allow_listed_member
  - write-side predicates and triggers: member_decide_admin, member_enforce_role_and_removal,
    stamp_org_id (the `member` branch: org from `new.team_id`)
  - drops: trigger and function member_sync_membership; public.member_team_id(uuid); column
    member.team_id (and its index, ADR-069)
  - fixtures inserting member.team_id: supabase/tests 010, 030, 040, 070, 100 (the case table at
    :200 reads member_team_id), 110, 120, 140 (the mirror's own tests), 150, 160, 170, 180, 190;
    supabase/seed.sql, supabase/bootstrap.sql, supabase/create-account.sql
  - .ai/standards/data-model.md, where it documents the column
  - the seam keeps `team_id:roster_team_id` (ADR-077 decision 2); no seam change is predicted

  Predicted L at /plan MIR-21: its PLAN splits it again.
