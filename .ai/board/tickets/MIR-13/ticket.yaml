# [predicted] at plan time. Corrected at ship in .ai/board/plans/feature-change-log.md.
mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan P3-4 (plan:189-194):
  - Replace `member_team_id(uid)` — single-valued — with a set-returning `member_team_ids(uid)`
  - Rewrite every policy listed in audit §5 against `membership` and `org_id`
  - `getTeam()` uses `.maybeSingle()` and will error with more than one team (`supabase.ts:2092-2095`) — fix
  - `setOverloadThreshold` and `setApprovalSettings` send no id and update every admitted row
    (`supabase.ts:2135-2140`, `:2374-2379`) — scope to one team
  - Every `security definer` function in audit §5 gains an org condition; none may trust a client-supplied `p_team_id` alone

  Blocked by MIR-10 (plan:167) and by MIR-12, whose `membership` rows this rewrite reads (order decided
  2026-10-12; see MIR-12). Dropping `member.team_id` afterwards is MIR-21.

  Audit references:
  - `member_team_id()`, `member_approval:57-63` (A:969); every policy in force, audit §5 (A:607-708)
  - Cross-team definer functions gated only by `is_admin`: `cal11:33-65` (`list_members_for_team`,
    `list_team_entries_for_team`, `list_team_entries_overlapping_for_team`), `many_teams:53-206`
    (`list_teams`, `list_all_members`, `create_team`, `rename_team`, `delete_team`, `admit_member`,
    `move_member`), `cross_team_role:92-120` (A:370-371, 383, 390-393, 405-408, 540-584)
  - `list_event_guest_emails` `evt07:434-442` via `may_manage_event` (A:445)
  - `getTeam` `.maybeSingle()` — `supabase.ts:2092-2095` (A:980, A:996)
  - Update-every-admitted-row — `supabase.ts:2135-2140`, `:2374-2379` (A:403-404, A:990-991)
  - `team_update_admin` tied to single-valued `member_team_id` — `adm01:62-67` (A:992)
  - Overload warning uses the caller's own `getTeam()` while another team is viewed —
    `src/hooks/usePageOverload.ts:118-135`, `src/components/OverloadWarning.tsx:199` (A:995)
