# ---------------------------------------------------------------------------------------------
# 1. WHY THIS TICKET EXISTS
#
# The operator's request, verbatim, 2026-09-07: *"thay đổi UI của calendar month view like this design
# in image"*. It is their SECOND image of the day; the first produced UIE-05.
#
# ***THE MONTH GRID IS THE ONLY CALENDAR SURFACE THE PRODUCT'S OWN PALETTE NEVER REACHED, AND THE ONLY
# ONE STILL CAPPING ITS OWN WIDTH.*** Three facts, each measured against the tree on 2026-09-07:
#
#   - src/routes/MonthView.tsx uses NONE of the tokens UIE-01 and UIE-02 shipped. bg-white,
#     bg-slate-100/60, bg-violet-100, bg-rose-100, bg-emerald-100 and bg-orange-100 are all Tailwind
#     defaults (:375, :379, :384, :385, :452), while src/components/Sidebar.tsx:68-70 draws the legend
#     from bg-pto / bg-wfh / bg-holiday. ***THE LEGEND AND THE GRID IT EXPLAINS ARE PAINTED FROM TWO
#     DIFFERENT PALETTES, PERMANENTLY SIDE BY SIDE ON SCREEN.*** The reason is recorded rather than
#     accidental: MonthView.tsx:64-65 says UIE-02's edit here changed no rendered output, which is what
#     kept its spec files out of scope.
#   - :314 is `mx-auto flex max-w-5xl` — 1024px, centred, inside a pane AppShell.tsx:40-42 already
#     grants at `min-w-0 flex-1`. YearView.tsx:322 is `max-w-full`, and WeekView.tsx:304-305 carries
#     UIE-04's comment recording the IDENTICAL cap being deleted. ***MonthView.tsx:314 IS NOW THE ONLY
#     CALENDAR VIEW STILL CAPPING ITSELF***, on a ~1563px viewport where that leaves roughly a quarter
#     of the pane empty on each side.
#   - a cell is `min-h-24` (96px, :374) against the image's ~170px, so five or six rows occupy ~600px
#     of a ~1010px viewport. ***THE DENSEST SCREEN IN THE PRODUCT IS DRAWN SMALL IN THE MIDDLE OF A
#     SCREEN WITH ROOM FOR MORE***, which is the one thing CLAUDE.md § Visual direction singles this
#     screen out for.
#
# ---------------------------------------------------------------------------------------------
# 2. ***THE FINDING THAT MOST CHANGES THE SHAPE OF THIS TICKET: MUCH OF THE CELL IS ALREADY SHIPPED.***
#
# `tech-lead-design`'s, from the technical half of this triage. ***CARRY IT; A PLAN THAT DOES NOT KNOW
# THIS REWRITES WORKING CODE TO ARRIVE WHERE IT ALREADY IS.***
#
# ALREADY TRUE ON SCREEN TODAY — the image is DESCRIBING these, not requesting them:
#   - the day numeral top-left (:390), already specified at CAL-04/01-plan.md:192
#   - avatars as small filled coloured circles holding an emoji, wrapping under the numeral
#     (:434 `flex flex-wrap gap-1`, :447 `rounded-full`, :459)
#   - mint for WFH and peach for PTO (:452)
#   - no name, no type label and no note in the cell — only `title={person.displayName}` (:445).
#     ***OPS-002 AC-7 DOES NOT ENGAGE HERE***, unlike the week image: this cell names no type in words
#   - an overloaded day's WHOLE CELL background is soft pink (:379); CAL-04/01-plan.md:194-195 chose
#     background-not-badge deliberately, so the crowded day is findable by scanning
#   - Monday-first, seven columns, whole weeks with leading and trailing cells (:83, :305-309)
#   - out-of-month days greyed (:375) — GREY, not lavender
#   - five rows for April 2026 — true by construction; 30 Mar to 3 May is exactly 5x7. ***SEE §3.4.***
#   - the whole top bar and sidebar — shipped by UIE-02 and UIE-03, IN ENGLISH
#
# ***AND ONE DOMAIN FACT THE PICTURE GETS RIGHT.*** Against its roster of eight, day 28 has four
# avatars (50%) and is NOT pink; day 17 has five (62.5%) and day 29 six (75%) and both ARE. That is `>`
# and not `>=`, agreeing exactly with INV-04 and CAL-04 AC-7 (CAL-04/01-plan.md:111-118). Recorded
# because it is evidence the picture was drawn deliberately rather than approximated.
#
# SCOPE, AND PLAN MEASURES IT RATHER THAN INHERITING IT:
#   src/routes/MonthView.tsx     certainly. One component's layout.
#   src/index.css                ***ONLY IF A TOKEN IS ADDED.*** §3.5 and §3.7. The hairline colour
#                                (--color-line), the card (--color-card), the radius (--radius-card),
#                                the shadow (--shadow-soft), the ground (--color-bg) and the three
#                                meaning-named fills ALL ALREADY EXIST at src/index.css:100-152.
#                                ***PLAN CHECKS BEFORE ADDING.***
#   tests/e2e/*.spec.ts          ***EXPECTED TO BE NONE, AND THAT IS A MEASURED CLAIM RATHER THAN A
#                                HOPE.*** No selector is renamed and no rendered fact is removed. See
#                                §3.2 for the one place a spec file could enter and why it does not.
#
# ---------------------------------------------------------------------------------------------
# 3. WHAT IS BUILT — six things, all arrangement, inside the § Visual specification grant
#
# 3.1 ***THE GRID FILLS THE PANE'S FULL WIDTH.*** Delete `mx-auto max-w-5xl` from :314. This is the
#     same shape of change UIE-04 made when it deleted `mx-auto max-w-3xl` from the week view
#     (WeekView.tsx:304 carries the comment; UIE-04/01-plan.md:380-382 the reasoning), and
#     AppShell.tsx:40-42 already grants the width. Free.
#
# 3.2 ***THE WEEKDAY STRIP LIFTS OUT OF THE GRID AND ONTO THE PAGE GROUND.*** Today the seven labels
#     are the first seven children INSIDE `month-grid` (:335-340).
#     ***THIS IS FREE, AND IT IS MEASURED: NO TEST IN THIS REPOSITORY ASSERTS ON `month-weekday` AT
#     ALL.*** cal-08-holiday-shading.spec.ts:137 uses `month-grid` only as a readiness signal (:374,
#     :483), and cal-04-month-view.spec.ts:121 counts `month-cell` and never the grid's children.
#     ***THE LABELS STAY `Mon`…`Sun`.*** `T2`…`CN` is Vietnamese; §7.1. No test asserts them either
#     way, so keeping them is free and changing them is expensive.
#
# 3.3 ***ONE WHITE ROUNDED CARD HOLDING A RULED GRID.*** Rectangular cells separated by 1px hairlines
#     running edge to edge, only the card's four outer corners rounded — in place of 35 separate
#     `rounded-xl` tiles with `gap-1` gutters (:335, :374). ***--color-line: #e4e0f4 ALREADY EXISTS***
#     at src/index.css:104, so the hairline needs no new token.
#
# 3.4 ***TALLER CELLS — AND THE CRITERION IS WRITTEN AS `AT LEAST`, NEVER AS "FILLS THE VIEWPORT".***
#
#     ***THIS IS THE ONE PLACE A PLAN CAN WRITE AN UNSATISFIABLE AC AND NOT NOTICE.*** The image shows
#     five rows filling the viewport exactly, and five rows is a property of APRIL 2026, not of a
#     month. ***A SIX-ROW MONTH IS 6 x 170 = ~1020px BEFORE THE WEEKDAY STRIP, ON A ~1010px VIEWPORT,
#     AND IT SCROLLS.*** An AC saying the grid fills the viewport is unsatisfiable roughly half the
#     year. The transcription's §5 admits it cannot show this case.
#
#     ***min-height, NOT height*** — the same answer UIE-05 §3.1 reached for the week column, and the
#     pane is already the sole bounded scroller.
#
#     TODO(verify): whether a PERCENTAGE min-height resolves through this exact chain — `min-h-screen`
#     -> `flex min-h-0 flex-1` -> `flex-1` (App.tsx:82, AppShell.tsx:33, :40) — or needs an explicit
#     `calc(...)`. ***IT NEEDS A RENDERED VIEWPORT, WHICH TRIAGE HAS NO WAY TO PRODUCE.*** It changes
#     one declaration, not the conclusion. Inherited from UIE-05, where the same marker stands.
#
# 3.5 ***THE OUT-OF-MONTH TINT — BOUND TO --color-bg, WITH A CLAUSE THAT IS AN AC AND NOT A COMMENT.***
#
#     The image tints out-of-month cells pale lavender; today they are grey `bg-slate-100/60` (:375).
#     ***TAKEN AS DRAWN THIS IS A COLOUR COLLISION.*** CLAUDE.md § Visual direction fixes lavender to
#     holidays, CAL-08 spends --color-holiday: #c9bff0 there and NOWHERE ELSE (:384), and
#     src/index.css:137-138 records that the tokens are "named for what they MEAN and not for what they
#     look like". The image's OWN sidebar keeps a violet `Ngày lễ` legend row, so the picture
#     contradicts itself as well as the registry.
#
#     ***THE ESCAPE IS IN THE TRANSCRIPTION'S OWN WORDS:*** its §1.3 calls the PAGE GROUND "a pale
#     lavender off-white", which is --color-bg: #f1effa (src/index.css:102), already shipped. #f1effa
#     and #c9bff0 are not the same colour and do not read as the same colour.
#
#     ***THE CLAUSE, WHICH MUST BE WRITTEN AS AN ACCEPTANCE CRITERION:***
#       "The out-of-month tint is --color-bg and is never --color-holiday. An out-of-month cell and a
#        non-working holiday cell must remain distinguishable side by side."
#
#     ***WHY THE CLAUSE IS NOT PEDANTRY:*** CAL-08 AC-14 keeps out-of-month cells STATELESS (:350,
#     :365; cal-08-holiday-shading.spec.ts:501 asserts data-count="" on an October cell viewed from
#     September), so an out-of-month day that IS a holiday is not tinted today. Without the clause an
#     out-of-month 30th would look identical to an in-month non-working holiday, and only the greyed
#     numeral would tell them apart.
#
# 3.6 ***THE BRIDGE BADGE MOVES TO THE CELL'S TOP-RIGHT — OUTLINED, UNFILLED, STILL READING `Bridge`.***
#     Today it sits on the second line beside the holiday name (:405-425). The POSITION is arrangement
#     and is taken. ***THE FILL AND THE WORD ARE REFUSED: §7.1 AND §7.3.***
#     ***AND TOP-RIGHT IS OCCUPIED — SEE §5. THIS IS COLLISION 1 AND PLAN RESOLVES IT RATHER THAN
#     INHERITING IT.***
#
# 3.7 ***THE TOKEN CONVERSION — DESIRABLE, INSIDE THE GRANT, AND A SECOND THING.***
#     Moving the grid onto --color-card, --color-line, --radius-card, --shadow-soft, --color-pto,
#     --color-wfh and --color-holiday stays inside the grant: CAL-04's criteria cite "lavender",
#     "peach" and "mint" GENERICALLY (CAL-04/01-plan.md:212-217), so nothing is amended by painting
#     them from the tokens that mean those words.
#     ***BUT IT IS A SECOND THING AND THE PLAN MUST SAY WHETHER IT DID IT.*** If a size of S comes back
#     as M, this is almost certainly why, and that is a real judgement rather than a mismeasurement.
#
# ---------------------------------------------------------------------------------------------
# 4. ***SILENCE IS NOT REMOVAL. SEVEN THINGS THE IMAGE OMITS AND THE SCREEN DRAWS TODAY.***
#
# A cell rebuilt from the transcription alone would drop SHIPPED CAL-04 and CAL-08 behaviour that spec
# files assert. All of them survive this ticket unchanged in substance:
#
#   month-cell-holiday   the holiday's NAME, carrying data-kind (:407-416). Drawn for a row of EITHER
#                        kind so a mandated working Saturday is named, and drawn on an overloaded cell
#                        too, because a signal hidden by a colour is the suppression ADR-015 forbids
#                        (CAL-08 AC-10). ***ASSERTED BY TEXT*** at cal-08-holiday-shading.spec.ts:197,
#                        :225, :235, :388 — the one of these a rebuild cannot drop silently.
#   the lavender holiday tint and data-day-status (:365, :384), asserted in the same spec
#   month-cell-bridge    OUTLINED (:417-423), asserted at that spec's :254-279 BY COUNT, not by text
#                        or colour — so neither §7.3's fill nor §7.1's word is caught by a test
#   the tentative dashed border at reduced opacity (:456) — CAL-04 AC-5, INV-05
#   the approved star (:460)
#   month-empty          the empty-month sentence (:475-479), CAL-04 AC-9, asserted at
#                        cal-04-month-view.spec.ts:176
#   month-threshold      ***THE OVERLOAD THRESHOLD READOUT (:330-332). THE IMAGE IS SILENT ABOUT IT,
#                        NOT NEGATIVE*** — the transcription's §5 lists it beside the holiday and the
#                        tentative border. ***IT STAYS.*** MonthView.tsx:327-329 gives the reason: "an
#                        overloaded day is otherwise a colour with no explanation, and the two numbers
#                        behind it are the whole of INV-04." AND adm-01-threshold.spec.ts:222-224 is
#                        ***ADM-01's ONLY PROOF that a saved threshold reaches the calendar*** — it
#                        navigates from the admin form to this grid and asserts data-threshold="0.6"
#                        and the text 60%. cal-04-month-view.spec.ts:224-226 asserts it for AC-14.
#
# ***AND ONE OF A DIFFERENT KIND: THE DRAG-SELECT GESTURE*** (:371-372, :484-507, CAL-04 AC-13) and its
# panel month-entry-panel, asserted at cal-04-month-view.spec.ts:203-217. The image shows no selected
# date and no form, and ***THIS IS THE ONLY CREATION PATH ON THIS SCREEN.*** A grid rebuilt as one
# ruled card must still carry onMouseDown and onMouseEnter on EVERY IN-MONTH CELL, and the `selected`
# ring at :386 must survive the move from tiles to hairlines.
#
# ---------------------------------------------------------------------------------------------
# 5. ***TWO COLLISIONS THE PLAN RESOLVES RATHER THAN INHERITS.***
#
# 5.1 ***TOP-RIGHT IS OCCUPIED, AND THE COUNT IS NOT THIS TICKET'S TO MOVE OUT OF IT.***
#     :389-396 is a `justify-between` row holding the date numeral LEFT and month-cell-count RIGHT. If
#     §3.6's bridge badge takes top-right while the count is there, they compete.
#     ***THE COUNT IS THE DOMAIN FACT AND KEEPS THE SLOT.*** The badge goes beside the holiday name as
#     today, or below, or top-right ONLY IF the plan finds a stacking that does not displace the count.
#     ***A LAYOUT CALL — BUT A STATED ONE, NOT AN ACCIDENT.***
#
#     ***WHY THE COUNT IS NOT AVAILABLE.*** The image DELETES it — the transcription's §3 says
#     "nothing else is written in the cell: no name, no count, no type label, no note." ***THAT IS A
#     DOMAIN AMENDMENT, NOT ARRANGEMENT.*** CAL-04 AC-3 states INV-04's formula in words ("the cell for
#     14 April carries an absence count of 1.5"), and ui-design-system.md:152-155 puts behaviour and
#     invariants outside the § Visual specification grant. CAL-04/01-plan.md:192 marks the count's
#     POSITION as the Tech Lead's own and "cheap to argue with" and says NOTHING about its PRESENCE.
