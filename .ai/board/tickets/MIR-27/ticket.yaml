mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan S-6 (plan:390-394), from the solo-user section (plan:329-441):
  - A personal team forces: approval off, overload warning suppressed, notes visible only to the owner,
    roster hidden
  - Enforced by trigger or check constraint, not application code
  - Rule 5 is carried here because no item of its own was listed for it: a solo user CAN be invited to
    events and accept; they cannot create events that invite others. Split it out (next free number)
    if PLAN finds it does not belong with team config.

  Blocked by MIR-10, MIR-12 and MIR-25 (`is_personal`).

  OPEN QUESTION — plan Q5: where does note visibility live? The plan's *Config ownership* table lists
  "Note visibility" as team config, but no MIR item creates it.
  OPEN QUESTION — plan Q1: how a solo user is invited (affects the EVT-02 half of rule 5).

  Today's sources of the values forced here: approval switches `approval_settings:111-118`
  (`entry_apply_approval_setting`); overload threshold `supabase.ts:2135-2140`; overload warning
  `usePageOverload.ts:118-135`.

  Related: MIR-24 tests this item.
