schema_delta: >-
  see ADR-018. Adds a second select policy `member_select_team` on `public.member`, scoped to
  the caller's team through `public.member_team_id`, alongside `member_select_own`, which is
  kept. `create policy` only — no drop, no column, no table and no grant; TEA-01 already
  granted `select on public.member` to `authenticated`. Corrected from `none` by ba at SPEC —
  ADR-014 makes a policy migration not-none, with no carve-out for a `select` policy.
  Corrected from *replaces* to *adds* by orchestrator at the READY transition, per ADR-018
  §Decision point 1 and §Affected documents — `member_team_id` filters `removed_at is null`,
  so replacing would leave a removed member unable to read even their own row, which is
  byte-identical to the answer for somebody never admitted and collapses this ticket's AC-7.
