# [predicted] at plan time. Corrected at ship in .ai/board/plans/feature-change-log.md.
mir_detail: |
  What MIR-18 (the door slice) left, by ADR-074 decision 8. Every item below is from plan P4-3
  (plan:246-251) or ADR-070 § 4; nothing is added.

  Org management (the panel's first content; replaces the signed-in empty state of MIR-18 § 2b):
  - List orgs. `public.org` is closed to `authenticated` and asserted so by
    supabase/tests/120-composite-fks.test.sql:64-66 and 130-backfill-org-public.test.sql:74-76; a read
    either goes through a `security definer` RPC gated on `public.is_system_admin()` (census in
    010-catalogue.test.sql) or changes those two tests.
  - Create an org: `org_code` (immutable, reserved words refused — ADR-070 § 2), name, timezone.
    Seed its holidays from the national set on creation (ADR-070 § 4, `holiday` bullet).
  - Edit an org: name, caps (`max_members`, `max_teams`), licence state (`plan`,
    `licence_expires_at`). These are nullable placeholders; what a cap or an expiry DOES is deferred by
    the operator (ADR-059 § Out of scope, items 1-4 and 7). Store and show them; enforce nothing.
  - Deleting or suspending an org: ADR-070 has no suspended state, and per-tenant deletion is
    deferred (ADR-059 § Out of scope, item 6). Decide at PLAN what "CRUD" covers without inventing
    either.
  - NOT move-team-between-orgs: MIR-15 owns it (features.md:304; multi-tenancy-status.md:11-13),
    built as a screen in this panel.

  Exposure hardening:
  - `X-Robots-Tag: noindex, nofollow` on the panel's responses, in docker/nginx.conf — never
    robots.txt (plan:247).
  - An unguessable path instead of /system.html (ADR-059 decision 1). The path must not be in the
    repository or the member bundle; nginx.conf is committed and Dockerfile bakes VITE_* at build, so
    the path likely comes from the container's environment at start, as CALECHIP_VERSION does.
    /system.html itself must then stop being served directly.
  - Rate limiting and failed-login logging (plan:250). Password sign-in already has Supabase Auth's
    own limit; the second factor's failures are the open part.
  - IP allow-list "if feasible" (plan:249). Feasibility is unverified (the browser talks to PostgREST
    directly, so an nginx allow-list hides only the HTML), and the address list is a fact only the
    operator holds.
