mir_detail: |
  The rest of P4-2 (ADR-088 decision 2), transcribed from MIR-17's mir_detail less the issue-reports
  screen, which MIR-17 itself ships:
  - `mayAdminister`, `mayDecide`, `mayDecideEntriesOf` take a team (`src/lib/roles.ts`). The per-team
    rank needs a member-seam read of the caller's active memberships and team roles; today
    `Member.role` is one value per person, "manager" derived from the roster team (MIR-16-c).
    An org parameter is the caller's own org (ADR-088 decision 4)
  - replace the `me.role !== "admin"` guards — AdminHub, NewSignups, Threshold, Teams, TeamEntries,
    Holidays (IssueReports went at MIR-17)
  - `canRemove`, `canPromote`, `canSetManager` scoped (`MemberList.tsx:148-153`, `349-366`)
  - `mayEditEvent` gains a team comparison (`EventDetail.tsx:51-53`); `EventAttendancePanel.tsx:77`
  - `Teams.tsx:337` labels managers as "Member"
  - router role guards (`src/App.tsx`); `AdminLayout.tsx`, `AdminTabs.tsx`, `TopBar.tsx`, `Sidebar.tsx`
  - mock: `currentAdmin`, `eventIsAdmin`, `setRank` (`src/lib/data/mock.ts`)
  - `MemberRole` keeps "admin" (ADR-088 decision 3)
  Not counted at /plan MIR-17. Expected to split again at its own PLAN.
