mir_detail: |
  Slice of P4-1 (ADR-086 decision 2). Moved here from MIR-16-f at /plan MIR-16-f on 2026-11-08.
  After MIR-16-f no function writes 'manager' to member.role; legacy rows still hold it.
  - the type: rename the old one aside, create public.member_role ('member', 'org_admin'), re-type
    member.role `using (case when role::text = 'manager' then 'member' else role::text end)`, which
    fires no row trigger; drop and re-set the column default around it; drop the old type
  - member_role_change.from_role / to_role become text with a check in ('member', 'manager',
    'org_admin'); member_record_role_change writes `::text`
  - set_member_role(uuid, public.member_role) re-created against the new type: a 'manager' argument
    must still be accepted, so its parameter type changes (text, or public.team_role plus the
    org_admin refusal) — decide at PLAN; 010's census follows
  - tests.member_role's 'manager' branch, tests.put_on_team taking the team role, tests.seed()
    managers inserted as 'member' plus team_role 'manager', seed.sql (:489-490)
  - pgTAP files that insert or assert 'manager' on member.role, found by grep at /plan MIR-16-f:
    040, 100, 250 (:124, :219 cast), 290, 300 (:17, :31), 310 (:28, :100), and any written since
  - the hosted check before applying (RULE-09): no object outside the local catalogue depends on
    the type
  Not counted at /plan MIR-16-f. Expected to split again at its own PLAN.
