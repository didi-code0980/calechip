# [predicted] at plan time. Corrected at ship in .ai/board/plans/feature-change-log.md.
mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan P3-6 (plan:206-211):
  - Disable `list_member_directory` across teams when `is_shared_tenant`
  - Disable `event scope = 'public'` reaching outside the team when `is_shared_tenant`
  - Trigger `notify_event_created` (`evt04:154-174`) must not notify across teams when `is_shared_tenant`
  - Only `system_admin` sets holidays for Org public
  - Build "move a team to another org" in the system panel — needed the day a customer buys a licence

  Blocked by MIR-10 (plan:167) and MIR-18. The plan expects more Org public special cases (plan:324).

  DECIDED by the operator, 2026-10-12: the system panel comes forward. MIR-18 moves into Phase 3 and this
  item waits for it, so "move a team to another org" is built in the panel (plan:211, plan:317).

  Audit references:
  - `list_member_directory` `evt01:154-163` (A:394)
  - `event_select_visible` `evt02:332-346` and `is_event_audience` `evt02:112-125` include `scope = 'public'` (A:423, A:439)
  - `notify_event_created` `evt04:154-174` (A:431)
  - `may_read_event` `evt04:97-112` (A:432)
  - Holiday writes `holiday_*_admin` `adm03:35-50`; global `holiday_select_all` `adm02:58-59` (A:414-420)
