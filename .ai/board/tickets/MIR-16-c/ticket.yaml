mir_detail: |
  Slice 3 of 3 of P4-1 (ADR-082). From ADR-082 decision 1 and MIR-16's mir_detail:
  - `may_decide(uid)` (`manager_role:62`) and `entry_update_manager`
    (20261103120000_mir13_write_path_org_bound.sql:818-828) stop reading the global role; the
    decider is `may_decide_entry` (ADR-073 decision 2)
  - `set_member_role` writes a per-team role, and `membership.team_role` is the only record of
    manager
  - 'manager' is removed from public.member_role, which re-creates the type
  - the member seam keeps reporting a manager to the application until MIR-17
  Not counted at /plan MIR-16.
