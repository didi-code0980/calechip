mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan P0-1 (plan:67-74):
  - Confirm whether the service role key recorded in `.gitignore:16-19` is still valid
  - Rotate the service role key and the anon key in Supabase
  - Update every deployment environment and CI secret
  - Verify the old key is rejected
  - Record the rotation date in the repo
  The plan: until this is done, every RLS analysis in the audit is moot (plan:74).

  Audit references:
  - `.gitignore:18` records a real `SUPABASE_SERVICE_ROLE_KEY` committed once; the repository does
    not say whether it was rotated (A:721-722)
  - The only client in code is `createClient(url(), anonKey())` at `supabase.ts:726` (A:712-716)
  - The specific commit and the verification step are in
    `.ai/board/audits/multi-tenancy-audit-2026-10-12-repro.md` § MIR-01
