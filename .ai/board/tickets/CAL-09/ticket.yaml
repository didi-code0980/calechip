# Created by `product` at /triage on 2026-09-08, on a PROMOTE verdict, from
# .ai/board/ideas/2026-09-08-the-year-view-refuses-a-team-of-the-size-the-brief-targets.md.
# That file's `# Verdict — PROMOTE, as CAL-09` section is the reasoning, and its Problem, Who has
# it, Evidence, Impact, Constraints and Out-of-scope sections were written FIRST, in a separate
# session and without a verdict, and are not restated here.
#
# Definition of Ready items 1, 3, 4 and 6 are filled above — they are produced at BACKLOG (ADR-010).
# Items 2 and 5 (invariants_touched, size_estimate) are deliberately left as the template ships
# them: they belong to `tech-lead-design` at PLAN, and the gate sits after PLAN so that they can.
#
# EVERY CLAIM BELOW WAS READ ON DISK AT THIS TRIAGE. Nothing here is recalled, and NOTHING HERE IS A
# DESIGN — where a mechanism is described it is described as a constraint on the plan, and the plan
# chooses the shape. `product` writes no acceptance criteria.
#
# ---------------------------------------------------------------------------------------------
# 1. WHAT THIS TICKET IS FOR, IN ONE PARAGRAPH
#
# A member of a team whose entries overlapping one calendar year exceed one datastore page cannot
# open the year view at all — not a short year, not a slow year: `phase: "unavailable"`, the failure
# state, at src/routes/YearView.tsx:165-181, which is also what that screen shows for a network
# error. The refusal is CORRECT and CAL-06 AC-14 requires it. A correct refusal is not a calendar,
# and closing that gap is this ticket.
#
# THE CEILING IS A PROPERTY OF THE TEAM'S DATA, NOT OF A PERSON OR A SESSION. On the day it is
# crossed the year view stops working for everybody at once and stays broken until entries age out
# of the range — which for a year range means the following January.
#
# ---------------------------------------------------------------------------------------------
# 2. WHY THIS IS `CAL-09` AND NOT `BUG-nnn` — THE ONE THING A REVIEWER IS MOST LIKELY TO QUESTION
#
# FOUR PLACES IN THIS REPOSITORY CALL THIS "the ticket that follows BUG-002", which reads as
# continuing a defect. THAT READING IS WRONG. BUG-002 discharged its defect completely; what remains
# is a limitation the product was always specified to have and nobody had written down as a
# limitation.
#
# ADR-028's four-step boundary test decides it, applied in its own order (:61-83). STEP 1 ANSWERS
# NO — no written statement about this surface is contradicted by what shipped. Every governing
# statement is satisfied: CAL-06 AC-14 (.ai/board/tickets/CAL-06/01-plan.md:203-207) REQUIRES the
# refusal, and CAL-04 AC-11's gloss (:176-180), CAL-05 AC-15 and the CAL-07 registry row's sentence
# are disjunctions of the form "assert completeness OR page", whose first disjunct holds.
#
# ***TWO CONTRADICTIONS CAN BE POINTED AT AND BOTH WERE TESTED RATHER THAN WAVED THROUGH. THE VERDICT
# SECTION CARRIES THE FULL ARGUMENT; THE SHORT FORM IS HERE BECAUSE PLAN WILL MEET BOTH.***
#   - THE SCALE PROMISE names a MEMBER COUNT (product_brief.md:110, "View năm chịu được 30 người mà
#     vẫn cuộn mượt") while the failure is keyed to a ROW COUNT, and NO FILE ANYWHERE states entries
#     per member. Supplying that figure is exactly the taste ADR-028:66-68 excludes from step 1. And
#     the brief's line is about SCROLLING: CAL-06's plan split that target and deliberately refused
#     to make the performance half assertable (.ai/board/tickets/CAL-06/01-plan.md:236-246).
#   - ***CAL-06's AC-1 AND AC-14 DISAGREE ABOVE THE CAP, AND PLAN MUST KNOW THIS.*** AC-1 (:129-132)
#     is unconditional — "Then the grid renders 365 day columns" — while AC-14 (:203-207) requires
#     no grid at the row limit. Above the cap they cannot both be observed. It resolves the way a
#     specific criterion governs the case its `Given` enumerates, and the surface implements AC-14
#     exactly, so it is not a step-1 defect. ***BUT NOTHING IN THE REPOSITORY RECORDS THAT READING***,
#     and THIS TICKET IS WHAT REMOVES THE CLASH by making AC-14's precondition unreachable. §3.
#
# STEP 2 THEN ANSWERS YES: afterwards a team above one page can see its year, which it cannot today.
# Calendar area, so `CAL`. Steps 3 and 4 are not reached and would not have fitted — the deliverable
# is not the appearance of an existing surface (two competent people produce the same output: a
# complete grid), and it is not mechanical (there is a real design decision inside it).
#
# ---------------------------------------------------------------------------------------------
# 3. ***WHAT THIS TICKET DOES TO FOUR SHIPPED ACCEPTANCE CRITERIA — STATE IT, DO NOT DISCOVER IT.***
#
# PAGING DOES NOT FIX CAL-04 AC-11, CAL-05 AC-15, CAL-06 AC-14 OR THE CAL-07 ROW'S SENTENCE. IT
# RETIRES THEIR PRECONDITIONS. Each is conditioned on the read "coming back at the row limit" or on
# the seam refusing; after paging the entry read never comes back at a limit, so the `Given` never
# occurs and all four become VACUOUSLY TRUE.
#
# THAT IS DEFENSIBLE AND IT MUST NOT BE QUIET. A later reader who finds four criteria that can no
# longer fail must be able to see that it was intended. 01-plan.md says so in its own words, and the
# REVIEW that follows should be able to point at the sentence.
#
# ***AND THE SAME SENTENCE CLOSES §2's SECOND CONTRADICTION***: once AC-14's `Given` is unreachable,
# CAL-06 AC-1 and AC-14 stop disagreeing about anything. That is the cleanest available record of the
# specific-over-general reading, and it is worth one line in the plan rather than a registry edit.
#
# WHAT MUST NOT HAPPEN: WEAKENING ANY OF THE FOUR. CAL-06 AC-14 stands and is not to be reworded.
# ANYTHING THAT RENDERS A PARTIAL YEAR WITHOUT SAYING IT IS PARTIAL REINTRODUCES THE DEFECT BUG-002
# CLOSED THIS MORNING.
#
# ---------------------------------------------------------------------------------------------
# 4. THE CONSTRAINTS THAT BIND ANY SHAPE PLAN CHOOSES — READ AS BOUNDS, NOT AS A DESIGN
#
#   - RULE-02 AND THE SEAM. The data-access seam is src/lib/data/, enforced by
#     `no-restricted-imports` in eslint.config.js. Any paging loop, count request or completeness
#     check lives INSIDE the seam, or in the constants module the seam already imports. No route may
#     reach past it. src/lib/domain/types.ts:196-199 records why the constants sit in domain/ rather
#     than in the seam: both implementations need them at runtime and index.ts imports both, which
#     would be a load-time cycle.
#   - ADR-005 — THERE IS NO SERVER. The browser talks to PostgREST directly, so there is nowhere
#     server-side to page, cache or pre-aggregate on a caller's behalf.
#   - ***INV-04 HAS EXACTLY ONE IMPLEMENTATION AND NOTHING MAY CREATE A SECOND.*** `absenceCountsFor`
#     in src/lib/data/absence.ts is pure and takes rows. It CANNOT detect truncation itself, which is
#     why completeness must be established BEFORE it is called. ***ASSEMBLE THE ROWS, THEN COUNT
#     ONCE. NEVER SUM PER PAGE*** — a per-page sum is INV-04's forbidden second definition reached by
#     an optimisation that reads as reuse rather than as a shortcut.
#   - THE READ CARRIES A DETERMINISTIC ORDER AND BOTH IMPLEMENTATIONS MUST KEEP IT.
#     src/lib/data/supabase.ts:1166-1167 orders `start_date` then `id`, both ascending;
#     src/lib/data/mock.ts:1222-1226 sorts identically. ANY PAGING STRATEGY DEPENDS ON THAT ORDER
#     BEING STABLE ACROSS REQUESTS, and tests/seam-parity.test.ts DOES NOT POLICE IT — it compares
#     exported key sets and arity only and says so at :1-9, "Parity is necessary and NOT sufficient".
#     ADM-04 hit exactly this and recorded it at src/lib/data/supabase.ts:1364-1367.
#   - ***OFFSET PAGING IS NOT ATOMIC.*** A concurrent write between two pages can cause a row to be
#     SKIPPED, which lands on INV-04 in the SILENT direction — a count too low, with nothing wrong on
#     screen. That is the same direction of loss BUG-002 existed to close, arriving by a new route.
#     A count-against-assembled-length check is what converts the skew into a refusal; ADM-04's
#     equivalent is at src/lib/data/supabase.ts:1425-1431.
#   - CAL-04's PLAN AUTHORISES PAGING IN WORDS AND IS THE ONLY ARTIFACT THAT DOES —
#     .ai/board/tickets/CAL-04/01-plan.md:176-180. ***`ADR-015` DOES NOT, AND FIVE PLACES IN THIS
#     REPOSITORY SAY IT DOES.*** `grep -n "pag\|range("` over that decision returns ZERO matches; its
#     :379-381 offers two NON-paging mitigations scoped to the HOLIDAY read. The false half appears
#     at .ai/registry/features.md:102 (human plane under RULE-01, `/thuki`'s to correct — NOT this
#     ticket's and NOT PLAN's), .ai/board/tickets/BUG-002/01-plan.md:104, :221 and :459,
#     src/lib/domain/types.ts:347-348, and .ai/board/backlog.md. ***CITE CAL-04's PLAN AND NOTHING
#     ELSE.*** Do not repeat the ADR-015 half anywhere, including in a source comment.
#
# ---------------------------------------------------------------------------------------------
# 5. ***THE PRECEDENT IS PARTIAL, AND THE MISSING HALF IS THE HARD HALF. VERIFIED ON DISK.***
#
# ADM-04's `listPendingEntries` at src/lib/data/supabase.ts:1373-1433 is the shipped paged read and
# it gives THE INGREDIENTS:
#   - `.select(ENTRY_COLUMNS, { count: "exact" })` at :1381
#   - `.range(from, to)` at :1399, over a page index THE CALLER SUPPLIES (:1374-1375)
#   - a null-count refusal at :1410-1415 — the outstanding figure may never be derived from the
#     number of rows on the page
#   - ***A SHORT-PAGE ASSERTION AT :1425-1431 THAT DETECTS A LOWERED CAP WITHOUT KNOWING ITS VALUE***
#     (:1417-1420 says so explicitly), which is the thing every ceiling constant in this file carried
#     a `TODO(verify)` for.
#
# ***IT IS NOT A WALK, AND A PLAN THAT TREATS IT AS ONE WILL FIND HALF OF IT MISSING.*** It fetches
# ONE page. `.range(` occurs EXACTLY ONCE in the whole seam and there is NO loop of any kind in that
# file — checked at this triage with a search over src/lib/data/supabase.ts, not recalled. ADM-04
# built a PAGED SCREEN whose user asks for the next page; this ticket needs a COMPLETE RESULT
# assembled from several requests, because `absenceCountsFor` must be handed every row before it is
# called (§4). ***THE LOOP, ITS TERMINATION CONDITION AND ITS BOUND ARE NEW WORK WITH NO PRECEDENT IN
# THIS TREE.*** That is the single largest unknown in this ticket and it is why §9 records no size.
#
# TWO SHAPES OF DETAIL THAT FOLLOW, AND NEITHER IS A DECISION TAKEN HERE:
#   - The count-against-assembled-length equality is what makes the non-atomicity in §4 a refusal
#     rather than a silent short year. In the MOCK it cannot fire (§8), which must be declared.
#   - Keeping `MONTH_ENTRY_LIMIT`'s name and value and adding a page-size constant beside it keeps
#     src/lib/domain/types.ts additive. Recommended by `tech-lead-design`; it is a recommendation.
#   - ONE READ SERVES FOUR CALLERS — the month, the week, the year and the draft-entry overload
#     warning all go through `listTeamEntriesOverlapping`. Whatever is done is done once, for all
#     four, or there are two team-entry reads and one of them will be the one nobody updated.
#
# ---------------------------------------------------------------------------------------------
# 6. `schema_delta: none` — AND THE FENCE, WHICH IS THE PART THAT MATTERS
#
# OFFSET `range()` OVER THE ORDER THAT ALREADY EXISTS NEEDS NO MIGRATION, so `none` is correct for
# the shape everything on this board points at.
#
# ***IF PLAN REACHES FOR A KEYSET PREDICATE AND WANTS AN INDEX ON `(start_date, id)`, THAT MAY BE A
# MIGRATION AND `none` MAY BE WRONG.*** ADR-014 names POLICIES, TRIGGERS and CONSTRAINTS and does not
# name indexes, so THE LITERAL READING SAYS `none` — and the literal reading is precisely what
# ADR-014 exists to distrust. This triage does not resolve it: the answer depends on a shape that has
# not been chosen. ***PLAN STATES WHICH SHAPE IT TOOK AND RE-EVALUATES THIS FIELD RATHER THAN
# INHERITING IT.*** If the answer changes, the ADR is linked here.
#
# ---------------------------------------------------------------------------------------------
# 7. ***ONE FIX SHAPE IS FENCED OFF, AND IT IS THE ONE THAT MAKES THIS TICKET UNNECESSARY.***
#
# RAISING THE SUPABASE PROJECT'S `max-rows` API SETTING IS OUT OF BOUNDS INSIDE THIS TICKET.
# BUG-002 fenced the same shape in its own shell and its plan explains why at
# .ai/board/tickets/BUG-002/01-plan.md:100-103: it adds a repository artifact and a deployment step
# that do not exist, and it makes a product correctness property depend on a value NO FILE RECORDS
# AND NO CHECK CAN VERIFY.
#
# ***IT IS MORE TEMPTING HERE THAN IT WAS THERE, BECAUSE IT MAKES THE WHOLE TICKET UNNECESSARY.***
# IF PLAN CONCLUDES IT IS THE RIGHT ANSWER, ***THE CORRECT VERDICT FROM PLAN IS `BLOCKED` WITH
# `requires_adr: true`*** — ADR-008's test: decide inside the envelope, ask before changing it. A
# quiet configuration change is the one outcome this section exists to prevent.
#
# `requires_adr: false` ABOVE IS SCOPED TO THE SHAPES THAT ARE NOT THAT ONE. Paging inside the seam
# supersedes nothing: the ceilings were never ADR-recorded (BUG-002 shipped `requires_adr: false` and
# set them in a source file), and ADR-027 — the decision that would have removed the cap by changing
# the datastore — is `WITHDRAWN by the operator` before it entered any commit.
#
# ---------------------------------------------------------------------------------------------
# 8. ***HOW THIS WOULD BE PROVED, AND THE HALF THAT CANNOT BE.*** DEFINITION OF DONE ITEM 4 DEPENDS
#    ON PLAN ANSWERING THIS, AND IT IS THE LARGEST DIFFERENCE FROM BUG-002.
#
# BUG-002's defect was untestable behaviourally because playwright.config.ts:49-51 pins the whole
# acceptance suite to the MOCK, and only the real implementation can be truncated by a server.
# ***PAGING IS DIFFERENT: IT IS THE SEAM'S OWN CODE AND IT RUNS IN THE MOCK.***
#
# THE SHIPPED PRECEDENT FOR TESTING ONE IS tests/pending-entries.test.ts. It imports @/lib/data/mock
# DIRECTLY rather than through @/lib/data, because the row order and the paging are invisible to the
# parity test (:8-13), and it DECLARES IN ITS OWN HEADER which criterion is asserted nowhere and why
# (:21-27). That declaration is the pattern to copy, not just the test.
#
# ***TWO THINGS TO DECLARE RATHER THAN GLOSS:***
#   - THE REAL IMPLEMENTATION'S COUNT-AGAINST-ASSEMBLED COMPARISON CANNOT FIRE IN THE MOCK. A green
#     suite proves the loop is IMPLEMENTED. It does not prove it REPAIRS a truncation the mock cannot
#     produce.
#   - ***THE PAGE SIZE CONSTRAINS THE TEST DIRECTLY.*** `PENDING_PAGE_SIZE` is 50
#     (src/lib/domain/types.ts:556) and that is not an aesthetic choice: crossing a page boundary at
#     1000 means creating 1001 entries in a fixture. Whatever page size PLAN picks, it picks it
#     knowing a test has to cross it.
#
# AND ONE OPEN QUESTION THIS TRIAGE DOES NOT ANSWER: ***IS THERE A CEILING AT ALL AFTER THIS, AND
# WHAT ASSERTS IT?*** tests/row-limits.test.ts holds every ceiling against DATASTORE_MAX_ROWS, and
# :14-19 records that the relation is REACHABILITY rather than margin. A read that pages has no fixed
# maximum for that test to hold. ADM-04's precedent replaced the ceiling with a short-page assertion
# rather than with nothing (§5). What the equivalent is here, and whether an unbounded loop needs its
# own bound, is PLAN's.
#
# ---------------------------------------------------------------------------------------------
# 9. ***NO SIZE AND NO SIZE SIGNAL FROM THIS TRIAGE, DELIBERATELY.***
#
# `size_estimate` is empty above as the template ships it, and unlike several recent shells THIS
# SECTION DOES NOT OFFER A SIGNAL EITHER. The reason is §5: the mechanism this ticket needs — a
# multi-request assembly with a termination condition and a bound — HAS NO PRECEDENT IN THIS TREE, so
# a path count taken at triage would be a guess wearing a measurement's clothes.
#
# WHAT CAN BE SAID WITHOUT DESIGNING, AS A FLOOR AND NOT AN ENUMERATION: the seam has TWO
# implementations that must both change (src/lib/data/supabase.ts and src/lib/data/mock.ts), the
# constants live in src/lib/domain/types.ts, and tests/row-limits.test.ts asserts something about a
# ceiling this work may remove. NAMING A FILE IS NOT AUTHORISING IT — `allowed_paths` is `[]` above
# and PLAN fills it.
#
# ***THE FOUR CONSUMING ROUTES ARE NOT OBVIOUSLY IN SCOPE AND MAY WELL BE.*** src/routes/YearView.tsx
# has ONE `catch` around three reads and ONE failure state (:172-181). A multi-request read has a
# PARTIAL outcome that this screen has no vocabulary for, and CAL-06 AC-14 forbids drawing a grid
# that is missing rows. Whether that is a loading state, a retry, or the same refusal is a BEHAVIOUR
# decision that belongs in acceptance criteria which do not exist yet. IT IS THE IDEA'S OPEN QUESTION
# 3 AND IT IS PLAN's.
#
