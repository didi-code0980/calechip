# 11. `invariants_touched` IS PLAN's. THIS SECTION NAMES WHAT TO LOOK AT AND SETTLES NOTHING.
#
#   - INV-04 IS THE ONE TO LOOK AT FIRST, AND IT IS ENGAGED THROUGH COMPLETENESS RATHER THAN THROUGH
#     ARITHMETIC. `absenceCountsFor` is pure and sums correctly over whatever rows it is handed; the
