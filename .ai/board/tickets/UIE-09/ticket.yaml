#    /admin guards on `member` and refuses IN-SCREEN, exactly as /threshold (src/App.tsx:338-343),
#    /entries/team (:257-261) and /entries/pending (:277-283) each do and each explain: a member who
#    types the address is refused BY THE SCREEN, because the refusal is what says why. Nothing here
