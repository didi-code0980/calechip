# -----------------------------------------------------------------------------------------------
# Written by `product` at /triage on 2026-09-09, from
# .ai/board/ideas/2026-09-09-the-year-view-cannot-answer-what-the-year-looked-like.md, on a PROMOTE
# verdict. That file's `# Verdict — PROMOTE, as CAL-10` section is the reasoning and is not repeated
# here. Nothing below is an acceptance criterion; all of them are PLAN's.
#
# 1. FIVE SHIPPED ACCEPTANCE CRITERIA MUST BE REWORDED, AND THAT IS THIS TICKET'S, NOT A CHORE'S.
#    The operator chose to keep BOTH surfaces and to make the overview the DEFAULT, so `/year/:yyyy`
#    renders the overview and the member grid moves to `/year/:yyyy/members`. The five are
#    CAL-06 AC-1 (.ai/board/tickets/CAL-06/01-plan.md:129), AC-2 (:134), AC-13 (:197), AC-14 (:203)
#    and CAL-08 AC-7 (.ai/board/tickets/CAL-08/01-plan.md:178). Four name `/year/2026` or
#    `/year/2028` literally; AC-14 names no address and is on the list because its subject is *the
#    grid*, which now names a different screen while its refusal must hold at both.
#    THOSE TWO PLAN FILES THEREFORE ENTER `allowed_paths` AT PLAN, and the edits are address changes
#    only — no criterion's substance moves. ADR-032 § *Consequences* item 1 is the table.
#
# 2. NINE CRITERIA ARE DELIBERATELY NOT TOUCHED, and a reviewer should check this list as carefully
#    as the one above. CAL-06 AC-3, AC-4, AC-5, AC-6, AC-8, AC-9 and AC-10 open "When the year
#    renders" with no address and describe the RETAINED grid. CAL-08 AC-11 (:203) says "the year
#    grid" in a three-surface comparison and stays true as written. CAL-06 AC-12 (:191) requires a
#    link back to the month; the card footer's `Xem →` satisfies it IF it targets `/month/yyyy-MM`,
#    which binds this ticket rather than changing that criterion.
#
# 3. THE FOUR SUMMARY NUMBERS HAVE NO DEFINITIONS AND THE PICTURE CANNOT SUPPLY THEM. Its own
#    figures do not agree: `TỔNG ĐƠN PHÉP 2026` reads `21 đơn` against `NGÀY PTO 10` and
#    `NGÀY WFH 11`, mixing two units in one identity (UIE-08/design/README.md:90-93); `Tháng 04`
#    alone carries `21 Lượt` (:108-109) while drawing FIFTEEN absence days (:133-134); and the
#    figures are already recorded as fictional against the fixtures (:140). Each of the four is an
#    acceptance criterion written at PLAN, and the binding one is ADR-032's: the PTO and WFH figures
#    must sum EXACTLY to INV-04's total for the same period.
#
# 4. NEGATIVE REQUIREMENTS, carried from the idea's § *Out of scope* and from ADR-032:
#    4.1 NO VIETNAMESE COPY. Every string in the picture is Vietnamese and the interface is English,
#        lint-enforced as a BUILD failure (eslint.config.js:84-92; UIE-08/design/README.md:227-228).
#        `TỔNG ĐƠN PHÉP` must not even be translated — `phép` is leave and a WFH day is not leave.
#    4.2 NO WORD MEANING A BALANCE. Charter refusal 1 (.ai/00-charter.md:42) is BRUSHED, not
#        crossed: counting what was declared is not a quota. The boundary is verbal — no label may
#        read `remaining`, `left`, `balance`, `quota` or `allowance`, and no allowance figure goes on
#        this screen.
#    4.3 NO `--color-overload` ON THIS SCREEN. A domain state, not a colour; UIE-08 refused it on the
#        grid for that reason and the picture is silent on it (UIE-08/design/README.md:142-143).
#    4.4 NO SHELL EDIT. src/components/TopBar.tsx:72-74 already renders Week / Month / Year.
#    4.5 THE MEMBER GRID'S BEHAVIOUR IS UNCHANGED. It moves address and nothing else. UIE-08's
#        repaint of it survives — ADR-032 § *Consequences* item 6.
#    4.6 THE SIDEBAR'S FIVE SUB-TEAM SUBTITLES IN THE IMAGE ARE NOT A REQUIREMENT. They contradict
#        INV-07 and the charter's one-team scope, and have been recorded three times and acted on
#        nowhere (UIE-08/design/README.md:262-264). The picture is now ON DISK, which makes it
#        easier to mistake for a specification than any of the transcriptions were.
#
# 5. THE ONE SIGNAL THAT WILL MOVE THE SIZE, and it is not the twelve cards. The month cell's
#    rendering, the type tints, Monday-first whole weeks and holiday shading are all shipped on
#    src/routes/MonthView.tsx, and every read is in place (see `schema_delta` above). What has no
#    precedent is the SUMMARY BAND: four numbers with no definitions, one of which decomposes INV-04
#    by a field INV-04's implementation never reads. That is where the estimate should be spent.
#
# 6. `depends_on: []`, MEASURED. Every ticket on the board is DONE and `## BACKLOG` was empty when
#    this row was written, so nothing claims a path; `allowed_paths` is `[]` on every ticket.
#    CAL-06 and CAL-08 are deliberately NOT named: both are DONE and merged, so they are
