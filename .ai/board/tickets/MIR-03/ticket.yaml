# [predicted] at plan time. Corrected at ship in .ai/board/plans/feature-change-log.md.
mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan P0-3 (plan:83-86):
  - Add a team/org condition — an admin may only change roles for members they actually administer
  - Refuse promotion to `admin` through this path entirely; make it a deliberate, separately-gated action
  - Record the actor of every role change

  Audit references:
  - `set_member_role`, `cross_team_role:92-120`: `security definer`, gate `if not public.is_admin(...)`
    at `cross_team_role:98`, predicate with no team condition, `m.role <> 'admin'` at `cross_team_role:108`
    (A:572-576, A:393)
  - Client entry points `supabase.ts:977` and `promoteMember` → `setRankThroughRpc`, `supabase.ts:1628-1634` (A:583-584)
  - The only actor fields today are `approved_by` and `notification.actor_id` (A:1019)
