mir_detail: |
  The queue slice of P3-5. MIR-14 ships first and leaves, in the database: `may_decide_entry`,
  `entry_select_decider` (a decider already selects the entries they may decide), `rejected_by`,
  `rejected_at`, `self_approved` (MIR-14/01-plan.md § 4.1; ADR-073).

  In scope, from MIR-14/01-plan.md § 1 *Out of scope*:
  - the worklist (`listPendingEntries`, `src/routes/PendingEntries.tsx`) names the owner of a
    second-team member's entry — `member_select_team` is primary-only (ADR-072), so the embedded
    `member(display_name, avatar)` comes back empty today
  - "teams this entry affects" on each worklist row: the owner's active teams, derived from
    `membership` (ADR-073 decision 1), never stored
  - `Entry` gains `rejectedBy`, `rejectedAt`, `selfApproved` if a screen shows them — a shared-type
    change; size it against .ai/01-operating-model.md § Sizing
  - the empty-queue state when a team has no manager (ADR-073 decision 7: the team's admin decides)
