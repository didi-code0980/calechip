mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan P2-2 (plan:147-151):
  - `issue.sql` has no `begin`/`commit`, unlike its neighbours
  - Remove references to the dropped `allowed_email` table
  - Add the missing index on `member.team_id`
  - Add a check constraint on `team.overload_threshold` (currently unconstrained)

  Audit references:
  - `issue.sql` without `begin/commit` (A:246)
  - `allowed_email` created `tea01:41-47`, dropped `member_approval:185` (A:151-154); still in
    `db.sql:157` and `db.sql:825/841/854` (A:316-317)
  - `member`: primary key only, no index on `team_id` (A:139)
  - `team.overload_threshold numeric not null default 0.5`, no check constraint, `tea01:27` (A:109)
