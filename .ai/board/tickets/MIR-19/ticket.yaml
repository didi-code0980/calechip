# [predicted] at plan time. Corrected at ship in .ai/board/plans/feature-change-log.md.
mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan Phase 5 checklist (plan:261-283). "Can run in parallel with Phase 4" (plan:263) — so its
  `depends_on` is Phase 4's: Phase 3, and Phase 0, which blocks everything (plan:65). Derived, not stated.
  - `BrowserRouter` has no `basename` and every route is absolute (`src/App.tsx:88`)
  - Catch-all `*` redirects to `/` — must preserve org
  - Calendar path regex anchored at `^\/` (`viewed-team.ts:74`)
  - `isAdminAddress` / `ADMIN_ADDRESSES` (`AdminTabs.tsx:251-271`)
  - `periodNavFor(pathname)` (`src/lib/period.ts`)
  - Absolute `navigate()` calls — `Sidebar.tsx:293`, `TopBar.tsx:278-307`, `BrandLogo.tsx:31`, `AuthCard.tsx:60`, `:68`
  - Redirects in `MonthView.tsx:512`, `WeekView.tsx:577`
  - Guest links carry no org (`EventDetail.tsx:57`, `GuestEvent.tsx:48`)
  - Email template links carry no org (`send-event-email/template.ts:197`)
  - nginx: `try_files $uri $uri/` collides with `fonts/`, `images/` (`docker/nginx.conf`)
  - e2e specs hardcode absolute paths
  - Signing in resolves the user's org and redirects there
  - Wrong-org URL returns 404, never a cross-org read
  Exit: every authenticated page under `/{org_code}`; no reserved word registrable; `org_code` immutable.

  Audit references (A:779-831, A:997-1009):
  - Routes `src/App.tsx:148-604`; catch-all `src/App.tsx:604`
  - First segments in use and static paths `assets`, `healthz`, `fonts`, `images`, `logo.svg` (A:801-813)
  - Routes reachable signed out (A:825-830)
  - `tests/e2e/*.spec.ts` hardcode absolute paths
