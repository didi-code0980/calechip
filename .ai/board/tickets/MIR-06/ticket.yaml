mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan P1-2 (plan:112-122). Each test runs as a real authenticated role against real policies:
  - A member cannot read another team's entries
  - A member cannot read another team's members
  - A member cannot alter their own role, status or team
  - An admin cannot decide another team's entries
  - A manager cannot decide outside their team
  - A removed member reads nothing
  - A pending member reads nothing
  - Every `security definer` function rejects a caller who should not reach it
  - Every `anon`-callable guest RPC leaks nothing beyond its token's event

  Audit references (A:879-911):
  - Mock-only isolation assertions this suite must mirror: `tests/entry-decision.test.ts:286-300`,
    `tests/pending-entries.test.ts:182-183`, `tests/seam-parity.test.ts:84-92`, `127-136`,
    `tests/cross-team-reads.test.ts:52`, `117-174`, `tests/cross-team-role.test.ts:76`, `86`, `100`, `138`,
    `tests/threshold.test.ts:130-137`, `tests/approval-settings.test.ts:101-109`,
    `tests/events.test.ts:207-221`, `485-505`, `tests/event-attendance.test.ts:367-386`,
    `tests/guest-link.test.ts:167-174`, `tests/viewed-team.test.ts:179-183`; e2e
    `cal-03-admin-edit-entry.spec.ts:412-427`, `cal-04-month-view.spec.ts:159-167`, `cal-12-team-picker.spec.ts:111-121`
  - `tests/cross-team-reads.test.ts:6-8` and `tests/cross-team-role.test.ts:7-11` say the real refusals are untested
  - Regex-only tests: `tests/cross-team-reads.test.ts` around 186-255, `draft-entry.test.ts:299-342`
  - Definer functions to cover: audit §5 "Service role and other RLS bypasses" (A:724-738)
  - Guest RPCs callable by `anon`: `evt06:111-112`, `evt07:495-498`

  DECIDED by the operator, 2026-10-12: MIR-06 does not wait for MIR-05 ("Không cần pgTAP"), so MIR-05
  is not in `depends_on`.
