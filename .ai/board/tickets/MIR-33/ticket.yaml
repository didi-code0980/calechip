# [predicted] at plan time. Corrected at ship in .ai/board/plans/feature-change-log.md.
mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan S-12 (plan:413-416), from the solo-user section (plan:329-441):
  - A route for the personal space. `/public/...` (MIR-19's `/{org_code}` for Org public) is a poor
    URL for one person's own calendar.

  PROPOSED, NOT DECIDED — for the operator at PLAN:
  - (a) `/me/week`, `/me/month`, `/me/year` — short, says whose it is; `me` joins the reserved
    `org_code` list (P3-1, plan:172)
  - (b) `/~/week` — shortest; unusual, and awkward to type on some keyboards
  - (c) `/u/{handle}/week` — addressable, but exposes a per-user handle nobody else can open
  - (d) unprefixed `/week` for a solo user, org-prefixed for everyone else — no new segment, but one
    path means two things depending on who is signed in

  Blocked by MIR-19 (org-scoped routing, which this extends) and MIR-25.
