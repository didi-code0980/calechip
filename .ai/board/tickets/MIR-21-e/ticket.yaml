mir_detail: |
  Slice 3 of 4 of the drop (ADR-079). After MIR-21-d nothing reads `member.team_id`, and only
  fixture inserts write it.

  In scope, from ADR-079 decision 3 (as read on 2026-11-06):
  - every `insert into public.member` that names `team_id` stops naming it, and writes the member's
    `membership` rows directly; where it relied on `stamp_org_id`'s team lookup for an org, it names
    `org_id`
  - pgTAP fixtures: supabase/tests/_isolation.psql (`tests.seed()`), and the inline fixtures of 100,
    120, 140, 150, 160, 190, 210, 220, 230
  - supabase/seed.sql, supabase/bootstrap.sql
  - 220 AC-1 and AC-2 (the column equals the roster team) are retired

  Not in scope: the drop (MIR-21-f). Predicted about twelve paths at /plan MIR-21-c, and no
  migration.
