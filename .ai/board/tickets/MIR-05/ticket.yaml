  Plan P1-1 (plan:107-110):
  - Add `supabase/tests/` and wire pgTAP into local Supabase
  - Add a CI job that starts a real Postgres, applies all migrations, and runs the SQL tests
  - CI fails on any SQL test failure

  Audit references (A:879-911):
  - No pgTAP and no `supabase/tests/`; CI (`.github/workflows/verify.yml:39,51`) runs only vitest and Playwright
  - Playwright is pinned to the mock: `VITE_DATA_SEAM: "mock"`, enforced by `tests/e2e/seam.setup.ts:17,32`
