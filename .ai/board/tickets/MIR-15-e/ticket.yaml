# [predicted] at plan time. Corrected at ship in .ai/board/plans/feature-change-log.md.
mir_detail: |
  The member half of MIR-15-b, transcribed from ADR-079 decision 5 and MIR-15-b/01-plan.md § 1
  *Out of scope*. Nothing is added except the facts found on disk at /plan MIR-15-b, each with its
  file:line:

  - After MIR-15-b, `holiday_insert_admin`, `holiday_update_admin` and `holiday_delete_admin` refuse
    an admin of Org public, but `src/routes/Holidays.tsx:216` still sets `mayWrite` from
    `me.role === "admin"`, so an Org public admin sees Add, Edit and Delete and is refused with
    `HOLIDAY_ADD_REFUSED` and its two siblings (`src/lib/data/supabase.ts:1436-1438`), whose words
    ("Only an admin can …") are then wrong.
  - The member app does not know whether its org is shared: `Member` (`src/lib/domain/types.ts:33`)
    carries no org, and the mock (`src/lib/data/mock.ts`) models no org at all. A dedicated org's
    admin keeps the write (ADR-079 decision 2), so hiding the controls for every admin is rejected
    in ADR-079 *Options considered*. How the screen learns the answer is this ticket's PLAN.
    `public.org_is_shared(uuid)` is callable by `authenticated` (MIR-15).
  - The mock's `addHoliday`, `updateHoliday`, `deleteHoliday` (`mock.ts:2954` onward) admit any
    admin, and `listHolidays` (`:2901`) reads every row — looser than SQL on decisions 2 and 3.
  - Tests that assert an Org public admin writes holidays, found by grep at /plan MIR-15-b:
    `tests/holiday-writes.test.ts`, `tests/e2e/adm-03-holiday-writes.spec.ts`,
    `tests/e2e/cal-08-holiday-shading.spec.ts`, `tests/manager-role.test.ts`. Count the failing
    blocks at PLAN before sizing.
  - Stale comments saying `holiday_select_all` is `using (true)`: `src/lib/data/supabase.ts:2883`,
    `src/lib/data/mock.ts:550`, `:2882`, `src/routes/Holidays.tsx:6`, `src/App.tsx:541`.
