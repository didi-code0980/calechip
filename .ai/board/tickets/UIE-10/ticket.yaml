#        then click the link that is now on it — and THE FOUR `home-*-link` IDS MAY RELOCATE ONTO
#        THE HUB UNRENAMED, exactly as UIE-02 relocated eleven ids letter for letter. No id in that
#        group has to change.
#    2.2 THE 17 VISIBILITY ASSERTIONS CANNOT BE REPAIRED, BECAUSE EACH OF THEM *IS* A SHIPPED
#        ACCEPTANCE CRITERION WRITTEN AS A TEST. Positive toBeVisible() at adm-01:53,103,199,
#        adm-02:84,293,301, adm-03:59, adm-04:411, cal-03:476, tea-05:147; negative toHaveCount(0)
#        at adm-01:206, adm-04:319,335, cal-03:302,487, tea-05:156; plus adm-04:415, a text
