#    ADR-007 and both shells under ADR-010, so that defect never gets its chance.
#
# 2. THE COST OF THIS ROW, MEASURED, AND IT IS THE THING A REVIEWER MUST NOT DISCOVER LATE.
#    IT AMENDS ACCEPTANCE CRITERIA THAT FIVE `DONE` TICKETS SHIPPED, AND NO AVAILABLE SHAPE AVOIDS
