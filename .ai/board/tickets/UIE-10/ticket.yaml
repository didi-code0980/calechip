# 3. THE ONE CRITERION THIS TICKET OWES THAT NOBODY WOULD MISS UNTIL IT WAS TOO LATE.
#    THE SIX NEGATIVE ASSERTIONS PASS *VACUOUSLY* ONCE THE IDS THEY NAME STOP EXISTING. They are the
#    only shipped statements anywhere that a member is not offered the admin surface, and an
#    assertion that a named node is absent is satisfied by the name never having existed. A reviewer
#    who sees six green assertions after this ships is seeing nothing.
#    WHICH NODE ASSERTS THE MEMBER CASE INSTEAD IS AN ACCEPTANCE CRITERION THIS ROW MUST WRITE. It is
#    open question 3 of the idea file, carried here unanswered on purpose.
#
# 4. THE THREE GENERAL LINKS STAY, AND IT IS A DECISION TAKEN AT TRIAGE RATHER THAN AN OVERSIGHT.
#    `home-week-link`, `home-year-link` and `home-holidays-link` are NOT removed. Where the
#    operator's words and the picture differ, THE WORDS GOVERN: the request names the ADMIN links;
#    the transcription's sidebar has no navigation links at all. Two verified facts make the
#    picture's version unbuildable as written:
#    4.1 THE TOP BAR IS NOT A SUBSTITUTE OFF THE PERIOD ROUTES. periodNavFor returns null when the
#        second path segment is absent or unrecognised (src/lib/period.ts:315), and
#        src/components/TopBar.tsx:89 and :150 gate the entire left cluster AND the entire
#        Week/Month/Year switcher on `nav !== null`. So on /allow-list, /members, /holidays,
#        /threshold, /entries/new, /entries/:id/edit, /entries/team and /entries/pending there is no
#        switcher, no anchor and no Today control at all — and on the three of those with no
#        back-link of their own the sidebar's week and year links are the ONLY route to a calendar.
#        They are redundant on the six period routes and load-bearing everywhere else.
#    4.2 /holidays WOULD BE STRANDED. It is linked from exactly one place in the entire product
#        (src/components/Sidebar.tsx:209) and the screen itself only links to other years. THE ADMIN
#        CONTROL COULD NOT ADOPT IT: /holidays is guarded on a SESSION AND NOT A ROLE, on the stated
#        ground that holiday_select_all is `using (true)`, and ADM-02 AC-15 asserts the link is
#        offered to BOTH ROLES (tests/e2e/adm-02-holidays.spec.ts:291-302). Moving it behind an admin
#        control would break a shipped criterion and take the national holiday calendar away from
#        every member.
#    Emptying the nav block entirely remains available AS ITS OWN IDEA, and it owes a second answer
#    for /holidays before it can be one.
#
# 5. THE FIRST CLAUSE OF THE REQUEST — *change layout of left side bar* — IS SERVED HERE AND MUST NOT
#    BE QUIETLY DROPPED. The buildable part is the ROLE WORD ON EACH ROSTER ROW, which sits inside
#    the `.ai/standards/ui-design-system.md` § *Visual specification* grant as arrangement. It comes
#    with two obligations that must reach acceptance criteria:
