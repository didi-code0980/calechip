schema_delta: >-
  NOT none — ADR-014, no carve-out. One new migration,
  `supabase/migrations/<timestamp>_tea04_member_writes.sql`, adding four things to
  `public.member` and altering no table: a COLUMN-LEVEL grant `update (role, removed_at)` to
  `authenticated`, which is what withholds `id`, `team_id`, `display_name`, `avatar` and
  `created_at` from everybody (AC-7, INV-07); the policy `member_update_admin`, scoping the
  update to an admin of the caller's own team; the function
  `public.member_enforce_role_and_removal()`; and the BEFORE UPDATE trigger of the same name.
  The trigger is what `with check` cannot be — it sees only the new row, so no policy can say
  "this column did not change" (rbac-and-security.md known weakness 6, which names this exact
  remedy). It refuses demotion, refuses promoting a removed member, refuses undoing or
  re-dating a removal, refuses an admin removing themselves, and overwrites a caller-supplied
  `removed_at` with `now()`. No `alter table`, no column, no drop, and no insert or delete
  policy — ADR-018 Decision point 3 forbids those two permanently. Applying it is human,
  RULE-09. Full statements in 01-plan.md section 6. Re-read by orchestrator at the READY
  transition per ADR-020 §Affected documents: this field was written against point 3 as it read
  before the amendment, which forbade `update` as well. ADR-020 narrowed it, and the `update`
  policy above is admissible because all three of its conditions hold together — the grant is
  column-limited (`update (role, removed_at)`, never blanket), `member_update_admin` is scoped
  to an admin of the caller's own team, and `member_enforce_role_and_removal()` is a
  BEFORE UPDATE trigger carrying what `with check` structurally cannot express. Verified against
  01-plan.md section 6 rather than assumed.
