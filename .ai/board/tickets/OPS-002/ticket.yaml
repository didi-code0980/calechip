# 5. ***DEFINITION OF READY ITEM 6 — THE STATED SPLIT RATIONALE. THIS IS THE ONE THAT IS OWED.***
#
# Item 6 (.ai/01-operating-model.md:336) reads "Exactly one feature group, or a stated split
# rationale". THIS TICKET SPANS TWO GROUPS — CAL and TEA — so the second clause applies and this
# section is what discharges it. `group: CAL` above is a single-valued field recording the primary
# group; `feature_ids` carries the truth.
#
# THE SPLIT IS FORCED BY A MECHANISM, NOT CHOSEN FOR CONVENIENCE. The two seam implementations
# DUPLICATE THEIR REFUSAL LITERALS BY DESIGN, and src/lib/data/supabase.ts:286-288 says so in its own
# words: the three sentences are "held here so the two implementations of the seam can carry the same
# words — mock.ts repeats these literals for the same reason src/lib/fixtures.ts and
# supabase/seed.sql repeat theirs."
#
# ***AND NOTHING WOULD CATCH A ONE-SIDED TRANSLATION.*** tests/seam-parity.test.ts:27-48 compares
# EXPORT NAMES AND ARITY ONLY. It never compares message text, and its own header (:7-9) says parity
# is "necessary and NOT sufficient". So translating one implementation and not the other is GREEN
# against every check this project has — typecheck, lint, unit and the mock-driven end-to-end suite —
# and diverges ONLY against a real Supabase project, where nobody is looking.
#
# Those two files carry BOTH the entry refusals (CAL-01, CAL-02) AND the auth, allow-list and member
# refusals (TEA-01..TEA-05). THE SEAM PAIR THEREFORE CANNOT BE CUT BY GROUP without creating exactly
# that hole. Splitting it is the one thing this partition may not do.
#
# The seven rows and what each contributes, so a reviewer can check the list rather than trust it:
#   CAL-01  src/routes/NewEntry.tsx, src/components/EntryForm.tsx, and the entry-create refusals
#           in both seams — supabase.ts:258-291, mock.ts:652-680
#   CAL-02  src/routes/EditEntry.tsx, and the entry-update and entry-delete refusals in both seams
#   TEA-01  the sign-up refusals — supabase.ts:196-219, mock.ts:315
#   TEA-02  the allow-list refusals — supabase.ts:233-238 and :430-437, mock.ts:376-418
#   TEA-03  the member-read refusals reached through the same seam functions
#   TEA-04  the remove and promote refusals — supabase.ts:526-555, mock.ts:489-540
#   TEA-05  the sign-in refusals — supabase.ts:208-216, mock.ts:598-607
#
# TEA-03's contribution is the THINNEST of the seven and is listed for completeness rather than
