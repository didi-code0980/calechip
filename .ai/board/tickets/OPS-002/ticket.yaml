# 1. SCOPE — the entry screens and the seam's error messages. FIVE FILES.
#
# This is one half of a thirteen-file surface. The other half is OPS-001. The cut is at the
# entry-management boundary and the reason it is cut at all is arithmetic, not taste:
# .ai/01-operating-model.md:374 sizes "more than 12" files as L and says L MUST SPLIT AT PLAN.
#
# Interface copy to translate — each with the diacritic line count measured at triage:
#
#   src/routes/NewEntry.tsx      14  form titles :89-91, status words :167-170, delete confirmation
#   src/routes/EditEntry.tsx     13  STATUS_LABELS :26-28, form titles :116-118, approval line :149
#   src/components/EntryForm.tsx 13  TYPE_LABELS :34-37, PORTION_LABELS :42-46, field legends,
#                                    one refusal :143
#   src/lib/data/supabase.ts     24  every `message` value, incl. the three refusal constants :289-291
#   src/lib/data/mock.ts         26  every `message` value — THE SAME LITERALS, see §5
#
# THE ERROR MESSAGES ARE INTERFACE COPY AND THE STANDARD SAYS SO IN ITS OWN WORDS, at
# 3ccbd37:.ai/standards/ui-design-system.md:56-59: both seam implementations return `{ code, message }`
# and "the `message` half is rendered to a user — so it is governed here and not by the fact that it
# sits in the data layer. The `code` half is an identifier and is already English."
# ***THE `code` VALUES MUST NOT CHANGE.*** Callers branch on them.
#
# ONE MEANING IS ENCODED IN THE CURRENT VIETNAMESE AND MUST SURVIVE THE TRANSLATION.
# src/components/EntryForm.tsx:28-30 records that WFH is a TYPE and not a kind of absence — "A WFH
# member IS working — the glossary calls this the single most costly confusion in the domain, which
# is why the label says so rather than saying 'vắng'". The English label owes the same distinction.
# CAL-03 has already chosen wording that keeps it (see §6): "Leave" and "Working from home".
#
