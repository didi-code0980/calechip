# 2. ***OUT OF SCOPE, AND IT IS A NEGATIVE REQUIREMENT — THE KIND NOBODY CHECKS.***
#
#   src/lib/fixtures.ts   —  8 Vietnamese lines. DO NOT TOUCH.
#   supabase/seed.sql     — 16 Vietnamese lines. DO NOT TOUCH.
#
# THIS WARNING IS ON BOTH OPS TICKETS ON PURPOSE. fixtures.ts sits in src/lib/, one directory from
# src/lib/data/, which this ticket does edit — so this is the ticket most likely to sweep it up.
#
# 3ccbd37:.ai/standards/ui-design-system.md:61-74 carries a DELIBERATE EXCEPTION. Display names,
# team names and note text in fixtures and seed data STAY VIETNAMESE, WITH DIACRITICS. They are not
# interface copy — they are stand-in USER CONTENT, and the users of this product are a Vietnamese
# team whose names carry diacritics. The line is BY ROLE, NOT BY FILE:
#   "What the product says is English; what a user typed is whatever they typed."
#
# IT IS THE PRODUCT'S ONLY COVERAGE FOR THE DIACRITICS REQUIREMENT in CLAUDE.md § Visual direction,
# which asks for a type face that renders Vietnamese diacritics correctly. Flatten it and NOTHING
# ANYWHERE renders a diacritic, so the next font change breaks the real names of real people.
#
# ***THE FAILURE IS SILENT AND THE STANDARD PREDICTED IT IN ADVANCE***
# (3ccbd37:.ai/standards/ui-design-system.md:70-71). The mechanism, verified in this tree:
#
#   src/routes/Home.tsx:26          roleLabel returns "Thành viên"  -> INTERFACE (OPS-001's)
#   supabase/seed.sql:345, :356     display_name is "Thành viên"    -> USER CONTENT, keep
#   tests/e2e/tea-05-sign-in.spec.ts:63  asserts home-member-name    -> the SEED row, keep
#   tests/e2e/tea-05-sign-in.spec.ts:65  asserts home-member-role    -> the LABEL, translate
#
# SAME LITERAL. TWO LINES APART. OPPOSITE VERDICTS. A find-and-replace of "Thành viên" translates
# the seed data along with the label AND EVERY TEST STILL PASSES. Nothing in the toolchain will
# report it: scripts/check-docs.mjs has NO language check and eslint.config.js has NO rule for it.
# The only control is whoever reads the diff.
#
# THE SAME TRAP EXISTS INSIDE THIS TICKET'S OWN FILES. src/lib/fixtures.ts:332 is
# `note: "Nghỉ đã được duyệt"` and supabase/seed.sql:493 is the same note — USER CONTENT, kept —
# while src/routes/EditEntry.tsx:27 is `approved: "Đã duyệt"`, a STATUS LABEL that must become
# English. And src/lib/fixtures.ts:304 is `displayName: "Đã duyệt"`, which is the same string as the
# status label and is a NAME. Three occurrences, two verdicts, one of them in this ticket.
#
# NOTE FOR PLAN, AND IT IS THE POINT OF THE THREE-COPY PROBLEM IN §6: the notes and names above are
# WHY the acceptance suites keep most of their Vietnamese. Of the 24 Vietnamese lines across the four
# e2e specs, only THREE assert interface copy, and all three are OPS-001's. This ticket should expect
# to change NO test string — only test EXPECTATIONS that read the seam's `message`, if any exist.
