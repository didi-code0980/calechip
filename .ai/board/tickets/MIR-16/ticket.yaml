# [predicted] at plan time. Corrected at ship in .ai/board/plans/feature-change-log.md.
mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan P4-1 (plan:230-236). The audit's count — 4 checks mean team, 3 groups org, 4 groups system — is the
  migration map (plan:228, A:494-502):
  - `system_admin` as a separate account type, not a value on `member.role`
  - `member.role` becomes `org_admin` | `member`; team-level `manager` moves to `membership.role_in_team`
  - Replace `is_admin(uid)` with `is_org_admin(uid, org_id)` and `is_system_admin(uid)` across ~25 call sites
  - `may_decide(uid)` gains a team parameter (`manager_role:62` hardcodes the role list)
  - Re-point the four system-scope groups: sign-up queue, holidays, issue reports, event override
    DECIDED by the operator, 2026-10-12: the sign-up queue is decided by `org_admin`, not `system_admin`.
  - Resolve the demotion trigger's ambiguity between the two admin kinds (`profile_self_update:165`)

  Audit references (A:941-963):
  - Enum `'admin'` and rank order — `tea01:22`, `manager_role:36`
  - `is_admin` — `member_approval:69-78`, ~25 policies and functions
  - `may_decide` — `manager_role:62`
  - Demotion trigger — `profile_self_update:165`
  - `set_member_role` — `cross_team_role:108`, `supabase.ts:1628-1634`
  - Bootstrap writes `'admin'` — `supabase/bootstrap.sql:193`
  - A `system_admin` with no `member` row lands on NotOnATeam — `src/hooks/useSession.ts:89-93`
  - System-scope groups: sign-up `member_approval:138-167`; holidays `adm03:35-50`; issue reports
    `issue:108-132`, `issue_img:148-153`; event override `evt01:134-142`, `evt02:332-346`
  - Org-scope groups: `many_teams:53-206`, `cal11:33-65`, `cross_team_role:92-120`
