mir_detail: |
  Between MIR-15 and this ticket, the mock is LOOSER than SQL on one predicate: a `public` event
  still reaches every team in the mock, while the database bounds it to the event's team in Org
  public (ADR-076 decisions 1–3). This ticket closes that. It adds no behaviour.

  The mock models one tenant, and it is Org public (every fixture is in it), so it implements the
  shared branch only (MIR-15 01-plan.md § 4.4, carried here):
  - `mayReadEvent` and `isEventAudience` (src/lib/data/mock.ts:740-754, :786-797): `event.scope ===
    "public"` becomes `(event.scope === "public" && event.teamId === mine)`.
  - `createEvent`'s `notify_event_created` filter (mock.ts:3563) becomes `memberTeamId(id) === row.teamId`.
  - `listMemberDirectory` (mock.ts:3469-3519) unchanged in code; its comment says (c) and (d) now
    reach through the narrowed `mayReadEvent`.

  Tests that assert today's cross-team reach, from the census taken at /plan MIR-15 (file:line is
  the assertion or the helper call that throws first). Each is changed to assert MIR-15's ACs, never
  deleted:
  - tests/events.test.ts:226-227, :305, :450
  - tests/member-directory-scope.test.ts:134, :140-150, :157, :166, :173, :178, :238
  - tests/event-attendance.test.ts:194, :257-261, :453-459 (its `input()` defaults to public, :60)
  - tests/notifications.test.ts:176-177, :222-226, :289-291, :318 (default public, :60)
  - tests/event-email.test.ts:186, :216-224, :250
  - tests/event-invitation.test.ts:396
  - tests/guest-link.test.ts:298-312, :446-447
  - tests/guest-registration.test.ts:445-458, :478-481
  - tests/event-layer.test.ts:271-272
  - tests/e2e/evt-02-attendance.spec.ts:153-158, :173-191 (the create helper defaults to public, :74)

  NOT changed, by ADR-076 decision 4 (admin unchanged): src/lib/event-layer.ts:74 and the tests
  that read it (event-layer.test.ts:157-168, :224; description-pictures.test.ts:134-136;
  e2e/evt-03-calendar-events.spec.ts:251). Ask at PLAN whether
  src/components/EventAttendancePanel.tsx:133-134 (`inAudience`, `case "public": return true`) should
  follow — it is an affordance only; the server refuses the join.

  That is 11 test files plus mock.ts — 12 paths, the M ceiling. If PLAN adds one, it splits again.
