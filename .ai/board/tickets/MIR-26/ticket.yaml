# [predicted] at plan time. Corrected at ship in .ai/board/plans/feature-change-log.md.
mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.
  Plan S-5 (plan:386-389), from the solo-user section (plan:329-441):
  - Create the member row (in Org public), the personal team (`is_personal = true`) and the one
    membership joining them, in a single transaction
  - `role_in_team = 'member'` on the personal team; there is no manager (rule 6)

  DECIDED by the operator, 2026-10-20: an uninvited signup does not wait in the admission queue.
  That changes what ADR-033 ("A person joins by signing up; an admin decides afterwards") decided, so
  this item requires an ADR — `requires_adr: true`.

  DECIDED by the operator, 2026-10-20: this item waits for MIR-31 (abuse surface) — open signup without
  a rate limit would be a production hole the day it ships.

  Blocked by MIR-10, MIR-12, MIR-25 (`is_personal`), MIR-27 (the team is born with its forced config)
  and MIR-31.

  OPEN QUESTION — plan Q2: what is the "invitation" that separates a solo signup from any other? The
  plan defines no org invitation; today every signup is uninvited (TEA-09). Until one exists, every new
  signup becomes a solo user.

  Today's signup path, which this item replaces for the uninvited case: the admission trigger
  `avatar_images:63-79` (MIR-12 adds `org_id` to it) and `member_approval:50`.
