mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Appended 2026-10-12 with the next free number. The last step of plan P3-3 (plan:187), split out of
  MIR-12 so that MIR-12 → MIR-13 → MIR-21 has no cycle; the operator delegated the order.
  - Drop `member.team_id` only after all readers move to `membership`

  Blocked by MIR-12 (the `membership` backfill) and MIR-13 (the readers rewritten).

  Audit references:
  - `member.team_id` single-valued, `tea01:33`; NOT NULL dropped at `member_approval:50` (A:126, A:968)
  - Readers that must have moved first: `member_team_id()` `member_approval:57-63` and every policy in
    audit §5; `listMembers` `supabase.ts:1523-1530`; `listPendingMembers` `supabase.ts:1430-1436` and
    `countPendingMembers` `supabase.ts:3107-3111`; `entry_apply_approval_setting` `approval_settings:111-118`;
    `busy_day_select_team` `busy_day:97-105`
  - Client types and the mock — `src/lib/domain/types.ts`, `src/lib/data/mock.ts` (A:938)

  Expected impact is none: the behaviour change lands in MIR-12 and MIR-13; this removes a column nobody reads.
