mir_detail: |
  The drop of P3-3's last step. MIR-21-b ships first and leaves, in the database:
  `public.membership_make_primary(uuid, uuid)`; writers that write `membership` and still assign
  `member.team_id`; and a `member_sync_membership` trigger reduced to `after insert or update of
  removed_at` (ADR-078 decisions 1 to 4).

  In scope, from ADR-078 decision 5 (as read on 2026-11-05):
  - drops: column member.team_id, member_team_id_idx, the `update (status, team_id)` grant's column,
    public.member_team_id(uuid), the mirror's INSERT branch
  - the `team_id` assignments ADR-078 decision 1 keeps in admit_member, reject_member, move_member,
    set_member_team
  - stamp_org_id (`member` branch: org from `new.team_id`); admit_allow_listed_member's column list;
    member_decide_admin (inert since ADR-064 decision 1); member_enforce_role_and_removal's team clause
  - the seam: set_member_role, set_member_team and promote_member_to_admin return a `public.member`
    row that `toMember` reads `team_id` from (src/lib/data/supabase.ts:1224, :1851, :1865)
  - fixtures and tests naming the column: supabase/tests/_isolation.psql (tests.seed), 010, 030, 040,
    070, 100, 110, 120, 140, 150, 160, 190, 210, 220; supabase/seed.sql, supabase/bootstrap.sql,
    supabase/create-account.sql
  - .ai/standards/data-model.md, where it documents the column

  Obligations it may not drop (ADR-078 decision 6): ADR-064 decision 3's self lock moves to
  `membership`; a removed member's rows still close at greatest(removed_at, joined_at).

  Predicted L at /plan MIR-21-b: its PLAN splits it again.

  **Split at /plan MIR-21-c on 2026-11-06 (ADR-079).** This ticket now carries decision 1 only: the
  team lock on `membership`, the seam's three RPC reads and `admit_allow_listed_member`'s column list.
  The list above is distributed over MIR-21-d, MIR-21-e and MIR-21-f (01-plan.md § 1).
