mir_detail: |
  Slice 5 of P4-1 (ADR-084 decision 2). Moved here from MIR-16-d's mir_detail at /plan MIR-16-d,
  counted against the local catalogue at migration 20261107230000:
  - `alter type public.member_role rename value 'admin' to 'org_admin'`. It updates no row and fires
    no trigger, so the demotion trigger's refusal of any change away from 'admin' is never met
    (ADR-084 Context).
  - re-created in the same migration, because their bodies are stored as text: is_org_admin,
    member_enforce_role_and_removal (the demotion clause and its message name `org_admin`),
    may_decide, set_member_role and promote_member_to_admin. No policy, constraint, default, index
    predicate or view spells the value; re-verify at PLAN.
  - `supabase/tests/_isolation.psql`: the `'admin'` branch of `tests.member_role` returns
    'org_admin' (ADR-084 decision 1)
  - `supabase/bootstrap.sql` (lines 142, 161, 208 on 2026-11-07) and `supabase/seed.sql` (96, 155,
    310, and the comment at 117)
  - `src/lib/data/supabase.ts`: 'org_admin' maps to the application's "admin" in `toMember`, and
    "admin" maps to 'org_admin' in the `p_role` argument of `set_member_role`, so an "admin"
    argument is still refused with 42501 and not 22P02. `MemberRole` does not change (MIR-17).
  - the five fixture files MIR-16-d left: 250 (line 48), 260 (46), 270-issue-reports (68),
    270-member-team-id-dropped (151, a read-back) and 280 (54), each through `tests.member_role`
  - `290-member-role-helper.test.sql` is not edited: its assertions hold on both sides of the rename
  - in Org public, today's admins become its org_admins (ADR-082 decision 3); the rename carries the rows
