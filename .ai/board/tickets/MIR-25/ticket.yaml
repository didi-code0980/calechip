mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.
  Plan S-4 (plan:383-385), from the solo-user section (plan:329-441):
  - `team.is_personal` column
  - A database constraint that a personal team has exactly one membership — not application code

  Blocked by MIR-10 (the schema design to approve must include this column — recorded in the plan,
  plan:433-441; MIR-10 itself is not edited) and MIR-12 (`membership` exists and is backfilled).

  For PLAN: "exactly one" is zero for an instant while the team and its membership are created
  (MIR-26 does both in one transaction). How the constraint tolerates that instant is a design choice
  for PLAN, not made here.

  Related: MIR-22 tests this item.
