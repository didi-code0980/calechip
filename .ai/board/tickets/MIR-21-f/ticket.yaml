mir_detail: |
  Slice 4 of 4 of the drop (ADR-079). After MIR-21-e no reader, writer or fixture names
  `member.team_id`, except the catalogue and self-lock tests below.

  In scope, from ADR-079 decision 4 (as read on 2026-11-06):
  - drops: column member.team_id, member_team_id_idx, the `update (status, team_id)` grant's column,
    public.member_team_id(uuid), the mirror's INSERT branch, the `team_id` clause of
    member_enforce_role_and_removal, stamp_org_id's `member` team lookup, the member_decide_admin
    policy (inert since ADR-064 decision 1)
  - kept verbatim: the removal branch of member_sync_membership, which closes a removed member's
    rows at greatest(removed_at, joined_at) (ADR-078 decision 6)
  - tests naming the column or the function: supabase/tests/010, 040, 100, 110, 160 (AC-1)
  - .ai/standards/data-model.md and .ai/standards/rbac-and-security.md, where they document the
    column or member_decide_admin
  - its own migration and pgTAP test

  Predicted about nine paths at /plan MIR-21-c.
