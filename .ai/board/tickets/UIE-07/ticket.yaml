# 2. THE FOUR CLAUSES, VERBATIM FROM ADR-029 § Decision — THE SUBSTANCE OF THE CRITERIA
#
# THEY ARE THE SUBSTANCE AND NOT THE CRITERIA. Writing them as Given/When/Then is PLAN's, from the
# registry row (.ai/registry/features.md, `UIE-07`). `product` writes no acceptance criteria.
#
# The decision itself: "The week view renders, in a footer strip on each day column, the absence
# count for that day and the team's current member count, as `n/N`." Then, quoted:
#
#   1. "The number is `absenceCountsFor(entries, range, roster)` and nothing else" — the same call
#      with the same arguments the month grid makes. "A `week-row` count, a `people.length`, or any
#      local filter or sum is forbidden." That sentence belongs in the criterion, because "a
#      comment does not survive the next developer".
#   2. "The denominator is `currentMemberCount(roster)`." Never a literal. The fixtures give 4, not
#      the image's 8.
#   3. "No threshold, no overload state, no `seam.getTeam()`." The screen still computes no
#      overload, so the second clause of UIE-04's AC-13 survives intact and only its first clause
#      is superseded.
#   4. "The label may not say 'away'." WFH is counted and a WFH member is working (OPS-002 AC-7,
#      src/lib/labels.ts:24-29). The strip names the absence count as the glossary names it, or it
#      names nothing at all. "It is English" — .ai/standards/ui-design-system.md § Language, the
#      operator's own instruction of 2026-09-03 — so `vắng` is not available whatever noun is
#      chosen.
#
# ***CLAUSE 1 IS THE ONE THE WHOLE DECISION RESTS ON, AND ITS EXACT WORDING IS LOAD-BEARING.***
# ADR-029:133-134: "INV-04 is satisfied by this decision rather than amended, and the invariant
# ledger is not edited. That is a property of clause 1 and of nothing else: without it, this
# decision becomes option 3 below." Option 3 is the chip count — a day holding one full-day and two
# half-day entries has THREE chips and an absence count of TWO — which is INV-04's forbidden second
# definition, reached without ever opening absence.ts. UIE-04 refused it and that refusal stands.
# ***ONE OCCURRENCE OF A COUNT NOT PRODUCED BY `absenceCountsFor`, ANYWHERE IN THIS PRODUCT, IS
# ADR-029's REVERT CONDITION*** — including a chip count, a `people.length` or a locally filtered
# sum. The only thing separating the permitted number from the forbidden one is a discipline that
# nothing in the toolchain enforces, which is why clause 1 is a criterion and not a comment.
#
# CLAUSE 2'S DENOMINATOR, on disk: src/lib/fixtures.ts holds FOUR unremoved members of the main
# team (:39, :72, :149, :319; :108 is another team, :123 carries `removedAt`). The image's roster
# of eight is fictional and NOTHING MAY BE ASSERTED FROM IT.
#
# THE TWO FUNCTIONS, on disk and verified rather than recalled: `absenceCountsFor(entries, range,
# roster)` at src/lib/data/absence.ts:197 and `currentMemberCount(roster)` at :348 TAKE NO TEAM AND
# NO THRESHOLD, and src/routes/WeekView.tsx:180 and :258 already hold `roster` and `entries` in
# state — :180 is the `phase: "ready"` union, :258 the `setView` that fills it from the reads at
# :252-256. ***THIS CITATION READ `:207` WHEN THIS SHELL WAS WRITTEN AND `:207` IS WRONG*** — that
# line is a comment about the `landingDay` memoisation. Corrected here on 2026-09-08 at the fold-in;
# the FACT was never wrong, only the address. §12.0 records the two copies that still carry it.
#
# ---------------------------------------------------------------------------------------------
# 3. THE COMMENT REWRITE — ASSIGNED TO THIS TICKET BY ADR-029, WITH A REQUIREMENT ON THE REPLACEMENT
#
# src/routes/WeekView.tsx:11-17 STILL READS "**IT COUNTS NOTHING.**" — re-read on disk at this
# triage, 2026-09-08, in the tree as it stands. It states, at :11-13, that no absence count, no
# overload state and no threshold are computed and that `seam.getTeam()` is "deliberately not
# called ... it exists to supply `overloadThreshold`, and calling it would be the first step toward
# the number the feature row says this screen does not have", and at :14-17 that a filter written
# in that file "would be the second definition INV-04 exists to forbid".
#
# TWO OF THOSE REASONS ARE FALSE AND THE DECISION SAYS SO:
#   - A COUNT NEVER NEEDED A TEAM READ. :11-13 treats "a count" and "a `seam.getTeam()` read" as
#     the same thing. They are not — `getTeam()` supplies `overloadThreshold`, which a bare `n/N`
#     does not use, and the denominator comes from the roster the screen already reads.
#   - INV-04 IS NOT THE OBSTACLE. CAL-05's own plan says so at 01-plan.md:528-531, verbatim: "INV-04
#     forbids a second definition; this would not be one ... If a number is ever wanted here, it is
#     a criterion on the row rather than an inference from the module being in scope."
#
# ***ADR-029 § Consequences REQUIRES MORE THAN DELETING THE PARAGRAPH: "the replacement must carry
# the correction that a count never needed a team read — otherwise the next reader inherits the
# same wrong reason in new words."*** A replacement that simply describes the new footer, without
# saying that the old refusal rested on a reason that was not true, satisfies the letter and loses
# the whole point of the rewrite.
#
# WHAT MUST SURVIVE THE REWRITE, because :11-17 is not only wrong: the third reason IS still true
# and clause 3 preserves it — this screen computes no overload state, reads no threshold and does
# not call `seam.getTeam()`. And :14-17's warning about a local `.filter(...)` becomes MORE
# important rather than less, because it is now the guard rail on clause 1 rather than the reason
# for a refusal.
#
# ---------------------------------------------------------------------------------------------
# 4. ***AN OPEN DECISION HANDED TO PLAN: DOES "Everybody is in." GO?***
#
# ADR-029 AUTHORISES THIS TO BE *CONSIDERED*, NOT DECIDED. Its § Consequences: a footer reading
# `0/4` "removes the ambiguity that `week-day-empty` exists to remove, so deleting 'Everybody is
# in.' becomes defensible AND FOLLOWS FROM THIS DECISION. It is not authorised by this ADR; it is
# authorised to be *considered* by the ticket that implements it."
#
# ***UNTIL THIS TICKET DECIDES, THE SENTENCE STAYS.*** Without the count, deleting it makes "an
# ordinary Tuesday" and "we did not look" the same column — CAL-05 AC-13 and UIE-04 AC-10 — and
# ***tests/e2e/cal-05-week-view.spec.ts:266 ASSERTS SEVEN `week-day-empty` ELEMENTS***. ADR-029's
# test-surface note says that count is unaffected by this work UNLESS the sentence is also removed,
# which is exactly this decision. So the spec file enters `allowed_paths` if and only if PLAN
# deletes the sentence, and PLAN SAYS WHICH IT CHOSE and why, in 01-plan.md.
#
# UIE-05 IS THE REASON THIS IS STILL OPEN RATHER THAN ALREADY SPENT: its shell required
# `week-day-empty` to keep its element, its selector and its sentence and to be de-emphasised at
# most, precisely because the deletion was coupled to a count that was undecided at the time. The
# count is now decided, so the coupling is resolved and the deletion is not.
#
# ***§14 CARRIES A RECOMMENDATION ON THIS QUESTION, FOLDED IN ON 2026-09-08 — "Everybody is in."
# STAYS, AND THE DELETION IS DEFERRED*** — with the geometry that decides it, the one assertion it
# would cost, and the middle path that must be refused. IT IS A RECOMMENDATION AND THE DECISION IS
# STILL PLAN's. §12.2 is load-bearing on it: if the strip does not render at `0/N`, the `0/4` this
# whole question turns on never appears and the question dissolves without being answered.
#
