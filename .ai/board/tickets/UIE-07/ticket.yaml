# 13. FOLDED IN 2026-09-08 — THE DENOMINATOR: TWO FACTS, AND ONE DECISION LEFT TO PLAN
#
# 13.1 ***THE DENOMINATOR IS PROVABLY THE MONTH'S, AND THAT IS THE WHOLE ARGUMENT FOR THE STRIP.***
#   `currentMemberCount` is `roster.filter(m => m.removedAt === null).length` —
#   src/lib/data/absence.ts:348-349. BOTH SCREENS FEED IT FROM THE SAME UNFILTERED TEAM-SCOPED
#   `seam.listMembers()`: src/routes/WeekView.tsx:253 and src/routes/MonthView.tsx:213. The seam
#   DELIBERATELY does not filter removed members (ADR-013), which is what makes a past date
#   computable at all. The fixtures give ***4*** active, already asserted at tests/absence.test.ts:255
#   against a five-member roster.
#
# 13.2 ***`n/0` AND `n > N` ARE REACHABLE, AND THIS STRIP IS THE FIRST PLACE THEY CAN APPEAR ON
#   SCREEN.*** Under ADR-013 the NUMERATOR is DATE-SENSITIVE — an entry counts when its member's
#   `removedAt` is null or STRICTLY AFTER that date (src/lib/data/absence.ts:192) — while the
#   DENOMINATOR is READ-TIME (:333-336, "the current count, not the membership as it stood on the
#   date being judged", recorded by INV-04 as an ACCEPTED consequence). So on a PAST week, after a
#   removal, `n` CAN EXCEED `N`, and `N` CAN BE 0 WHILE `n` IS NOT.
#   THE MONTH GRID NEVER JUXTAPOSES THEM: the cell renders a bare `count` (MonthView.tsx:523-527)
#   with `N` up in the header (:399), and `isOverloaded` guards `currentMembers <= 0` before dividing
#   (absence.ts:343). NOTHING HERE DIVIDES EITHER, so this is a DISPLAY ODDITY AND NOT A DEFECT —
#   ***BUT PLAN SHOULD WRITE IT AS A CRITERION RATHER THAN DISCOVER IT***: two numbers and a slash,
#   NEVER a percentage, and NO SPECIAL CASE AT `N = 0`. A percentage would divide, and dividing is
#   where an oddity becomes a NaN on screen.
#
# 13.3 ***A DECISION FOR PLAN, RECOMMENDED BY `tech-lead-design` AND CONFIRMED ON DISK. RECORD BOTH
#   HALVES.*** src/hooks/useRoster.ts:56 HAND-ROLLS `members.filter((m) => m.removedAt === null)`,
#   and the sidebar prints `Team (4)` from it at src/components/Sidebar.tsx:167-171 — ***ABOUT 200px
#   FROM WHERE `n/4` WILL RENDER.*** And `currentMemberCount`'s OWN DOCSTRING at
#   src/lib/data/absence.ts:347 reads ***"INV-04's denominator, in one place"*** — and it is already
#   in two. Replacing that filter with `currentMemberCount(roster)` is ONE LINE, NUMBER-PRESERVING,
#   IN ONE FILE.
#   THE RECOMMENDATION IS TO INCLUDE IT AS A NAMED ACCEPTANCE CRITERION. If PLAN would rather hold
#   scope, ***IT BELONGS IN `01-plan.md` § Out of scope BY NAME, NOT BY SILENCE*** — a second copy of
#   the denominator beside a screen that now renders the denominator is exactly the kind of thing a
#   later reader assumes was never noticed. Either answer is defensible; NOT ANSWERING IS NOT.
#   COST IF TAKEN: one more path in `allowed_paths` (§9.2), and the sidebar's number must not move —
#   it is 4 before and 4 after, which is what "number-preserving" means and what a test would pin.
#
