# 1. WHY THIS TICKET EXISTS, AND WHY NO ADR IS OWED
#
# IT IS OBLIGED BY A DECISION THAT IS ALREADY MADE, NOT BY A JUDGEMENT TAKEN AT THIS TRIAGE.
# ADR-029 § Consequences, verbatim: "This decision does not create a ticket. On acceptance the idea
# is re-triaged and promotes into a `UIE` row carrying the four clauses above as the substance of
# its criteria. Nothing is built from this document alone."
#
# ADR-029 IS `ACCEPTED by orchestrator`, 2026-09-08. The operator delegated the decision rather
# than making it — "tưj quyết đi" — which lifted ADR-008's envelope gate WITHOUT SAYING WHICH WAY.
# That is why the signature is an agent's and never `ACCEPTED by the operator`, and why CODEOWNERS
# review at merge is the approval. ADR-008's revert condition points at exactly that document: if
# the operator disagrees with the decision at merge, RULE-09 goes back to v1 and this ticket goes
# with it. That is the mechanism working, not a failure.
#
# `requires_adr: false` FOLLOWS FROM THAT AND IS NOT AN OPTIMISTIC FIRST READING. The three
# artifacts that refused this number — CAL-05's registry row, CAL-05's 01-plan.md:95-97, and
# UIE-04's shipped AC-13 — are the envelope ADR-029 opened. PLAN does not stop and ask; it builds
# inside the four clauses in §2. IF PLAN CONCLUDES IT NEEDS SOMETHING OUTSIDE THEM — the overload
# state, a team read, or an amendment to INV-04 — THE CORRECT VERDICT IS `BLOCKED` WITH
# `requires_adr: true`, on ADR-008's test: decide inside the envelope, ask before changing it.
#
# WHAT THE ACCEPTANCE ALREADY OBLIGED AND WHAT IT DID NOT — verified on disk at this triage, so
# that nothing here is duplicated and nothing is assumed done:
#   DONE ALREADY, in the pull request that accepted the ADR, and NOT this ticket's:
#     - CAL-05's row in .ai/registry/features.md now reads "renders the absence count for each day,
#       from `absenceCountsFor` and no other source". DO NOT RE-AMEND IT.
#     - UIE-04's row carries its superseding line: AC-13's FIRST clause no longer holds, its
#       SECOND (no team read, no overload state) survives. DO NOT RE-AMEND IT.
#   NOT DONE, AND IT IS THIS TICKET'S — §3.
