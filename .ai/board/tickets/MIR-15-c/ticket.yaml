mir_detail: |
  The last item of MIR-15, transcribed from MIR-15's ticket.yaml `mir_detail` (plan P3-6,
  plan:210-211; plan:317 "Org-to-org team transfer UI — Needed by Phase 3 for Org public; polish
  later"; ADR-074 decision 8 and ADR-075 § Context: "Move-team-between-orgs is MIR-15's").

  - Build "move a team to another org" in the system panel — needed the day a customer buys a
    licence (plan:210).

  Questions this ticket's PLAN must settle or route to the operator, none of which the sources
  answer (found at /plan MIR-15, not decided there):
  - A user belongs to exactly one org (ADR-059 decision 1). A member of the moved team who is also
    on another Org public team cannot follow into both orgs — which membership survives?
  - Every org-stamped row carries a composite FK to its parent's `org_id` (MIR-11). Which rows move
    with the team — its members' entries, busy days, tasks, notifications, events created in it,
    attendances and invitations crossing teams — and what happens to cross-team rows left behind?
  - Whether a move is allowed only from Org public, or between any two orgs; and whether the target
    org's caps (`max_members`, `max_teams`, ADR-075) refuse it.
