schema_delta: >-
  NOT none although it adds no column, no table and no constraint — unchanged in substance from
  triage. ADR-014, `ACCEPTED by the operator`, settles that a migration creating a row-level
  security policy is not `none`: under ADR-005 the policy IS the entire authorization model.
  ADR-015 is LINKED and NO NEW ADR IS AUTHORED — all four statements are transcribed from its
  section 3, and supabase/db.sql already carries the same four marked `[OWED] ADM-03` under
  ADR-026 decision point 2, which admits an object only when an accepted ADR writes it out in full.
  One new migration, `supabase/migrations/20260905140000_adm03_holiday_writes.sql`: ONE POWER,
  THREE POLICIES, because PostgreSQL has no single `for write` — `holiday_insert_admin`,
  `holiday_update_admin` (both `using` and `with check`), `holiday_delete_admin` — plus
  `grant insert, update, delete on public.holiday to authenticated`, which is NOT inherited because
  ADM-02's migration revokes all and grants `select` alone. `public.is_admin(uuid)` needs no grant:
  TEA-01 already granted execute at 20260831150024_tea01_membership.sql:71, and it filters
  `removed_at is null` in its own body, which is where AC-16 comes from. NO TEAM CONJUNCT, unlike
  every other write policy in this schema — `holiday` has no `team_id` and the calendar is national;
  ADR-015 Rationale records and accepts the P2 consequence. The read half (ADM-02's `grant select`
  and `holiday_select_all`) is NOT touched. `unique (date)` is not created here either — ADM-02's
  migration carries it and this ticket only makes a person meet it. Applying the migration is human,
  RULE-09. Full statements in 01-plan.md section 6.
