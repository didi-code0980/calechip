# Created by `product` at /triage on 2026-08-31, promoting
# .ai/board/ideas/2026-08-31-everyone-computes-the-bridge-day-alone.md.
#
# Definition of Ready items 1, 3, 4 and 6 are filled here. Items 2 and 5 (invariants_touched,
# size_estimate) are deliberately empty: they belong to the BA at SPEC.
#
# Item 6. One group: ADM. The title is the permission row in rbac-and-security.md transcribed
# without paraphrase — "Add, edit or delete a holiday or swap day", member (no), admin (yes).
#
# Item 3. ADM-02 alone, and it is a hard edge rather than an ordering preference: this ticket
# writes to a table and an enum that ticket creates. TEA-01 is inherited through it and is not
# named twice.
#
# Item 4. Not `none`, although it adds no column. ADR-014, `ACCEPTED by the operator`, settles
# that a migration creating a row-level security policy is not `schema_delta: none` — under
# ADR-005 the policy is the entire authorization model. ADR-015 is linked; its section 3 carries
# the three policy shapes.
#
# One power, three policies, because PostgreSQL has no single `for write`:
# holiday_insert_admin, holiday_update_admin (both `using` and `with check`), holiday_delete_admin,
# plus `grant insert, update, delete on public.holiday to authenticated`.
#
# `public.is_admin(uuid)` needs no grant here. TEA-01's migration already does
# `grant execute on function public.is_admin(uuid) ... to authenticated` at
# supabase/migrations/20260831150024_tea01_membership.sql:71, verified on disk. A second grant
# would read as a control and would not be one.
#
# The form carries `kind` — the `non_working` / `working` enum from ADR-015 section 2. The values
# name the effect on the working calendar and not the Vietnamese label; a `làm bù` mandated
# Saturday is `kind = 'working'`, the exact inverse of a holiday. Losing that field makes
# bridge-day detection wrong on CAL-08 rather than incomplete here.
#
# `unique (date)` is where a person meets a constraint: a second row for a date must be refused
# with something the admin can act on, not a database error.
