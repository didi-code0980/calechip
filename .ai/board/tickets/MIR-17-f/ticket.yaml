mir_detail: |
  The rest of P4-2 (ADR-092 decision 4):
  - `MemberList.tsx:151`, `:215`, `:351-361`, `:419`, `:643`. canRemove / canPromote / canSetManager
    compare `m.teamId === me.teamId` while the database admits any of the caller's active teams
    (member_team_ids). The Make/Remove manager toggle reads `m.role`, which is the any-team rank
    since MIR-17-d (ADR-091), but writes the roster team's team_role; it needs each row's roster
    team role, which `Member` does not carry — a batched definer read is predicted (ADR-092 Context)
  - `viewed-team.ts:61`, `:85`; `useViewedTeam.tsx:56`
  - router role guards (`src/App.tsx`): decide between intercepting at the route and the screens'
    in-place refusals (ADR-089 Context)
  Not counted at /plan MIR-17-e. Expected to split again at its own PLAN.
