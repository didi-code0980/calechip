# Created by `product` at /triage on 2026-08-31, promoting
# .ai/board/ideas/2026-08-31-no-way-to-tell-a-settled-plan-from-a-typed-one.md.
#
# Definition of Ready items 1, 3, 4 and 6 are filled here. Items 2 and 5 (invariants_touched,
# size_estimate) are deliberately empty: they belong to the BA at SPEC, and the gate sits after
# SPEC so that they can.
#
# Item 6. One group: ADM. The split from ADM-05 is by operation rather than by surface, per the
# operating model's "split by operation first (read path, then write path), then by surface" --
# the same rule that settled ADM-02 against ADM-03 earlier the same day. This ticket makes the
# queue visible; ADM-05 makes it decidable. `product` argued at triage that the worklist was not
# separable and lost; the argument is recorded in the idea's verdict because it fixes what this
# ticket must NOT do -- it carries no approve control and no reject control.
#
# Item 3. CAL-01 for the `entry` table and its select policy; it transitively carries TEA-01.
# TEA-03 is a hard dependency and not a courtesy: TEA-01's `member_select_own` returns only the
# caller's own row, so an embedded member(display_name, avatar) comes back empty until TEA-03
# widens that policy, and a worklist of unnamed entries is not the feature. ADM-01 because its
# own Notes say the later admin rows inherit its screen-versus-settings-area answer.
#
# Item 4. Genuinely `none` under ADR-014: this ticket reads through the select policy CAL-01
# already ships and adds no policy, no column and no grant.
#
# The failure mode the story must be written against: a capped read makes a queue SHORT, so
# pending items are silently invisible and are therefore never decided. The outstanding badge
# derives from an exact count and never from data.length, and the badge and the list must not be
# able to disagree. TODO(verify): Supabase's default max-rows.
