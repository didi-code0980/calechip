mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan Phase 6 checklist (plan:287-305). Depends on Phases 3 and 4 (plan:291):
  - Audit table: actor, target org, action, timestamp, reason
  - Impersonation is read-only, time-boxed (30–60 min), requires a stated reason
  - A persistent banner shows the session is impersonated
  - `org_admin` can read the impersonation log for their own org
  - Identity resolution hard-wired to `getUser()` then the member row (`supabase.ts:1034-1038`) — needs an "acting as" concept
  - JWT carries no custom claims today (`supabase.ts:1042-1052`) — a time-boxed claim is needed
  - Session expiry is enforced server-side, not by the client
  - pgTAP proves an impersonated session cannot write
  Exit: no path gives `system_admin` org data outside a logged session; every impersonation is visible to the org it touched.

  Audit references (A:1011-1021):
  - Every policy uses `auth.uid()`; no notion of "acting as" — all migrations in audit §5
  - Authorization by the shared `authenticated` role; nothing tells a read-only session from a writing one
  - `supabase.ts:1034-1038`, `supabase.ts:1042-1052`, `src/hooks/useSession.ts:72-93`
  - "Read-only" today is an affordance — `src/lib/viewed-team.ts:90-92`
  - No audit or log table; only actor fields `approved_by`, `notification.actor_id` — `mgr_gen_cols:102-106`, `evt04:78`
  - Definer functions gated only by `is_admin` — `cal11:33-65`, `many_teams:53-206`
  - The mock sets identity from `currentMemberId` in localStorage — `src/lib/data/mock.ts:244-310`
