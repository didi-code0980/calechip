mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.
  Plan S-10 (plan:406-409), from the solo-user section (plan:329-441):
  - Rate limiting on signup without an invitation
  - Email verification
  - A policy for inactive solo accounts

  PHASE 3, DECIDED by the operator 2026-10-20: MIR-26 (the signup path) waits for this item. Open
  signup without a rate limit would be a production hole the day it ships, and the signup path is
  Phase 3.

  Blocked by MIR-10 only: nothing here needs the personal-team schema, so it can land before it.

  Existing hook: email confirmation is already a build-time switch, `VITE_REQUIRE_EMAIL_CONFIRMATION`
  (`src/lib/config.ts:39-43`, `Dockerfile`). Whether it becomes mandatory for uninvited signup is
  decided at PLAN.

  OPEN QUESTION — plan Q3, recorded not resolved: do solo users count toward Org public's member cap
  (`org.max_members`, P3-1)? Related: plan *Deferred* "Member counting — count distinct users, not
  memberships".
  OPEN QUESTION — plan Q7: the inactive-account policy — after how long, and what happens.
