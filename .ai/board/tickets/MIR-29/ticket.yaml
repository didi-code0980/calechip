mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan S-8 (plan:397-403), from the solo-user section (plan:329-441):
  - Move a member and all their dependent rows to another org, in one transaction
  - In dependency order, so the composite foreign keys (MIR-11, P3-2) do not reject it
  - This is the same function the team-level transfer needs: MIR-15 ("Build 'move a team to another
    org' in the system panel", plan:211), built in MIR-18. MIR-15 is not edited.

  Assumption: org-transfer model (a), not confirmed

  When a solo user joins a team in a different org, they change org, and their data migrates across
  the isolation boundary. This preserves the one-user-one-org invariant (P3-1). The alternative — one
  identity holding member records in several orgs — was not chosen. If (b) is chosen, this item becomes
  `WONTDO` and its replacement is appended with the next free number.

  Blocked by MIR-10, MIR-11 (the composite keys whose order this respects), MIR-12 and MIR-25 (the
  personal team the user leaves).

  Rows to move, per P3-2 (plan:175-180): member, membership, entry, event, event_invitee,
  event_attendance, busy_day, notification, issue_report.
