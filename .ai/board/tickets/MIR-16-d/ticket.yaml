mir_detail: |
  Slice 3 of 4 of P4-1 (ADR-083 decision 2). Moved here from MIR-16-b's mir_detail at /plan MIR-16-b:
  - `public.member_role` value 'admin' becomes 'org_admin'; every function body that spells 'admin'
    is re-created, because plpgsql and sql bodies are stored as text. On 2026-11-07 those were
    is_org_admin, member_enforce_role_and_removal, may_decide, set_member_role and
    promote_member_to_admin. Policies and constraints store the enum constant by OID and follow a
    rename on their own; verify at PLAN.
  - the demotion trigger (`profile_self_update:165`, now member_enforce_role_and_removal) names
    `org_admin`; its two-kinds ambiguity is already closed (ADR-083 decision 3)
  - `supabase/bootstrap.sql`, `supabase/seed.sql`, `supabase/tests/_isolation.psql` and the pgTAP
    fixtures that insert 'admin' (13 files on 2026-11-07: 040, 100, 120, 140, 220, 230, 240, 250,
    260, both 270s, and their assertions that read 'admin' back)
  - the member seam maps 'org_admin' to the application's "admin" until MIR-17, so `MemberRole`
    does not change here
  - in Org public, today's admins become its org_admins (ADR-082 decision 3); a rename carries the rows
  Counted roughly at /plan MIR-16-b as ~19 paths. Expected to split again at its own PLAN, likely as
  expand (add the value, write it, read both) then contract (fixtures, then remove 'admin', possibly
  with MIR-16-c's re-creation of the type).
