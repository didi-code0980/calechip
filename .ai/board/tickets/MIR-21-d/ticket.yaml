mir_detail: |
  Slice 2 of 4 of the drop (ADR-080). MIR-21-c ships first and leaves, in the database:
  `membership_refuse_own_rows`, a row trigger refusing a write to the caller's own `membership` rows;
  and a seam whose three row-returning RPC calls read `team_id:roster_team_id`.

  In scope, from ADR-080 decision 2 (as read on 2026-11-06):
  - admit_member, reject_member, move_member and set_member_team stop assigning `team_id`; so does
    supabase/create-account.sql
  - tests that read the column read `member_roster_team_id(id)` instead: supabase/tests/030, 040,
    070, 150, 160, 190, 230
  - the assertions that the column is true are retired: 140's `tests.mirror_violations()`, and
    230 AC-9's column half
  - its own migration and pgTAP test; neither names `member.team_id` (ADR-080 decision 5)

  Not in scope: fixtures that insert the column (MIR-21-e); the drop (MIR-21-f).
  Predicted about eleven paths at /plan MIR-21-c.
