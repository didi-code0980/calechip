mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.
  Plan S-1 (plan:374-376), from the solo-user section (plan:329-441):
  - pgTAP: a personal team cannot gain a second membership, enforced by the database
  - Every write path that can create a membership is attempted: direct insert as each role, admission
    (`admit_member`), moving a member, and any `security definer` function that inserts a membership

  Blocked by MIR-05 (pgTAP exists) and MIR-25 (the column and the constraint under test). A phase 1 item
  blocked by a phase 3 item: the number and the phase do not imply order, `Blocked by` does
  (multi-tenancy-status.md, "The MIR family").

  Expected impact: none — a test changes no feature's behaviour.
