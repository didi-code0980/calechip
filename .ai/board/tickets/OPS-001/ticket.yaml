#
# PR #37 IS OPEN AND UNMERGED. The standard this ticket exists to satisfy —
# `§ Language` in .ai/standards/ui-design-system.md — lives in exactly ONE commit, `3ccbd37`, the
# sole commit of the `ops/ui-language-english` branch. It is NOT on `main`.
#
# IF PR #37 DOES NOT MERGE, THIS TICKET IS INVALID RATHER THAN BLOCKED. There is no standard, so
# there is no chore, and the correct action is to close it — not to wait.
#
# THIS CANNOT BE `depends_on`. That field names TICKETS and is graded by Definition of Ready item 3
# against ticket state. No ticket can name a pull request, so the precondition is written here in
# prose because there is no field that will carry it and nothing in the loop will ask.
#
# CITE THE STANDARD AS `3ccbd37:.ai/standards/ui-design-system.md`, NEVER BARE. On any branch other
# than `ops/ui-language-english`, .ai/standards/ui-design-system.md is the 52-line STUB — and a bare
# line citation does not merely dangle, it RESOLVES TO THE WRONG SECTION: `:44-48` on the stub is
# `## Selectors`. That is worse than a broken reference, because it reads as correct.
