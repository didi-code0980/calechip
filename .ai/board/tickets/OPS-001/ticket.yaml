# 4. `branch: "feat/OPS-001"` — NOT `ops/<slug>`, AND THE COST IS RECORDED RATHER THAN GLOSSED
#
# .ai/standards/git-conventions.md:33 gives chore work the pattern `ops/<slug>` and marks its path
# guard "inactive, correctly". THAT ROW WAS WRITTEN FOR STEWARD CHORES ON THE MODEL PLANE. This
# chore edits SEVEN SHIPPED APPLICATION FILES, which is the case the word "correctly" does not cover.
#
# MEASURED, NOT ASSUMED: scripts/check-allowed-paths.mjs:96-98 exits 0 with "nothing to check" on any
# branch that does not begin `feat/`; :101-103 slices `feat/` off and resolves the remainder to
# .ai/board/tickets/<ID>/ticket.yaml. So an `ops/` branch would run RULE-03 UNENFORCED across shipped
# files, and `feat/OPS-001` is the only name under which the guard is live.
#
# WHAT IT COSTS, and it is the same debt `feat/BUG-001` incurred: git-conventions.md:36 says
# `<FEATURE-ID>` is a row in .ai/registry/features.md and nothing else — and OPS-001 is not a row.
# THE OPERATOR SETTLED THIS EXACT TRADE-OFF FOR `feat/BUG-001` ON 2026-09-03, choosing the enforced
# guard over the documented name with the contradiction in front of them. The full record is the
# §4 CORRECTION block at the end of .ai/board/tickets/BUG-001/ticket.yaml.
#
# ***DO NOT REOPEN IT HERE.*** The residual contradiction with git-conventions.md:36 is standards
# plane under RULE-01, it is unresolved, and it is not this ticket's to resolve. Fixing the two
# resolvers is steward work on an `ops/` branch — do not let it grow into here.
