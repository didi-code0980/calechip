# 1. SCOPE — the chrome, account and team screens. SEVEN FILES PLUS THREE TEST ASSERTIONS.
#
# This is one half of a thirteen-file surface. The other half is OPS-002. The cut is at the
# entry-management boundary and the reason it is cut at all is arithmetic, not taste:
# .ai/01-operating-model.md:374 sizes "more than 12" files as L and says L MUST SPLIT AT PLAN. A
# single thirteen-file ticket would reach PLAN only to be split there.
#
# Interface copy to translate — each with the diacritic line count measured at triage:
#
#   src/App.tsx              2   the mock-seam banner :42, "Đang tải…" :55
#   src/routes/Home.tsx      5   roleLabel :26, body :60, nav :73 and :88, sign-out :99
#   src/routes/SignIn.tsx    4   heading, password label, submit/submitting, one refusal :54
#   src/routes/SignUp.tsx    9   headings, four field labels, submit, TWO aria-labels :124 :128
#   src/routes/NotOnATeam.tsx 4  the whole empty state
#   src/routes/AllowList.tsx 23  headings, table headers, states, confirmation, aria-labels :162 :271
#   src/routes/MemberList.tsx 25 a SECOND roleLabel :23, table headers, confirmation, aria-label :315
#
# Plus exactly THREE assertions in tests/e2e/tea-05-sign-in.spec.ts — :65, :146, :155. They read
# `home-member-role`, which is the label at src/routes/Home.tsx:26, so they move with it.
#
# ***THE OTHER VIETNAMESE IN THAT SPEC FILE MUST NOT MOVE.*** :63, :137 and :140 assert
# `home-member-name`, which is SEED DATA. See §2. Three lines change in that file, not six.
#
# THE ARIA-LABELS ARE THE ONES THAT SURVIVE A CARELESS PASS. Five of them across three files. They
# render nothing visible, so no manual walkthrough and no screenshot will ever catch a missed one.
#
# `roleLabel` IS WRITTEN TWICE — src/routes/Home.tsx:26 and src/routes/MemberList.tsx:23. Both are
# in this ticket, so this is the ticket that can stop them drifting. Whether to fold them into one
# module is PLAN's call, not triage's.
