# 1. SCOPE — SEVEN PATHS, AND ***ZERO SPEC FILES***. THAT IS THE WHOLE POINT OF THIS CUT.
#
#   src/App.tsx                      The route table becomes a layout route. See §2.
#   src/components/AppShell.tsx      NEW — the two-pane frame, the layout route's element.
#   src/components/Sidebar.tsx       NEW — brand lockup, roster, nav, legend card, account footer.
#   src/components/TopBar.tsx        NEW — period controls, the anchor title, the view switcher.
#   src/hooks/useRoster.ts           NEW — the sidebar's roster read.
#   src/index.css                    Shell layout tokens on top of UIE-01's @theme block.
#   src/routes/Home.tsx              ***DELETED.*** See §4.
#
# The four period screens KEEP THEIR OWN HEADERS THROUGH THIS TICKET. Removing them is UIE-03 and
# it is the ONLY one of the three tickets that edits a spec file. ***SO THE APPLICATION IS
# KNOWINGLY DOUBLED AT THE END OF THIS TICKET*** — a shell top bar above a screen's own header,
# two sets of prev/next, two anchors. IT LOOKS WORSE BEFORE IT LOOKS BETTER. That is the price of
# the cut and it is worth paying: nineteen files in one ticket is L, .ai/01-operating-model.md:374
# says L MUST SPLIT AT PLAN, and splitting by surface here means PLAN never has to.
#
# ***PLAN MUST WRITE THE DOUBLING INTO § Out-of-scope AS AN EXPECTED END STATE, NOT LEAVE IT TO BE
# FOUND AT REVIEW.*** A reviewer meeting two headers with nothing saying so reads it as a defect.
#
# ---------------------------------------------------------------------------------------------
# 2. THE SHAPE — A LAYOUT ROUTE WITH AN <Outlet/> AND A CONDITIONAL element. NOT A WRAPPER.
#
#   <Route element={membership.state === "member"
#                     ? <AppShell member={…} signOut={signOut} />
#                     : <BareLayout />}>
#
# ***NOT A WRAPPER AROUND <Routes>.*** A wrapper paints the sidebar on the sign-in and sign-up
# routes too, and the only escape from that is a useLocation() conditional INSIDE the shell — which
# is a route table re-expressed as an if-statement, in a file that already uses the router for
# exactly this six times over.
#
# `BareLayout` is <Outlet/> inside the centred container that exists today. It is what makes §3
# possible.
#
# ---------------------------------------------------------------------------------------------
# 3. ***THE CONDITIONAL IS LOAD-BEARING AND IT IS THE TRAP IN THIS TICKET. READ THIS BEFORE §1.***
#
# ***SIX ROUTES ARE DELIBERATELY UNGUARDED AND EACH RENDERS ITS OWN REFUSAL INSTEAD OF
# REDIRECTING.*** In src/App.tsx:
#
#   the allow-list route     :103-110    -> `allow-list-refused`
#   the member-list route    :111-113    -> `member-list-not-on-a-team`
#   the month route          :142-152
#   the week route           :154-168    -> `week-not-on-a-team`
#   the year route           :170-182
#   the holidays route       :224-243
#
# ***A SHELL THAT RENDERS ONLY FOR `membership.state === "member"` AND REDIRECTS OTHERWISE CONVERTS
# SIX DOCUMENTED REFUSALS INTO REDIRECTS AND DELETES THE COMMENT SAYING WHY EACH ONE EXISTS.***
# Every one of those six carries a comment in the file explaining the choice. A member-less or
# signed-out caller must still REACH the refusal — which is what `BareLayout` is for.
#
# ***THE FOUR MEMBERSHIP GUARDS DO NOT CHANGE AND MUST NOT.*** They stay as each route's own
# `element` conditional INSIDE the layout route:
#
#   the new-entry route      src/App.tsx:117-121
#   the edit-entry route     src/App.tsx:130-134
#   the team-entries route   src/App.tsx:136-140
#   the threshold route      src/App.tsx:196-200
#
# ***WHAT RENDERS OUTSIDE THE SHELL:***
#   - the sign-up route (src/App.tsx:65-67) — reachable in EVERY membership state per ADR-009, and
#     UIE-01 is restyling it in the ticket immediately before this one;
#   - the sign-in route (src/App.tsx:72-81);
#   - the member-less landing resolution to NotOnATeam (src/App.tsx:93).
#
# ***THE `resolving` STATE (src/App.tsx:53-62) ALREADY SITS OUTSIDE <Routes> AND STAYS THERE.*** A
# sidebar whose roster is unknown is worse than the spinner that is there now.
#
# ---------------------------------------------------------------------------------------------
# 4. src/routes/Home.tsx DOES NOT SURVIVE, AND THE LANDING ROUTE KEEPS ITS THREE-WAY SHAPE
#
# For a member the landing route becomes <Navigate to="/week" replace />. Member-less still
# resolves to NotOnATeam and signed-out still goes to the sign-in route, so src/App.tsx:86-99 keeps
# its shape and the catch-all at :252 keeps funnelling unknown addresses through it. THE ELEVEN
# BACK-LINKS THAT POINT AT THE LANDING ROUTE THEREFORE KEEP WORKING — see §5 and UIE-03 §3.
#
# ***LANDING ON THE WEEK VIEW RATHER THAN THE MONTH VIEW IS THE MOCKUP'S DECISION, NOT TRIAGE'S:***
# `Tuần` is the active segment in the transcription.
#
#   src/routes/Home.tsx:47-59   avatar, name, role  -> the sidebar's account footer
#   src/routes/Home.tsx:73-186  the seven links     -> the roster-adjacent nav
#
# ---------------------------------------------------------------------------------------------
# 5. ***THE SELECTOR CONTRACT. ELEVEN IDS RELOCATE, NONE IS RENAMED, AND ZERO SPEC FILES CHANGE.***
#
# All eleven `home-*` ids move out of src/routes/Home.tsx and into the sidebar UNRENAMED. Every
# assertion against them is a visibility, click or text check, and a check like that PASSES WHEREVER
# THE NODE LIVES. The three `toHaveCount(0)` role assertions — tests/e2e/adm-01-threshold.spec.ts:206,
# tests/e2e/cal-03-team-entries.spec.ts:302 and :487, tests/e2e/tea-05-sign-in.spec.ts:156 — pass as
# long as the sidebar keeps the SAME `member.role === "admin"` gating that Home.tsx has today.
#
# ***THE FAILURE MODE IS DUPLICATION, NOT RELOCATION, AND IT IS THE ONE WAY THIS TICKET GOES RED.***
# Render `home-sign-out` — or any of the other ten — in the sidebar AND anywhere else at the same
# time, and ***ELEVEN SPEC FILES FAIL ON A PLAYWRIGHT STRICT-MODE VIOLATION ACROSS 27 REFERENCES.***
# Playwright refuses a locator that resolves to more than one node; it does not pick the first.
# ***PLAN MUST WRITE "EACH home-* ID APPEARS EXACTLY ONCE IN THE RENDERED TREE" AS AN ACCEPTANCE
# CRITERION.*** It is not implied by "the sidebar has a sign-out button".
#
# ***`home-member-role` MUST KEEP THE EXACT STRINGS `Admin` AND `Member`.*** src/routes/Home.tsx:29
# produces them and tests/e2e/tea-05-sign-in.spec.ts asserts them THREE TIMES. The sidebar footer in
# the transcription shows an uppercase `ADMIN`; ***THAT IS A CSS TRANSFORM, NOT A DIFFERENT STRING.***
# Typing `ADMIN` into the JSX breaks three assertions and is the cheapest possible way to fail this
# ticket.
#
