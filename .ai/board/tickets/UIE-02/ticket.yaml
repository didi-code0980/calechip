# That file's *Triage verdict* section is the reasoning; this block carries only what binds PLAN.
#
# ***THE FIRST OF THREE TICKETS FROM ONE IDEA, AND THE ORDER IS STRICTLY SEQUENTIAL:***
#   UIE-01 -> UIE-02 -> UIE-03 -> UIE-04.
# One working directory holds one branch (ADR-006), so exactly one of these is ever in flight. This
# one builds the shell. UIE-03 removes the chrome the shell makes redundant. UIE-04 rewrites the
# week grid into seven columns.
#
# THE VISUAL REFERENCE IS .ai/board/tickets/UIE-02/design/README.md AND IT IS NOT AN IMAGE. One
# image was shown in conversation on 2026-09-05 and IT IS NOT ON DISK. That README is a
# transcription written by `product`, at the canonical path, because there was no file to move —
# the same situation as UIE-01 and handled the same way. ***IT IS THE CANONICAL COPY FOR ALL THREE
# TICKETS***; UIE-03 and UIE-04 quote only the part each owns and cite this one for the whole.
#
# Definition of Ready items 1, 3, 4 and 6 are filled here — they are produced at BACKLOG (ADR-010).
