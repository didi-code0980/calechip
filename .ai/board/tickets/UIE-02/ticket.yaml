# 11. THE ROW IN .ai/registry/features.md
#
# THERE IS A ROW: `UIE-02`, in the `## UIE` section, `Status: PLANNED`, `Invariants touched: []`,
# citing the idea file by name — the provenance ADR-007 requires of every promoted row, written by
# `product` at /triage.
#
# ***feature_ids IS [UIE-02] ALONE.*** .ai/01-operating-model.md:317 makes the ticket ID equal the
# feature ID in the 1:1 case, and this is exactly that case. CAL-04, CAL-05, CAL-06, ADM-02 and
# TEA-03 all shipped surfaces this shell surrounds, and NOT ONE OF THEM IS IN feature_ids: listing
# them would claim this ticket DELIVERS those features, which it does not. The link survives as
# prose, which is where it belongs.
#
# ***UNDER ADR-028's FOUR-STEP TEST THIS IS UIE AT STEP 3.*** Step 1 fails — nothing written down
# says the product should have a shell, so there is no contradiction to point at and it is not a
# BUG. Step 2 fails — after this ticket the product can do nothing it could not do before; every
# screen it reaches was already reachable, two of them by address only. Step 3 answers yes: the
# deliverable is the appearance and interaction of surfaces that already exist, more than one output
# would be acceptable, and somebody has to look at the result and judge it.
