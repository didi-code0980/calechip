# 0. FOUR PREMISES CORRECTED AT TRIAGE. CARRY THEM; DO NOT RE-DERIVE THEM.
#
# Each was measured in this tree on 2026-09-05 against a claim made earlier the same day.
#
# 0.1 IT IS src/App.tsx:35, NOT :33. That file is 260 lines, holds fourteen <Route> elements and
#     SIX membership conditionals, each carrying a comment explaining why it guards or why it
#     deliberately does not. §3 is about those six.
#
# 0.2 ***UIE-01's TICKET IS `BACKLOG`, NOT `PLANNED`.*** .ai/board/tickets/UIE-01/ticket.yaml:13
#     carries `state: BACKLOG`; it is the FEATURE ROW in .ai/registry/features.md that reads
#     `PLANNED`. Two different fields with two different vocabularies, and confusing them makes
#     §6's dependency look further along than it is.
#
# 0.3 ***src/routes/EditEntry.tsx:121 AND :200 ARE NOT BACK-TO-HOME LINKS. LEAVE THEM ALONE.***
#     `edit-entry-back` points at the new-entry route and `edit-entry-team-back` at the team-entries
#     route. They return the caller to the list they arrived from, and NO SHELL CONTROL REPLACES
#     THAT. They are out of scope here and out of scope in UIE-03.
#
# 0.4 ***THE MOCKUP'S ROSTER OF EIGHT IS FICTIONAL AND NOTHING MAY BE ASSERTED FROM IT.***
#     src/lib/fixtures.ts holds FOUR members on the main team who have not been removed — :39, :72,
#     :149, :319. :108 is another team and :123 carries `removedAt`. `TEAM (8)` and `0/8 vắng`
#     cannot be reproduced from fixtures. The count in the sidebar's section label must come from
