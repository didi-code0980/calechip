schema_delta: >-
  NOT none — ADR-014, no carve-out. CORRECTED from `none` by tech-lead-design at PLAN, on the
  same grounds the BA used at TEA-02 (.ai/board/tickets/TEA-02/ticket.yaml:28). The ADM-01 row
  in features.md says `schema_delta` none because `team` and `overload_threshold` are created
  by TEA-01's migration; that is true of the COLUMN and does not settle the PRIVILEGES, which
  the same row requires two sentences earlier. One new migration,
  `supabase/migrations/20260903000000_adm01_team_threshold.sql`, altering no table and adding
  no column: a COLUMN-LEVEL grant `update (overload_threshold) on public.team` to
  `authenticated`, which is what withholds `name` and every other column from everybody — an
  RLS UPDATE policy is row-level and would otherwise turn `set the threshold` into `edit the
  team row`, and no permission row for renaming the team exists anywhere; and the policy
  `team_update_admin`, scoped to an admin of the caller's own team. TEA-01 revoked all on
  `public.team` from `anon` and `authenticated` at
  supabase/migrations/20260831150024_tea01_membership.sql:145, so neither is inherited. No
  trigger, unlike TEA-04 — there is one writable column and nothing here needs a sentence that
  `with check` structurally cannot express. The migration ALSO carries `grant select on
  public.team` and `team_select_own`, and those two statements are the subject of the BLOCKING
  open question: features.md assigns the select policy and grant to CAL-04, the operator
  reordered ADM-01 above CAL-04 on 2026-09-03, and moving that ownership is a registry edit
  under RULE-01. Applying the migration is human, RULE-09. Full statements in 01-plan.md
  section 6.
