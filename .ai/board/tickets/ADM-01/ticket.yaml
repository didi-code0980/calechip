schema_delta: >-
  NOT none — ADR-014, no carve-out. CORRECTED from `none` by tech-lead-design at PLAN, on the same
  grounds the BA used at TEA-02 (.ai/board/tickets/TEA-02/ticket.yaml:28). The ADM-01 row in
  features.md says `schema_delta` none because `team` and `overload_threshold` are created by
  TEA-01's migration; that is true of the COLUMN and does not settle the PRIVILEGES, which the same
  row requires two paragraphs earlier. Approved ADR linked:
  .ai/registry/decisions/ADR-023-the-admin-write-path-on-team.md — `ACCEPTED by tech-lead-design`
  under ADR-008, deciding a question nothing had decided and superseding nothing.
  ONE new migration, supabase/migrations/20260903000000_adm01_team_threshold.sql, altering no table
  and adding no column: `grant update (overload_threshold) on public.team to authenticated`, which
  is what withholds `name` and every other column from everybody — an RLS UPDATE policy is
  row-level and would otherwise turn `set the threshold` into `edit the team row`, and no
  permission row for renaming the team exists anywhere; plus the policy `team_update_admin`, scoped
  to an admin of the caller's own team. TEA-01 revoked all on public.team from anon and
  authenticated at supabase/migrations/20260831150024_tea01_membership.sql:145, so neither is
  inherited. NO trigger, unlike TEA-04 — there is one writable column and nothing here needs a
  sentence that `with check` structurally cannot express. NO select policy and NO select grant: they
  are CAL-04's and stay there, which is the decision rather than an omission (ADR-023 point 3).
  Applying the migration is human, RULE-09. Full statements in 01-plan.md section 6.

