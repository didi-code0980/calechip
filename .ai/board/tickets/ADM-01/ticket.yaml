# AMENDED AT PLAN, from `[TEA-01]`. 01-plan.md section 6 and ADR-023 Decision point 3.
#
# CAL-04 owns the `public.team` select policy and the `grant select` beside it — features.md says so
# on both rows, and ADR-014's Correction of 2026-08-31 exists because an earlier line got that
# ownership wrong. ADM-01 consumes them and does not create them, so it cannot read the value an
# admin is editing until CAL-04 has shipped. The write needs the read too: PostgreSQL requires
# SELECT on any column named in RETURNING, and zero-rows-returned is how a policy refusal is
# detected under RLS.
#
# The triage note below reasoned that reading and writing the threshold is independent of any view.
# That is true of the SCREENS and false of the PRIVILEGES — and the same note, two paragraphs later,
# is what found the privilege problem it did not then follow through to this field.
#
# CONSEQUENCE, stated rather than left to be discovered: Definition of Ready item 3 FAILS until
# CAL-04 is DONE. The orchestrator grades that; this plan does not assert it.
depends_on: [TEA-01, CAL-04]

invariants_touched: []   # 01-plan.md section 2. AGREES with the ADM-01 row in features.md.
                         # Explicit, not absent: setting the threshold changes what is CALLED
                         # overloaded and touches no entry and no count. invariants.md records
                         # "The threshold is 50%" under `Considered and rejected as an invariant`
                         # — configurable, therefore not an invariant — so the one field this
                         # ticket makes writable is the field the register already declined to
                         # constrain. INV-04 is deliberately absent: a change that alters what a
                         # comparison yields, while computing no comparison, cannot produce a
                         # second definition of anything.

