schema_delta: >-
  NOT none — ADR-014, no carve-out. CORRECTED from `none` by tech-lead-design at PLAN on
  2026-09-03, on the same grounds the BA used at TEA-02
  (.ai/board/tickets/TEA-02/ticket.yaml:28), and NARROWED at the 2026-09-05 pass. The ADM-01 row
  in features.md says `schema_delta` none because `team` and `overload_threshold` are created
  by TEA-01's migration; that is true of the COLUMN and does not settle the PRIVILEGES, which
  the same row requires two sentences earlier. One new migration,
  `supabase/migrations/20260905000000_adm01_team_threshold.sql`, altering no table, adding no
  column and creating no function: a COLUMN-LEVEL grant `update (overload_threshold) on
  public.team` to `authenticated`, which is what withholds `name` and every other column from
  everybody — an RLS UPDATE policy is row-level and would otherwise turn `set the threshold`
  into `edit the team row`, and no permission row for renaming the team exists anywhere; and
  the policy `team_update_admin`, scoped to an admin of the caller's own team through
  `public.is_admin` and `public.member_team_id`, both already granted to `authenticated` by
  TEA-01. TEA-01 revoked all on `public.team` from `anon` and `authenticated` at
  supabase/migrations/20260831150024_tea01_membership.sql:145, so neither statement is
  inherited. No trigger, unlike TEA-04 — there is one writable column and nothing here needs a
  sentence that `with check` structurally cannot express. THE SELECT HALF IS NO LONGER HERE:
  the 2026-09-03 pass carried `grant select on public.team` and `team_select_own` and was
  BLOCKED on whether it might keep them; CAL-04 shipped both in
  supabase/migrations/20260904100000_cal04_team_select.sql, merged to main, so a second
  `create policy team_select_own` would now fail on apply. features.md is unedited and no
  registry row moves. Applying the migration is human, RULE-09. Full statements in 01-plan.md
  section 6.
