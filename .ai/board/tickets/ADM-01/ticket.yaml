# Created by `product` at /triage on 2026-08-31, promoting
# .ai/board/ideas/2026-08-31-a-crowded-day-is-discovered-too-late.md.
#
# The first ticket in the ADM group. Definition of Ready item 6 is one feature group per ticket,
# and that is what splits this from CAL-07 rather than any judgement about scope: the warning is
# CAL, the setting is ADM.
#
# Definition of Ready items 1, 3, 4 and 6 are filled here. Items 2 and 5 (invariants_touched,
# size_estimate) are deliberately empty: they belong to the BA at SPEC.
#
# Item 3. TEA-01 alone. This is an admin-only write, so it needs a `member` row with `role = admin`
# and an established session, and TEA-01 creates both the `team` table this row writes to and the
# member record. Not TEA-04 — v1's first admin comes from a seed, per TEA-01's own marker, so this
# does not wait on promotion existing. Not CAL-04 or CAL-07 — reading and writing the threshold is
# independent of any view, and the column has a default, so the setting is useful before the
# warning exists and the warning works before the setting does.
#
# Item 4: `schema_delta: none`. `team.overload_threshold` already exists — TEA-01's migration
# creates it, confirmed in .ai/board/tickets/TEA-01/02-design.md. What this row adds is an RLS
# update policy and a column privilege, not a column.
#
# The column privilege is the part that is easy to lose. An RLS UPDATE policy is row-level and
# permits updating every column of the row it admits, including `name` — and no permission row
# anywhere allows renaming the team. `grant update (overload_threshold) on public.team to
# authenticated` is required beside the policy. TEA-01 revokes all on `public.team` from `anon`
# and `authenticated`, so nothing here is inherited.
#
# Whether a policy-only migration counts as a `schema_delta` is written down nowhere, and this
# ticket makes the fourth to depend on the answer after CAL-02, CAL-03 and CAL-04. Recorded for
# the steward in the triage verdict; not settled here.
