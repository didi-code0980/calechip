# [predicted] at plan time. Corrected at ship in .ai/board/plans/feature-change-log.md.
mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan P0-2 (plan:76-81):
  - Record a reproduction against the real database first — steps in
    `.ai/board/audits/multi-tenancy-audit-2026-10-12-repro.md` § MIR-02
  - Extend trigger `member_enforce_role_and_removal` to refuse a member changing their own `role`,
    `status` or `team_id`
  - Revoke `update (role, status, team_id)` from `authenticated` where the column is not needed;
    route those writes through definer RPCs instead
  - Reconcile the stale comment at `profile_self_update.sql:13-17`
  - Add a pgTAP test proving the change. **That step depends on MIR-05 (P1-1); until MIR-05 is DONE
    the verification is a manual check recorded in the PR** (plan:81)

  Audit references (A:11-36, A:750-758):
  - Column grants to `authenticated`: `tea04:29` `update (role, removed_at)`,
    `profile_self_update:39` `update (display_name, avatar)`, `member_approval:173`
    `update (status, team_id)`
  - Policy `member_update_own` at `profile_self_update:61-64`
  - Trigger `member_enforce_role_and_removal`, final version `profile_self_update:117-204`
  - Stale comment `profile_self_update.sql:13-17` (made untrue by `member_approval.sql`)
  - The mock's `updateOwnProfile` writes only name and avatar, so no current test covers this (A:35-36)
  - `setMemberTeam` `supabase.ts:1609-1614` relies on `member_update_admin` plus `member_update_own` (A:386)
