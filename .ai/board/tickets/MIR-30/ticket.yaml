# [predicted] at plan time. Corrected at ship in .ai/board/plans/feature-change-log.md.
mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan S-9 (plan:404-405), from the solo-user section (plan:329-441):
  - Clear `is_personal` when the owner creates or joins a real team inside Org public
  - Same org, so no org transfer (that is MIR-29)

  Blocked by MIR-10, MIR-12, MIR-25 (the flag), MIR-27 (the forced config that clearing releases) and
  MIR-28 (the listing that clearing changes).

  OPEN QUESTION — plan Q4: what does clearing leave behind — the former personal team as an ordinary
  one-person team (listed, config no longer forced), or its rows moved into the real team? And who may
  create a team in Org public?
