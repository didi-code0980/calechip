# ---------------------------------------------------------------------------------------------
# 1. SCOPE — FIVE PATHS PLUS THE FONT DIRECTORY. Sized and cited by tech-lead-design at triage.
#
#   src/index.css                  @font-face + a @theme token block. TODAY THIS FILE IS ONE LINE,
#                                  `@import "tailwindcss";`. This ticket introduces the FIRST
#                                  palette and the FIRST type scale the real application has had.
#   src/components/AuthCard.tsx    NEW — the ground, the card, the title, the subtitle and the
#                                  segmented control. Presentational; imports nothing below the
#                                  hook layer, so eslint.config.js:60-79 has nothing to fire on
#                                  and RULE-02 is satisfied by construction. CHECKED, NOT ASSUMED.
#   src/routes/SignIn.tsx          Restyle. Its seam call at :37 — signIn({ email, password }) —
#                                  DOES NOT MOVE.
#   src/routes/SignUp.tsx          Restyle. Its seam call at :48 —
#                                  seam.signUp({ email, password, displayName, avatar }) — DOES
#                                  NOT MOVE. Nothing is added to src/lib/data/index.ts:158,303.
#   src/App.tsx                    LINE 35 ONLY. See the argument immediately below.
#   public/fonts/**                2-4 .woff2 files, VIETNAMESE SUBSET EXPLICITLY. See §7.
#
# TWO ROUTES SHARING AN AuthCard, NOT ONE MERGED SCREEN. The segmented control is two <Link>s —
# react-router-dom 7 (package.json:26) supplies them. This changes nothing in the router, nothing in
# App.tsx's membership routing and nothing in any shipped spec. Merging the two routes into one was
# considered and rejected at triage for three measured reasons:
#   - App.tsx:72-81 guards /signin on membership.state === "signed-out" and Navigates away
#     otherwise, while /signup at :65-67 is DELIBERATELY reachable in EVERY membership state
#     (ADR-009: a person who signed up before being allow-listed has an auth user and no member
#     row). Merging forces either loosening the /signin guard — which
#     tests/e2e/tea-05-sign-in.spec.ts:39-56 ASSERTS — or branching that guard on a query parameter
#     inside a component.
#   - tests/e2e/tea-01-signup.spec.ts:45,125,174 navigate to /signup DIRECTLY.
#   - Sign-up's terminal `submitted` state (SignUp.tsx:61-73, TEA-01 AC-13) would have to coexist
#     with a toggle that lets you click away from it.
#
# ***src/App.tsx:35 DESERVES AN ARGUMENT AND TRIAGE MAKES IT RATHER THAN LEAVING IT TO BE FOUND.***
# The line reads `className="min-h-screen bg-slate-50 p-8 font-sans"`. The mockup's flat
# edge-to-edge lavender viewport REQUIRES changing it there — and that one class REPAINTS ALL
# FOURTEEN ROUTES and the seam-banner at :41-50. So either this ticket accepts a slate-50 gutter and
# does not match the reference, or it takes the one-line global change. **TAKE IT.** One class, it
# moves the app TOWARD CLAUDE.md § Visual direction rather than away, and NO TEST ASSERTS A COLOUR —
# grep for `toHaveClass|className|bg-slate-50` across tests/ returns NOTHING. The `font-sans` on
# that same line is what currently resolves to Tailwind's default stack, which is why NINE SHIPPED
# TICKETS have rendered Vietnamese fixture names in whatever the OS supplied.
#
# ---------------------------------------------------------------------------------------------
# 2. ***THE FROZEN-SELECTOR CONSTRAINT. THIS IS WHAT KEEPS THE TICKET S. READ IT BEFORE §1.***
