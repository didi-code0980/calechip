# ***data-testid NAMES ARE FROZEN. NEW CONTROLS MAY ADD SELECTORS. NO EXISTING SELECTOR MAY BE
# RENAMED OR REMOVED.*** This is a CONSTRAINT PLAN MUST WRITE AS A CONSTRAINT, not a hope.
#
# The thirteen, verbatim, every one of which survives a restyle intact:
#
#   sign-in-email          sign-in-password        sign-in-submit         sign-in-error
#   signup-form            signup-email            signup-password        signup-display-name
#   signup-avatar-picker   signup-avatar-option    signup-error           signup-submit
#   signup-confirm-notice
#
# THE ARITHMETIC, AND IT IS THE WHOLE REASON THE RULE EXISTS. TWELVE spec files reference
# `sign-in-*` or `signup-*`: tea-01-signup, tea-05-sign-in, adm-01, adm-02, adm-03, and cal-01
