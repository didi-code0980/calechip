# 3. ONE CORRECTION TO THE IDEA FILE, MEASURED IN THIS TREE — carry it, do not re-derive it.
#
# The idea says the avatar column is `not null` WITH NO DEFAULT. The column IS `not null`
# (supabase/migrations/20260831150024_tea01_membership.sql:35) but the ADMISSION TRIGGER SUPPLIES A
# FALLBACK: :117 writes coalesce(nullif(btrim(new.raw_user_meta_data ->> 'avatar'), ''), '🙂'), and
# :116 does the same for display_name falling back to split_part(new.email, '@', 1).
#
# ***THIS CHANGES WHAT BLOCKS REMOVING THE PICKER: IT IS TEA-01's AC-8, NOT THE COLUMN SHAPE.***
# Recorded because a reader who checks the column and finds a default may conclude the picker is
# free to drop. It is not. See §4.
