# 10. THE ROW IN .ai/registry/features.md, AND WHY feature_ids IS [UIE-01] AND NOT [TEA-01, TEA-05]
#
# THERE IS A ROW: `UIE-01`, in the `## UIE` section, `Status: PLANNED`, `Invariants touched: []`,
# citing the idea file by name — the provenance ADR-007 requires of every promoted row, written by
# `product` at /triage.
#
# ***feature_ids IS [UIE-01] ALONE.*** .ai/01-operating-model.md:317 makes the ticket ID equal the
# feature ID in the 1:1 case, and this is now exactly that case. TEA-01 and TEA-05 are NOT listed,
# for two independent reasons: listing them would CLAIM THIS TICKET DELIVERS THOSE FEATURES, which it
# does not — it restyles the surfaces they shipped — and it would span two groups, putting Definition
# of Ready item 6 back into owing a split rationale for nothing. ***THE LINK SURVIVES AS PROSE IN
# BOTH DIRECTIONS, WHICH IS WHERE IT BELONGS***: the TEA-01 and TEA-05 `Notes` paragraphs point at
# UIE-01, and UIE-01's own `Notes` names them as the rows whose surfaces this restyles.
#
# ***WHAT THIS SECTION SAID BEFORE, KEPT BECAUSE IT WAS THE ARGUMENT AND NOT AN ERROR.*** Until the
# afternoon of 2026-09-05 this section was titled "WHY THERE IS NO NEW ROW IN
# .ai/registry/features.md" and argued: nothing regressed and the current screens are correct, so
# this is not a defect; a row saying "the sign-in screen looks like the product" would file an
# APPEARANCE as something the product CONTAINS; .ai/01-operating-model.md:317 declares chores as
# OPS-nnn; and BUG-001 and OPS-002 had already taken that departure from ADR-007's PROMOTE default.
# The provenance was to be one sentence appended to the `Notes` of TEA-01 and TEA-05, and nothing
# else. It also observed that check D1 could not be tripped, because the prefix marker declared three
# groups and `OPS-003` matched none of them.
#
# ***THE OPERATOR OVERRULED IT***, in these words:
#   "nhưng ticket liên quan UI enhancement tôi đề nghị mở 1 feature group riêng sử dụng UIE
#    (UI enhancement)"
# .ai/registry/decisions/ADR-028-uie-is-a-fourth-feature-group.md records that instruction, declares
# `UIE` as a fourth feature group, and carries the four-step test that decides between UIE, the three
# capability groups, BUG-nnn and OPS-nnn. Under that test this ticket is UIE at step 3: the
# deliverable is the appearance of a surface that already exists, more than one output would be
# acceptable, and somebody has to look at the result and judge it. The two sentences on TEA-01 and
# TEA-05 were NOT deleted and were NOT silently switched to the new ID — each is marked as overruled,
# quotes the instruction, and points here.
#
# ***THE D1 OBSERVATION IS NOW REVERSED AND IT CONSTRAINED THE ORDER OF THE EDIT.*** The prefix
# marker declares four groups, so scripts/check-docs.mjs:154 builds \b(?:CAL|ADM|TEA|UIE)-\d{2}\b and
# `UIE-01` DOES match it. Declaring a prefix with no rows is green; what fails the audit is a document
