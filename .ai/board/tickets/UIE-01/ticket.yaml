# ---------------------------------------------------------------------------------------------
# 4. ***OUT OF SCOPE, AND THESE ARE NEGATIVE REQUIREMENTS — THE KIND NOBODY CHECKS.***
#
# The first three each REVERSE A DECISION ALREADY TAKEN, and each SCOPES OUT WITHOUT TOUCHING THE
# LAYOUT — which is the finding that made this a restyle rather than an ADR.
#
# 4.1 ***DO NOT TRANSLATE ANY COPY ON THESE TWO SCREENS INTO VIETNAMESE.***
#     Reverses .ai/standards/ui-design-system.md § Language — the operator's own instruction of
#     2026-09-03 — and it is LINT-ENFORCED at eslint.config.js:83-92 against `Literal`,
#     `TemplateElement` and `JSXText` under src/. `Đăng nhập`, `Tài khoản`, `Mật khẩu` and
#     `Tạo tài khoản` ALL MATCH [À-ɏḀ-ỿ] (Đ is U+0110). NEITHER ROUTE IS IN
#     copyDebt (ui-language.json:20-26) and that list ONLY EVER SHRINKS — adding to it is named as
#     the failure mode at :10-13. OPS-001 translated these two files and is DONE.
#     COSTS THE LAYOUT NOTHING: `Sign in` / `Sign up`, `EMAIL`, `PASSWORD`, `DISPLAY NAME` fit the
#     same pills at the same widths.
#
# 4.2 ***DO NOT INTRODUCE A USERNAME. IDENTITY STAYS THE EMAIL ADDRESS.***
#     Reverses ADR-009 and, underneath it, ADR-005. THE EMAIL IS THE JOIN KEY:
#     supabase/migrations/20260831150024_tea01_membership.sql:100-105 consumes the allow-list row by
#     matching `a.email = new.email`, and member.id IS auth.users.id. `username` appears ZERO times
#     under src/, supabase/ and .ai/standards/data-model.md. A username needs a new column, a
#     uniqueness constraint, a new allow-list key, a changed trigger, and a way to turn a username
#     into something supabase.auth.signInWithPassword accepts — `schema_delta` NON-EMPTY,
#     `requires_adr: true`, XL.
#     COSTS THE LAYOUT NOTHING: the field is one pill either way; only the label and the
#     placeholder change.
#
# 4.3 ***DO NOT PRINT CREDENTIALS ON THE SIGN-IN SCREEN.***
#     Reverses no accepted ADR but CONTRADICTS SHIPPED BEHAVIOUR and names accounts that DO NOT
#     EXIST — the reference lists min, tram, huy, dat, ngoc, khoa, linh, bao; this product's
#     fixtures are quan, thanh, dung, chi, cu, hoa, khanh (src/lib/fixtures.ts:237-285).
#     TEA-05 AC-2 is "a wrong address and a wrong password are refused identically" —
#     SignIn.tsx:39-44 goes to some length NOT to distinguish the two and
#     tests/e2e/tea-05-sign-in.spec.ts:68-80 ASSERTS it. Printing the valid account list defeats
#     that ON PURPOSE, in a product whose only authorization mechanism is row-level security against
#     a publicly reachable endpoint (.ai/standards/rbac-and-security.md:124, :143).
#     COSTS THE LAYOUT NOTHING: two lines deleted. If a demo affordance is genuinely wanted it
#     belongs behind `seamName === "mock"` beside the existing banner at App.tsx:41-50 — and that is
#     a separate ticket, not a side effect of this one.
#
# 4.4 ***DO NOT REMOVE THE AVATAR PICKER. A RESTYLE MUST KEEP IT.***
#     The reference shows no avatar picker. Dropping it breaks no constraint but breaks TEA-01's
#     AC-8 (SignUp.tsx:109-110), the `complete` gate at SignUp.tsx:31, and FOUR assertions in
#     tests/e2e/tea-01-signup.spec.ts:39,73,78,80. WHERE IT GOES in a card with no room for it is
#     exactly the § Visual specification origination PLAN is granted to make — see §8.
#     A SUGGESTION, TO BE WRITTEN AS AN ACCEPTANCE CRITERION RATHER THAN ASSUMED: a single-row
#     horizontally scrollable strip of `rounded-full` swatches between DISPLAY NAME and EMAIL, at
#     the same 44px rhythm. Removing the picker is a SEPARATE ticket that amends TEA-01's AC-8, and
#     the trigger fallback at migration :117 (§3) is what would make that ticket safe.
#
# 4.5 ***DARK MODE IS OUT OF SCOPE AND § Out-of-scope MUST SAY SO RATHER THAN BE SILENT.***
#     The reference shows one theme. Silence here reads as an omission; it is a decision.
#
# 4.6 ***src/routes/NotOnATeam.tsx IS NOT RESTYLED.*** It is reached IMMEDIATELY AFTER A SUCCESSFUL
