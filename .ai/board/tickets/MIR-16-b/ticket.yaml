mir_detail: |
  Slice 2 of 3 of P4-1 (ADR-082). From ADR-082 decisions 1-3 and MIR-16's mir_detail:
  - `public.member_role` value 'admin' renamed to 'org_admin'; every function body that spells
    'admin' is re-created, because plpgsql and sql bodies are stored as text
  - `is_org_admin(p_uid uuid, p_org_id uuid)` replaces `is_admin(uid)` at every call site, including
    the sign-up queue, `may_manage_event`, the entry decider's admin half, and dedicated-org holiday
    writes
  - the demotion trigger (`profile_self_update:165`) names `org_admin`
  - `supabase/bootstrap.sql`, `supabase/seed.sql` and the pgTAP fixtures that insert 'admin'
  - the member seam maps 'org_admin' to the application's "admin" until MIR-17, so `MemberRole`
    does not change here
  - in Org public, today's admins become its org_admins (ADR-082 decision 3)
  Not counted at /plan MIR-16. Expected to split again at its own PLAN.
