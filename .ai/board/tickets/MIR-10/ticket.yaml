# [predicted] at plan time. Corrected at ship in .ai/board/plans/feature-change-log.md.
mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan P3-1 (plan:167-173), design together with multi-team membership (plan:165):
  - New table `org`: id, `org_code` (unique, immutable), name, `is_shared_tenant`, `max_members`,
    `max_teams`, `plan`, `licence_expires_at`, timezone
  - New table `membership`: id, `org_id`, `team_id`, `member_id`, `role_in_team`, `is_primary`,
    joined/left timestamps
  - `member` keeps `org_id` (one org per user) and loses `team_id`
  - `entry` gains `org_id` and `primary_team_id`; keeps `member_id`
  - Reserved word list for `org_code`: `system`, `api`, `admin`, `login`, `signin`, `signup`, `app`,
    `static`, `public`, `assets`, `healthz`, `fonts`, `images`, `_next`, `index.html`
  - `holiday`: `unique (date)` becomes `unique (org_id, date)`; national set owned by system, org days
    layered on top; teams may add, not remove

  Audit references:
  - `member.team_id` single-valued, `tea01:33`; `member_team_id()` returns one uuid, `member_approval:57-63` (A:967-969)
  - `entry` has no `team_id`, `cal01:45-97` (A:185, A:970)
  - `holiday.date` `unique`, `adm02:33`; seed `adm02seed:30` (A:928)
  - First path segments already in use, and the nginx `try_files $uri/` collision with `fonts`, `images` (A:799-813)

  Expected impact is none here: the design changes no behaviour; MIR-12 and MIR-13 carry it.
