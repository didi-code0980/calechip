# ---------------------------------------------------------------------------------------------
# 1. WHERE THIS CAME FROM
#
# The operator's request, verbatim, 2026-09-08: "thay đổi UI calendar view", with an image.
# Promoted by `product` at /triage from
# .ai/board/ideas/2026-09-08-the-year-grid-is-the-last-calendar-surface-still-drawn-in-defaults.md,
# whose `# Triage verdict — PROMOTE, as UIE-08` section is the reasoning.
#
# THE REQUEST WAS SPLIT IN TWO AT THAT TRIAGE. This ticket is the repaint half. The other half —
# twelve month mini-calendars, four summary cards, and no member dimension — is
# .ai/board/ideas/2026-09-08-the-year-view-is-the-only-screen-that-shows-who-declared-nothing.md,
# ruled NEEDS-ADR, with ADR-032 drafted and `PROPOSED — awaiting the operator`.
#
# ---------------------------------------------------------------------------------------------
# 2. WHAT IT IS, MEASURED AT TRIAGE AGAINST THE TREE
#
# The year view is the LAST calendar surface UIE-01's and UIE-02's tokens never reached.
#
#   src/routes/YearView.tsx:385   status?.nonWorkingReason === "holiday" ? "bg-violet-200"
#                                                                       : "bg-slate-100"
#   src/routes/YearView.tsx:445   !mark ? "bg-slate-100"
#                                       : mark.type === "wfh" ? "bg-emerald-200" : "bg-orange-200"
#   src/routes/YearView.tsx:339   overflow-x-auto rounded-2xl bg-white p-4 shadow-sm
#
# while src/index.css:168-174 carries --color-pto, --color-wfh, --color-holiday and
# --color-overload, and :124 / :127-128 carry --radius-card and --shadow-soft. THE SIDEBAR LEGEND
# BESIDE THIS GRID ALREADY DRAWS FROM THOSE TOKENS, so the legend and the grid it explains are
# painted from two different palettes, permanently side by side. That is the identical defect
# UIE-06 closed on the month screen one day earlier.
#
# src/routes/YearView.tsx:28-31 records WHY it exists: § Colour was TODO(project) when CAL-06
# shipped, so the palette was cited straight to CLAUDE.md § Visual direction.
#
# THE THREE NON-LIST STATES AND THE EMPTY-CALENDAR SENTENCE carry the same default
# `rounded-2xl … shadow-sm` pair (:270, :281, :296, :508). Whether they come with the repaint is
# PLAN's — it is the same screen and the same two token values, and it is the only thing in this
# ticket that could move the file count.
#
# ---------------------------------------------------------------------------------------------
# 3. WHAT MAKES THE SUBSTITUTION SAFE, AND ALL THREE ARE WRITTEN IN THE FILE ALREADY
#
# 3.1 CAL-06 AC-5 TURNS ON THE ATTRIBUTE, NOT THE COLOUR. src/routes/YearView.tsx:433-437 says so
#     in terms: `data-type` is what the criterion reads, "so it keeps AC-5 true when the palette is
#     finally written". The criterion was authored in anticipation of exactly this change.
# 3.2 CAL-06 AC-6 AND INV-05 ARE HELD BY OPACITY PLUS AN `sr-only` WORD (:446-460), not by a
#     border. Both survive a fill substitution untouched. NEITHER SURVIVES A CHANGE OF CELL
#     GEOMETRY, and this ticket proposes none.
# 3.3 THE PER-CELL RENDER BUDGET IS LOAD-BEARING (:332-338, :363-365). ~10,950 cells is why every
#     cell is an ELEMENT reading precomputed values rather than a component. NO LOOKUP, NO
#     DERIVATION AND NO CLASS FUNCTION MAY ENTER THE CELL LOOP.
#
# ---------------------------------------------------------------------------------------------
# 4. THE TEST QUESTION, WHICH IS A MEASUREMENT PLAN MAKES AND TRIAGE DID NOT
#
# Two spec files address year selectors: tests/e2e/cal-06-year-view.spec.ts and
# tests/e2e/cal-08-holiday-shading.spec.ts. UIE-06 found that NO test on the month screen asserted
# a class, a colour or a bounding box, so it opened no spec file. THE SAME IS LIKELY HERE AND IS
# NOT ASSERTED: PLAN measures it. Every count and status assertion this ticket must preserve reads
# a data-* attribute — data-type, data-count, data-day-status, data-bridge, data-member-id,
# data-date, data-month — and this ticket renames none of them.
#
# ---------------------------------------------------------------------------------------------
# 5. ADR-032 IS `PROPOSED` AND THIS TICKET DOES NOT WAIT ON IT AND MUST NOT ANTICIPATE IT
#
# ADR-032 asks whether the year view may stop carrying the member dimension. It is drafted in full
# at .ai/registry/decisions/ADR-032-the-year-view-replaces-its-member-grid-with-twelve-month-cards.md
# and its status is `PROPOSED — awaiting the operator`, on the same test ADR-031 applied one day
# earlier: nine shipped DOMAIN acceptance criteria are the envelope, so an agent may not sign it.
#
# ***THIS TICKET IS PLANNED ON THE ASSUMPTION THAT DECISION IS NOT TAKEN.*** The member grid stays
# exactly where it is and only its paint changes.
#
# THE HONEST COST OF THE SPLIT, STATED HERE RATHER THAN DISCOVERED: if ADR-032 is later accepted,
# THIS WORK IS THROWN AWAY RATHER THAN ADJUSTED. That is the one asymmetry with the UIE-06 /
# ADR-031 pair, where the pending change was a one-line deletion. It is stated on the row and in
# the ADR's § Consequences, and it is not a reason to fold the two together — folding them would
# delete nine criteria inside a ticket whose stated scope is a palette.
#
# ---------------------------------------------------------------------------------------------
# 6. THE THREE INVARIANTS TO LOOK AT — NAMES, NOT AN ANSWER
#
# Definition of Ready item 2 is `tech-lead-design`'s. UIE-06 reached [INV-04, INV-05, INV-06] on
# the month grid without setting out to, and this screen renders the same three facts.
#
#   INV-04 — the `Away` totals strip (:475-492) is `absenceCountsFor` and the grid beside it is
#            `absentDatesByMember`; :468-471 says the two being the same function is what makes a
#            divergence detectable at all. A repaint must not put a filter, a sum or a `.length`
#            anywhere in this file — :18-22 forbids it in terms.
#   INV-05 — the tentative treatment is `opacity-50` plus an `sr-only` span (:446-460). A fill
#            substitution that changes the fill's alpha, or a token with alpha in it, is where
#            "tentative" and "settled" stop being distinguishable.
#   INV-06 — a half day weighs 0.5 and a one-day-wide cell cannot show it. That is TRUE TODAY and
#            is not made worse by paint; it is named so the plan records having looked rather than
#            concluding it away.
#
# ---------------------------------------------------------------------------------------------
# 7. WHAT THIS TICKET DOES NOT DO. THE LOAD-BEARING HALF, AS NEGATIVE REQUIREMENTS
#
#  1. NO MONTH CARDS, NO SUMMARY CARDS, NO REMOVAL OF THE MEMBER DIMENSION. ADR-032's, `PROPOSED`.
#  2. NO VIETNAMESE COPY ANYWHERE. .ai/standards/ui-design-system.md § Language, the operator's own
#     instruction of 2026-09-03, lint-enforced on JSX text under src/ — several of the picture's
#     strings FAIL THE BUILD rather than failing review — with `copyDebt` empty and only ever
#     shrinking. UIE-01, UIE-05 and UIE-06 each refused the identical request.
#  3. NO PEACH→MINT BLEND. It is a NEW day-level derivation, :18-22 forbids this file deriving
#     anything of its own, and no gradient token exists.
#  4. NO `--color-overload` ON THIS SCREEN. :24-26 records that `seam.getTeam()` is deliberately
#     not called and no soft pink appears here. Adding it is a read and a domain state.
#  5. NO SHELL EDIT AT ALL — not the sidebar, not the top bar, not the legend card, not the
#     `Quá tải (>50%)` row (which hardcodes a value ADM-01 lets an admin change), not the floating
#     `?`. THE TRAP UIE-05 AND UIE-06 BOTH NAMED: adjusting a sidebar swatch to match cells this
#     ticket has just repainted will feel like finishing the job. It is still a shell edit.
#  6. NO CHANGE OF CELL GEOMETRY. §3.2 and §3.3.
#  7. NO SELECTOR RENAMED AND NO data-* ATTRIBUTE MOVED.
#  8. NO NEW READ, NO NEW STATE, NO NEW SEAM CALL.
#  9. src/components/Sidebar.tsx:63-64 IS NOT TOUCHED. It carries the same three false clauses
#     UIE-06 corrected in src/index.css and deliberately left alone there: correcting a comment in
#     a shell file puts the whole file in `allowed_paths`, and RULE-03's guard does not distinguish
#     a comment from a rewrite.
# 10. src/routes/WeekView.tsx IS NOT TOUCHED, including its copy of the stale comment in §8.
#
# ---------------------------------------------------------------------------------------------
# 8. ONE STALE COMMENT IN THE FILE THIS TICKET OPENS, REPORTED RATHER THAN ASSIGNED
#
# src/routes/YearView.tsx:174 still cites `MONTH_ENTRY_LIMIT` as the truncation mechanism. CAL-09
# removed that constant's only reader (src/lib/data/supabase.ts:46, :1166-1168; src/lib/data/mock.ts:38);
# src/lib/domain/types.ts:365 survives unread. src/routes/WeekView.tsx:296 carries the same line
# and is out of scope by §7.10.
#
# ONE COMMENT LINE, IN A FILE ALREADY IN SCOPE. Available to PLAN under the small-defect grant in
# .ai/steward/context.md § Autonomy; leaving it is also defensible, since the refusal the sentence
# describes is still correct and only its named mechanism is stale. PLAN SAYS WHICH IT DID.
#
# ---------------------------------------------------------------------------------------------
