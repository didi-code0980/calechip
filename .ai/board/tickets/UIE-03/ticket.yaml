# 8. THE ROW IN .ai/registry/features.md
#
# THERE IS A ROW: `UIE-03`, in the `## UIE` section, `Status: PLANNED`, `Invariants touched: []`,
# citing the idea file by name — the provenance ADR-007 requires of every promoted row, written by
# `product` at /triage.
#
# ***feature_ids IS [UIE-03] ALONE.*** .ai/01-operating-model.md:317 makes the ticket ID equal the
# feature ID in the 1:1 case, and this is exactly that case. CAL-04, CAL-05, CAL-06, ADM-02, ADM-03
# and — since 2026-09-05 — CAL-08 shipped the four screens and the SIX spec files this ticket edits,
# and NOT ONE OF THEM IS IN feature_ids: listing them would claim this ticket DELIVERS those
# features, which it does not — it deletes chrome from the surfaces they shipped. The link survives
# as prose. ***CAL-08 IS THE NEWEST OF THE SIX AND THE ONLY ONE THAT WAS `PLANNED` WHEN THIS SHELL
# WAS WRITTEN;*** it merged in PR #56 the same day and this branch was rebased onto it.
#
# ***UNDER ADR-028's FOUR-STEP TEST THIS IS UIE AT STEP 3.*** Step 1 fails — no acceptance criterion
# and no standard says these screens should have no header of their own; they were built correctly
# against a product that had no shell. Step 2 fails — after this ticket the product can do nothing
# it could not do before, and it can do ONE THING LESS in four places, which is the point. Step 3
# answers yes: the deliverable is the appearance of surfaces that already exist, more than one
# output would be acceptable, and somebody has to look at the result and judge it.
