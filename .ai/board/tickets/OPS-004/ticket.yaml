# 7. `branch: "feat/OPS-004"` — NOT `ops/<slug>`, AND THE ARGUMENT IS WEAKER HERE THAN IT WAS
#
# THE PRECEDENT: scripts/check-allowed-paths.mjs:96-98 exits 0 with "nothing to check" on any branch
# that does not begin `feat/`; :101-103 slices `feat/` off and resolves the remainder to
# .ai/board/tickets/<ID>/ticket.yaml. So an `ops/` name runs RULE-03 UNENFORCED. The operator settled
# that trade-off for `feat/BUG-001` on 2026-09-03 with the contradiction in front of them, and
# OPS-001 and OPS-002 followed it.
#
# WHAT IT COSTS: .ai/standards/git-conventions.md:36 says `<FEATURE-ID>` is a row in
# .ai/registry/features.md and nothing else — and OPS-004 IS NOT A ROW (§9). That residual
# contradiction is standards plane under RULE-01, it is unresolved, and it is NOT REOPENED HERE.
#
# ***WHERE THIS DIFFERS FROM OPS-001 AND OPS-002, AND `product` FLAGS IT RATHER THAN GLOSSING IT:***
# those two edited SHIPPED APPLICATION FILES INCLUDING BOTH HALVES OF THE DATA-ACCESS SEAM, which is
# what made an unenforced RULE-03 unacceptable. This ticket adds ONE NEW FILE under `supabase/` and
# touches no `src/` file at all, so the guard has much less to guard. The argument for `feat/` is
# therefore thinner — but it is not nothing, because the file this ticket adds is the ONLY file in
# the repository intended to be applied BY HAND TO A PRODUCTION DATABASE, and an unguarded branch is
# how something else arrives beside it unnoticed. `product` chose the enforced guard. A human may
# overrule it to `ops/<slug>` at no cost to the work; if they do, RULE-03 is unenforced in CI for
# this ticket and that is the whole of what changes.
#
# ---------------------------------------------------------------------------------------------
# 8. ***THE DOCUMENTATION THIS EXIT WAS COSTED WITH IS HUMAN PLANE, AND THAT IS A TRAP FOR PLAN.***
#
# `tech-lead-design`'s costing of this exit includes "one paragraph in .ai/standards/data-model.md
# § Seed data distinguishing it from the two things already there (:188-200)". THAT FILE IS HUMAN
