# 0. ***THE DECISION THIS TICKET RESTS ON, AND IT IS NOT `depends_on`.***
#
# ADR-030 — .ai/registry/decisions/ADR-030-the-first-admin-arrives-by-a-password-free-bootstrap-file.md
#
# Written by `tech-lead-design` in the SAME /triage run that created this shell, carrying
# `ACCEPTED by tech-lead-design` under ADR-008 on the ADR-024 precedent. `product` did not write it
# and did not read it; it is cited by path because that is what the re-triage verdict rests on.
#
# IF THAT FILE IS NOT ON DISK, its absence is a fact about ordering within one run, not about the
# decision. It is not on `main` until this ticket ships — ADR-023 puts the ADR, the board row, the
# registry sentence and the work in ONE pull request on THIS branch.
#
# ***IF THE OPERATOR DECLINES ADR-030 AT MERGE, THIS TICKET IS INVALID RATHER THAN BLOCKED*** and the
# correct action is to close it. That cannot be `depends_on`, which names TICKETS and is graded by
# Definition of Ready item 3 against ticket state. Nothing in the loop will ask, which is why it is
# prose — the same shape as the PR #37 precondition OPS-001 and OPS-002 carried.
#
# ---------------------------------------------------------------------------------------------
# 1. ***THE PROBLEM, IN ONE PARAGRAPH, SO PLAN DOES NOT HAVE TO RECONSTRUCT IT.***
#
# On a Supabase project this repository has just been pointed at, NOBODY CAN EVER BECOME A MEMBER.
# The cycle is closed at TWO independent links, and the second is the one usually missed:
#
#   added_by -> member -> allowed_email    an allow-list row needs an ADMIN member
#                                          (`added_by uuid not null references public.member (id)`,
#                                          supabase/migrations/20260831150024_tea01_membership.sql:44;
#                                          `allowed_email_insert_admin` requires `is_admin`,
#                                          20260901090000_tea02_allow_list_writes.sql:26-33)
#   team_id  -> team     -> NOTHING        `allowed_email.team_id not null references public.team`
#                                          (…tea01:43) against a table with ZERO ROWS and NO INSERT
#                                          PATH ANYWHERE. Only three tables in the whole schema have
#                                          an insert grant — allowed_email, holiday, entry.
#
# A member arrives ONLY through the trigger at …tea01:78-136, which returns having inserted nothing
# when there is no matching allow-list row (`if v_team_id is null then return new;`, :107-109). And
# `member` MAY NEVER GAIN AN INSERT POLICY — stated as permanent at …tea01:166-173 and repeated at
# supabase/db.sql:740.
#
# THE ONLY EXIT THE REPOSITORY EVER DOCUMENTED WAS `supabase/seed.sql`, AND IT NOW REFUSES TO RUN
# WHERE IT IS NEEDED. Its guard (`supabase/seed.sql:37-49`; :39 is the
# `current_setting('calechip.seed_target', true) <> 'local'` test, and :16-36 is the comment
# explaining it) was added under ADR-024 because every password in that file is PUBLISHED in this
# repository and the file had already been hand-applied to the hosted project.
#
# supabase/db.sql:996-999 says the consequence in its own words: "Standing up a usable project needs
# one team row and one admin member row, by hand."
#
# ---------------------------------------------------------------------------------------------
# 2. SCOPE — ONE HUMAN-APPLIED SQL FILE, PARAMETERISED, WITH NO CREDENTIAL IN IT.
#
# The shape ADR-030 accepted, restated here as the boundary and NOT as a design:
#
#   - A new file under `supabase/`. ADR-030 names it; this shell does not rename it. The technical
#     half's working name was `supabase/bootstrap.sql`.
#   - It reads its inputs from settings the applying human supplies — an EXISTING auth user id and a
#     team name — rather than creating any account. `current_setting(...)` is the mechanism
#     `supabase/seed.sql:39` already uses, so it is not a new one.
#   - It inserts ONE `public.team` row and ONE `public.member` row with `role = 'admin'` for that
#     uid, `on conflict do nothing`.
#   - The sequence it serves: admin zero SIGNS UP THROUGH THE SHIPPED INTERFACE and lands on the
#     member-less state, which ADR-009:78-81 already documents as correct behaviour and TEA-05
#     shipped as `src/routes/NotOnATeam.tsx`. A human then runs this file once. That admin
#     allow-lists everybody else and the ordinary ADR-009 flow runs from there.
#
# ***IT CONTAINS NO PASSWORD AND CREATES NO AUTH USER. THAT IS THE WHOLE DIFFERENCE FROM seed.sql***
# and it is the reason this file may be pointed at a real project while that one may not. If PLAN
# finds itself writing an `encrypted_password` literal, the plan has become `seed.sql` and is wrong.
#
# TWO THINGS ADR-024 REQUIRES OF ANY FILE THAT CREATES ROWS ON A HOSTED PROJECT, and they are
# obligations on this ticket rather than background:
#   - HUMAN-APPLIED AND NAMED, NEVER PERFORMED. RULE-09. `/ship` names the owed operator action; no
#     agent runs this against anything (ADR-024 decision point 2, :81-93).
#   - CONVERGE-ONLY, and preceded by a READ-ONLY LISTING if the project may already hold rows
#     (ADR-024 decision point 4's hazard, :112-124). NOBODY CAN CONFIRM WHAT THE HOSTED PROJECT
#     CONTAINS from this repository — ADR-024 declined a drift detector and the anon key cannot read
#     `auth.users` (…tea01:145). Any plan that assumes the project is empty is assuming.
#
# ---------------------------------------------------------------------------------------------
