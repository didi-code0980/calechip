# 4. `schema_delta: none` — DECIDED HONESTLY, NOT TAKEN FROM THE TEMPLATE
#
# Definition of Ready item 4 (.ai/01-operating-model.md:334) reads "`schema_delta` is `none`, or an
# approved ADR is linked", and warns in bold that A MIGRATION TOUCHING A POLICY, TRIGGER OR
# CONSTRAINT IS NOT `none` — ADR-014. That warning is why this field is argued rather than set.
#
# THE ANSWER IS `none`, AND THE REASON IS THAT THIS TICKET WRITES NO MIGRATION AT ALL. The file it
# adds creates ROWS. It adds no table, no column, no policy, no trigger, no constraint, no grant and
# no function, so ADR-014 does not fire on it. The precedent is exact: ADR-024 governs `seed.sql`,
# which also creates rows and is also not a migration.
#
# ADR-030 IS LINKED IN §0 REGARDLESS — as the decision the whole ticket rests on, NOT as the
# schema-delta ADR item 4 asks for. Those are two different reasons to link an ADR and conflating
# them would make this field look graded when it is not.
#
# ***IF PLAN CONCLUDES OTHERWISE IT STOPS AND ASKS*** rather than correcting this field quietly. The
# two ways it could: a plan that reaches for a `security definer` helper (§3 forbids it), or one that
# denormalises anything onto `member` (a trigger change, and ADR-014 makes that not `none`).
#
# ---------------------------------------------------------------------------------------------
# 5. `feature_ids: [TEA-01]` — ARGUED, BECAUSE `[]` WAS THE OTHER CANDIDATE
#
# THE CASE FOR `[]` IS REAL AND IS WHY THIS PARAGRAPH EXISTS. This ticket delivers no capability. The
# 2026-08-31 verdict ruled that establishing the first admin is NOT something the product offers
# (2026-08-31-nobody-can-join-the-board.md:358-361), TEA-01's own row says the bootstrap "is not a
# capability of this feature", and naming TEA-01 here can be misread as claiming this work completes
# that feature. It does not: TEA-01 ships SIGN-UP, and this file is applied by a human afterwards.
#
# `[TEA-01]` WINS ON TWO GROUNDS, EITHER ALONE SUFFICIENT.
#
#   1. `[]` FAILS DEFINITION OF READY ITEM 1 OUTRIGHT — the item requires the field NON-EMPTY with
#      every ID present in .ai/registry/features.md (.ai/01-operating-model.md:331). An empty list is
#      not a stricter answer, it is a ticket that cannot reach READY.
#   2. TEA-01 IS THE RIGHT ROW RATHER THAN THE CONVENIENT ONE. Its `Notes` cell carries the
#      `TODO(project):` this chore exists to close — "the first-team and first-admin bootstrap is not
#      a capability of this feature — a human applies a seed" (.ai/registry/features.md:126) — and
#      its trigger is the mechanism the bootstrap steps around. No other row in the registry mentions
#      the bootstrap at all.
#
# ***DEFINITION OF READY ITEM 1 CONSTRAINS `feature_ids`, NOT THE TICKET `id`.*** That is what lets a
# `TEA` feature list sit under an `OPS` ticket without contradiction, and it is BUG-001's precedent
# stated in the registry itself: "The ticket carries `id: BUG-001` with `feature_ids: [TEA-01]` —
# Definition of Ready item 1 constrains `feature_ids` and not the ticket `id`" (features.md:126).
#
# ITEM 6 IS SATISFIED WITHOUT A SPLIT RATIONALE. One ID, one group, `group: TEA`.
#
# CHECK D1 IS NOT TRIPPED BY `OPS-004`. scripts/check-docs.mjs builds its pattern from the declared
# prefixes at features.md:66 — `CAL ADM TEA UIE`. `OPS` is not one of them, and
# .ai/01-operating-model.md:317 declares the scheme: "Defects are `BUG-nnn`, chores are `OPS-nnn`".
#
