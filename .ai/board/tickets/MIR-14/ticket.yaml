# [predicted] at plan time. Corrected at ship in .ai/board/plans/feature-change-log.md.
mir_detail: |
  Short names (tea04, cal11, …) are migrations, per the File legend in
  .ai/board/audits/multi-tenancy-audit-2026-10-12.md:38-77. "A:n" is a line of that audit;
  "plan:n" a line of .ai/board/plans/calechip-multi-tenancy-plan.md.

  Plan P3-5 (plan:196-204), approval rules agreed at plan:30-35:
  - Extend `entry_apply_approval_setting` to OR the approval switches across all the owner's teams
  - Record which teams an entry affects, so each relevant manager sees it in their queue
  - First decision wins; clear the other queues
  - Any rejection rejects the entry
  - Record `approved_by` **and** `rejected_by` — today rejection stores no actor (`mgr_gen_cols:107-109`)
  - Record `self_approved` when a manager decides their own entry
  - Fall back to `org_admin` when a team has no manager
  - UI shows which teams an entry affects

  Blocked by MIR-10 (plan:167).

  Audit references (A:834-875):
  - `entry_apply_approval_setting` `approval_settings:102-129`, join `approval_settings:111-118`
  - `may_decide` `manager_role:55-64`; `entry_update_admin` `cal03:80-88`; `entry_update_manager` `manager_role:90-99`
  - A manager may not decide their own entry — `mgr_gen_cols:58-61`
  - Approval records the actor `mgr_gen_cols:102-106`; rejection clears it `mgr_gen_cols:107-109`
  - A substantive edit returns the entry to `pending` — `mgr_gen_cols:122-132`
  - `reject_entries` `adm06:73-86` (security invoker) records no actor
  - Admin self-approval is known weakness 4, `.ai/standards/rbac-and-security.md:251`
  - No audit or change-history table exists
