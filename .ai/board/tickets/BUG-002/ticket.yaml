# 2. WHY `id: BUG-002` WITH FOUR `feature_ids` AND NO NEW FEATURE ROW — AND WHY THE BRANCH IS `feat/`
#
# This is the part of this shell most likely to be read as a mistake, so it is stated first.
#
# `id` AND `feature_ids` ARE DIFFERENT FIELDS — .ai/templates/ticket.yaml:4 and :6. Definition of
# Ready item 1 constrains `feature_ids`, not `id`. So `BUG-002` with `feature_ids: [CAL-03, CAL-04,
# CAL-05, CAL-06]` satisfies item 1 literally, and item 6 too, because all four are `CAL` — exactly
# one feature group. .ai/01-operating-model.md declares the scheme: defects are `BUG-nnn`.
#
# CHECK D1 IS NOT TRIPPED, AND THIS WAS RE-VERIFIED ON DISK RATHER THAN COPIED FROM BUG-001, whose
# note predates the `UIE` group and therefore quotes a stale regex. scripts/check-docs.mjs:194-198
# reads the prefixes from the machine-readable line in .ai/registry/features.md:66, which today
# declares `CAL ADM TEA UIE`; :224-225 builds `\b(?:CAL|ADM|TEA|UIE)-\d{2}\b`. `BUG-002` matches
# neither half — wrong prefix, and three digits against `\d{2}`. The four IDs in `feature_ids` DO
# match and all four resolve to rows, which is what D1 is for.
#
# NO ROW WAS ADDED TO .ai/registry/features.md, a deliberate departure from /triage's default
# PROMOTE action (ADR-007). This is a defect in shipped behaviour, not a new capability, and
# ADR-028:36-39 records that `BUG-nnn` appears on no prefix line, has no rows and is not policed by
# D1; ADR-028:103 — "BUG-001 likewise stays." BUG-001's shell §2 is the precedent. What was written
# instead is a provenance sentence appended to the `Notes` of each of the four CAL rows, citing the
# idea file and this ticket. RULE-01 permits a feature-row edit with no ADR; CODEOWNERS review at
# merge is the approval.
#
# FOUR PARENTS, NOT THREE — A DELIBERATE DEPARTURE FROM `tech-lead-design`'s RECOMMENDATION, WHICH
# WAS [CAL-03, CAL-04, CAL-06]. CAL-05 is added. Its AC-15
# (.ai/board/tickets/CAL-05/01-plan.md:200-204) is falsified by the same constant through the same
# read, so it is a parent of this defect. What is true is that it is the read least likely to reach
# the cap in practice — a seven-day range needs a great many entries spanning it from outside to
# accumulate a thousand rows. THAT IS A STATEMENT ABOUT URGENCY, NOT ABOUT PARENTAGE.
# .ai/standards/git-conventions.md:38-39 requires a bug to carry its parent feature — "a bug branch
# that cannot be traced to a feature is a bug nobody can decide the priority of" — and there are
# four of them.
#
# THE BRANCH IS `feat/BUG-002` AND THE PATH GUARD IS THEREFORE ON. scripts/check-allowed-paths.mjs:96
# exits 0 with "nothing to check" on any branch that does not start with `feat/`; :101-103 computes
# `branch.slice("feat/".length).split("/")[0]` = `BUG-002` and looks for
# .ai/board/tickets/BUG-002/ticket.yaml, which is this file. So on `feat/BUG-002` CI checks the real
# diff against `allowed_paths` and RULE-03 is mechanically enforced; on `bugfix/...` it would not be
# (.ai/standards/git-conventions.md:44-49 calls that a defect rather than a decision). That matters
# more here than it did on BUG-001: this ticket edits shipped application code, not a test harness.
#
# (BUG-001's §4 CORRECTION cites `check-allowed-paths.mjs:90` for that computation. The file has
# moved since; the lines are :96 and :101-103 today. Recorded rather than propagated.)
#
# THE SETTLED PRECEDENT IS BUG-001's `§4 CORRECTION` AND .ai/board/backlog.md:496, so this is not a
# question being re-opened. WHAT IT COSTS, RECORDED HONESTLY RATHER THAN GLOSSED:
# .ai/standards/git-conventions.md:36 says `<FEATURE-ID>` is a row in .ai/registry/features.md and
# nothing else, and `BUG-002` is not a row. That inconsistency is standards plane under RULE-01, is
