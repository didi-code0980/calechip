# 3. THE FOUR FIX SHAPES — ALL OPEN. THE RECOMMENDATION IS A RECOMMENDATION.
#
# The idea file's Open questions item 1 is NOT answered by triage, and this section does not answer
# it either. It carries what was already reasoned so PLAN starts there rather than re-deriving it.
#
#   (a) LOWER THE TWO CONSTANTS below 1000. Smallest diff, entirely in the repository. It costs the
#       year view first — the year read is the largest legitimate row count in the product, and a
#       ceiling low enough to be honest may be low enough that a real team's year hits it, turning a
#       silent wrong count into a screen that refuses to render. That is the correct failure and it
#       is still a failure.
#
#       ***THE REAL CONTENT OF (a) IS NOT THE TWO NUMBERS.*** It is that the fix should NAME
#       `DATASTORE_MAX_ROWS = 1000` in the repository, citing index.d.mts:3522, with every ceiling
#       defined BELOW it and a static test asserting that relation. Today five constants are written
#       against a number that appears nowhere in the tree, which is exactly how two of them drifted
#       above it without anything noticing. NAMING IT IS WHAT STOPS A SIXTH CONSTANT BEING WRITTEN
#       AGAINST A NUMBER NOBODY WROTE DOWN.
#
#   (b) RAISE THE PROJECT'S `max-rows` API SETTING. Keeps every constant and every screen as
#       shipped. ***READ §4 BEFORE CONSIDERING THIS ONE.***
#
#   (c) PAGE EXPLICITLY WITH `range()`. The only shape that scales with the year view rather than
#       against it, and it is pre-authorised — .ai/board/tickets/CAL-04/01-plan.md:177-179 and
#       ADR-015:380. It is also by far the largest: a loop inside the seam, in BOTH implementations,
#       preserving src/lib/data/supabase.ts:1166-1167's deterministic order and surviving
#       tests/seam-parity.test.ts.
#
#   (d) ADM-04's SHORT-PAGE PATTERN, ADAPTED TO A CEILING READ VIA `count: "exact"`. Request the
#       ceiling with an exact count, then compare `count > LIMIT` (more rows match than were asked
#       for) and `rows.length < count` (fewer arrived than match). `count` alongside `.limit()`
#       returns THE TOTAL MATCHING ROWS, NOT THE PAGE SIZE — verified at index.d.mts:3519, and that
#       is the whole reason this works on a ceiling read.
#
# THE RECOMMENDATION FROM `tech-lead-design`, RECORDED AS A RECOMMENDATION AND NOT AS A DECISION:
# (d) PLUS THE NAMING HALF OF (a). Its argument is that this fixes DETECTION WITHOUT CHANGING EITHER
# NUMBER, so it reaches into no shipped threshold, moves no acceptance criterion, and needs no
# judgement about what a real team's row count is — which is the one input nobody has.
#
# ITS COSTS, RECORDED WITH IT RATHER THAN LEFT FOR REVIEW TO FIND:
#   - A `COUNT(*)` ON EVERY CALENDAR READ. This is the price ADM-04 already pays and already
#     documented — .ai/board/tickets/ADM-04/01-plan.md:262-264. It is a known cost, not a new one,
#     but the calendar reads are the hot path and ADM-04's worklist is not.
#   - ***THE MOCK'S COPY OF THE SECOND COMPARISON IS DEAD CODE, BY CONSTRUCTION.*** src/lib/data/mock.ts
#     slices deterministically (:1227), so it can never return fewer rows than match and
#     `rows.length < count` can never be true there. It must be written as UNREACHABLE-AND-MIRRORED,
#     with a comment saying so, or the two implementations diverge in SHAPE while
#     tests/seam-parity.test.ts — which compares names and arity only — sees nothing. That is the
#     same silent-divergence failure CAL-04's and CAL-08's rows both warned about.
#
# ---------------------------------------------------------------------------------------------
# 4. ***THE GUARDRAIL. FIX SHAPE (b) MUST NOT BE CHOSEN INSIDE THIS TICKET.***
#
# Raising the project's `max-rows` setting is file-representable and CLI-pushable, and that makes it
# MORE tempting rather than less: `supabase init` generates `supabase/config.toml` carrying
# `max_rows = 1000`, and `supabase config push` exists. The CLI is installed — package.json:39,
# `supabase@^2.116.0`. So the shape that looks unavailable is in fact reachable, which is exactly
# why the fence is written down instead of assumed.
#
# THREE REASONS IT IS OUT OF BOUNDS HERE:
#   1. It ADDS A REPOSITORY ARTIFACT THAT DOES NOT EXIST. There is no supabase/config.toml in the
#      tree today — `supabase/` holds bootstrap.sql, db.sql, migrations/ and seed.sql and nothing
#      else. Generating one is a decision about how this project is configured, not a bug fix.
#   2. It ADDS A DEPLOYMENT STEP THAT DOES NOT EXIST, and makes a PRODUCT CORRECTNESS PROPERTY
#      depend on a value no file in the tree records and no check can verify. A reviewer cannot see
#      it in a diff; the next project provisioned starts at 1000 again and the constants are wrong
#      for a second time with nobody watching.
#   3. IT POINTS THE WRONG WAY. The setting's own purpose is to limit payload size against accidental
#      or malicious requests, and under ADR-005 the anon key is public and the PostgREST endpoint is
#      reachable without this application at all. Raising it to make one screen work loosens a
#      control that is not there for this screen's benefit.
#
# IT FAILS ADR-008's TEST — decide inside the envelope, ask before changing it.
#
# ***IF PLAN CONCLUDES (b) IS RIGHT, THE CORRECT VERDICT FROM PLAN IS `BLOCKED` WITH
# `requires_adr: true`.*** Not a quiet configuration change, and not a `TODO` in an implementation
# log. `requires_adr: false` above is scoped to shapes (a), (c) and (d).
#
# ONE `TODO(verify):` TRAVELS WITH THIS AND IS NOT DISCHARGED: whether `supabase config push`
# actually carries `api.max_rows` to a HOSTED project cannot be confirmed without a linked project,
# and none is provisioned. So even the argument FOR (b) rests on an unverified mechanism.
#
# ---------------------------------------------------------------------------------------------
# 5. HOW THIS TICKET PROVES IT IS FIXED — the part most likely to be assumed and least likely to be
#    true by accident
#
# EVERY RUNNER DRIVES THE MOCK. playwright.config.ts:50 pins `VITE_DATA_SEAM: "mock"` for the whole
# acceptance suite (BUG-001's own fix), and the mock's assertions say in their own comments that
# they are decorative — src/lib/data/mock.ts:1230-1231. The only implementation that can truncate is
# the one no runner drives.
#
# THE E2E SPEC HEADERS' CLAIM IS HALF TRUE, AND THE HALF THAT IS FALSE IS THE USEFUL ONE:
#   - "No test can make PostgREST cap a read without a provisioned project" — TRUE, and it stays
#     true. Nothing in this ticket changes it.
#   - "The mock's entry table is bounded by the fixtures" — TRUE OF THE E2E FIXTURES ONLY.
#     tests/pending-entries.test.ts:98-110 seeds 51 entries through `seam.createEntry`, so a vitest
#     test can seed N entries and observe the mock's own ceiling behaviour at any N it likes. The
#     mock is not bounded; the e2e fixture set is.
#
# ***THE TEST THAT GENUINELY OBSERVES THIS FIX IS STATIC, AND IT COSTS NOTHING.*** With
# `DATASTORE_MAX_ROWS` named (§3(a)), assert that each of the five ceilings is STRICTLY BELOW it. It
# FAILS TODAY at both broken constants, PASSES after the fix, and catches `HOLIDAY_LIMIT`'s
# exactly-equal boundary as a bonus — the one that survives today only because the comparison at
# src/lib/data/supabase.ts:1235 is `>=` and not `>`.
#
# That test does not depend on a datastore, a fixture, a runner or a provisioned project, which is
# what makes it the one piece of evidence available. A behavioural test against a truncating
# datastore is NOT available and §9 says so as out of scope rather than leaving it to be discovered
# at Definition of Done item 4.
#
