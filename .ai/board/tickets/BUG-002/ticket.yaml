# 1. WHY THIS TICKET EXISTS, AND WHY IT IS ROW 1
#
# It has been owed since 2026-09-05. ADM-04's PLAN found it, verified it, and REFUSED TO FIX IT for
# a stated reason — .ai/board/tickets/ADM-04/01-plan.md:275-302: changing two numbers in
# `src/lib/domain/types.ts` inside a ticket whose `invariants_touched` is `[]` would silently alter
# two other tickets' acceptance criteria. That judgement was correct and this ticket does not
# revisit it; it is the ticket that judgement asked for.
#
# The board has carried the debt in four places since — src/lib/domain/types.ts:488-496,
# .ai/board/tickets/ADM-04/01-plan.md:275-302, and twice in .ai/board/backlog.md (:352-362 as the
# finding, :278-282 as owed item 1). Every one of them says the same thing: nothing on this board
# issues the row automatically, and /triage issues it.
#
# IT IS ROW 1 BECAUSE IT IS THE ONLY ROW. `## BACKLOG` in .ai/board/backlog.md was empty when this
# was written — the second time in the board's life. `product` asserts nothing about priority; the
# header of that file says a human reorders, and this shell does not argue with it.
#
# WHAT IS ACTUALLY BROKEN, in one paragraph so nothing downstream has to reconstruct it:
# `TEAM_ENTRY_LIMIT` (src/lib/domain/types.ts:251) and `MONTH_ENTRY_LIMIT` (:300) are both 2000
# while the datastore caps at 1000 (index.d.mts:3522). Both reads ask for 2000
# (src/lib/data/supabase.ts:1033 and :1168), the server returns at most 1000, so
# `rows.length >= 2000` at :1044 and :1181 can never be true. The read comes back short, comes back
# as a SUCCESS, and is summed. Four written statements are falsified by those two integers: CAL-04
# AC-11, CAL-05 AC-15, CAL-06 AC-14, and CAL-03's own § 4.1 contract sentence.
