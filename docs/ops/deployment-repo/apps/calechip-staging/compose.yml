# CaleChip STAGING on the home server. DRAFT (docs/ops/staging.md), copied to the deployment repository
# by the operator. Same server and tunnel network as production; its own project, service and image.
#
# The image comes only from release.env, which calechip's release workflow writes (CICD-04) as
#   CALECHIP_IMAGE=mingming21400/calechip-staging:vX.Y.Z@sha256:<digest>
#   CALECHIP_VERSION=vX.Y.Z
# Deploy with: docker compose -p calechip-staging -f apps/calechip-staging/compose.yml --env-file apps/calechip-staging/release.env up -d --wait
#
# No ports, no secrets, no volumes: the container is static nginx on :3000, every VITE_* value is
# baked into the image, and cloudflared reaches it by service name on the network. The one
# environment value is CALECHIP_VERSION, the release tag the sidebar footer shows; it is not a secret,
# and when it is missing the footer shows the image's build commit instead.

name: calechip-staging

services:
  calechip-staging:
    image: ${CALECHIP_IMAGE:?CALECHIP_IMAGE is unset - pass --env-file apps/calechip-staging/release.env}
    restart: unless-stopped
    environment:
      CALECHIP_VERSION: ${CALECHIP_VERSION:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks: [tunnel]

networks:
  tunnel:
    external: true
    # The network cloudflared is on. The deploy refuses to run while this placeholder is here.
    name: TODO-operator-tunnel-network
