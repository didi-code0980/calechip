# nginx for the CaleChip container. Runs as the unprivileged `nginx` user, so the pid file and
# every temp path live under /tmp/nginx rather than /var/run and /var/cache.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path       /tmp/nginx/proxy;
  fastcgi_temp_path     /tmp/nginx/fastcgi;
  uwsgi_temp_path       /tmp/nginx/uwsgi;
  scgi_temp_path        /tmp/nginx/scgi;

  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;

    # TLS ends at Cloudflare; the tunnel speaks plain HTTP to this port.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Vite's hashed output never changes under the same name.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }

    # index.html must always be revalidated, or a deploy is invisible until the cache expires.
    location = /index.html {
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options nosniff always;
    }

    # SPA fallback: every unknown path is a client-side route (`BrowserRouter`).
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
