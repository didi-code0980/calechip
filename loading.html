<style>
 /* HTML: <div class="loader"></div> */
.loader {
  width: 120px;
  height: 20px;
  background: 
    linear-gradient(90deg, #0000 ,rgb(122, 62, 220)) left -50px top 0/50px 20px no-repeat

  animation: l2 1s infinite linear;
}
@keyframes l2 {
  100% {background-position: right -50px top 0}
}
